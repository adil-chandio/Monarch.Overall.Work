name: Render 2D celebrity film

on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths:
      - '.github/workflows/celebrity-2d-film.yml'
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core ffmpeg
          pip install -q pillow numpy imageio-ffmpeg
      - name: Check the cel library is present
        run: |
          ls -l showreel/celebrity_story_2d/assets/frames/
          ls -1 showreel/celebrity_story_2d/assets/*.png
      - name: Render frames
        run: |
          set -o pipefail
          python showreel/celebrity_story_2d/film_a.py --scale 1.0 --out "$RUNNER_TEMP/silent.mp4" 2>&1 | tail -40
          ls -lh "$RUNNER_TEMP/silent.mp4"
      - name: Mix and encode
        run: |
          set -o pipefail
          mkdir -p deliverables
          python showreel/celebrity_story_2d/mix2d.py "$RUNNER_TEMP/silent.mp4" "$RUNNER_TEMP/mix.mp4" 2>&1 | tail -20
          ffmpeg -y -v error -i "$RUNNER_TEMP/mix.mp4" \
            -c:v libx264 -preset slow -crf 23 -pix_fmt yuv420p -profile:v high -level 4.1 \
            -c:a aac -b:a 192k -movflags +faststart -shortest \
            deliverables/monarch-celebrity-story-2d-60s.mp4
          ffmpeg -y -v error -i "$RUNNER_TEMP/mix.mp4" \
            -c:v libx264 -preset veryfast -crf 26 -vf scale=608:1080 \
            -c:a aac -b:a 128k -movflags +faststart -shortest \
            deliverables/monarch-celebrity-story-2d-60s-preview.mp4
      - name: Verify duration and loudness
        run: |
          ffmpeg -v error -i deliverables/monarch-celebrity-story-2d-60s.mp4 -f null - 2>&1 | tail -3
          ffmpeg -i deliverables/monarch-celebrity-story-2d-60s.mp4 -af loudnorm=print_format=summary -f null - 2>&1 | grep -E 'Input Integrated|Input True Peak|Input LRA' || true
          ls -lh deliverables/monarch-celebrity-story-2d-60s.mp4 deliverables/monarch-celebrity-story-2d-60s-preview.mp4
      - name: Publish blob identifiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python showreel/celebrity_story_2d/publish_blob.py \
            deliverables/monarch-celebrity-story-2d-60s.mp4 \
            deliverables/monarch-celebrity-story-2d-60s.json
          python showreel/celebrity_story_2d/publish_blob.py \
            deliverables/monarch-celebrity-story-2d-60s-preview.mp4 \
            deliverables/monarch-celebrity-story-2d-60s-preview.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deliverables/monarch-celebrity-story-2d-60s.json deliverables/monarch-celebrity-story-2d-60s-preview.json
          git commit -m 'Record 2D film render blobs [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
      - name: Publish failure detail
        if: failure()
        run: |
          mkdir -p docs/ci
          echo 'the 2D film render failed; see the job log for the render tail' > docs/ci/2d-film.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ci/2d-film.txt
          git commit -m 'Record 2D film render failure [skip ci]' || true
          git push origin HEAD:arena/1f352b8e-monarch-overall-work || true
