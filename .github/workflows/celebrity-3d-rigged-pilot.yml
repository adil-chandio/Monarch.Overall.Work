name: Render celebrity story 3D v2
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [.github/workflows/celebrity-3d-rigged-pilot.yml]
permissions:
  contents: read
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        index: ['00','01','02','03','04','05','06','07','08','09','10','11']
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxfixes3 libxxf86vm1 libsm6 libice6 libxkbcommon0 libgl1
          pip install -q 'bpy==4.2.23' numpy Pillow imageio-ffmpeg
      - name: Fetch pinned character and furniture assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python showreel/celebrity_lookdev/fetch_assets.py "$RUNNER_TEMP/assets"
      - name: Render five seconds
        env:
          IDX: ${{ matrix.index }}
        run: |
          start=$((10#$IDX * 5)); end=$((start + 5))
          python showreel/celebrity_story_3d_v2/render.py --assets "$RUNNER_TEMP/assets" --samples 2 --fps 24 --width 640 --start "$start" --end "$end" --output "$RUNNER_TEMP/$IDX.mp4" > "$RUNNER_TEMP/render.log" 2>&1 || { tail -100 "$RUNNER_TEMP/render.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: clip-${{ matrix.index }}
          path: ${{ runner.temp }}/${{ matrix.index }}.mp4
          retention-days: 1
