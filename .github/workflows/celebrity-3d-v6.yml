name: Render 3D celebrity film v6
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [.github/workflows/celebrity-3d-v6.yml]
permissions:
  contents: write
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        index: ['00', '01', '02', '03', '04', '05', '06', '07', '08']
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxfixes3 libxxf86vm1 libsm6 libice6 libxkbcommon0 libgl1 fonts-dejavu-core
          pip install -q 'bpy==4.2.23' numpy Pillow imageio-ffmpeg
      - name: Fetch licensed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q requests
          python showreel/celebrity_lookdev/fetch_assets.py "$RUNNER_TEMP/assets"
          python showreel/celebrity_story_3d_v6/fetch_extra.py "$RUNNER_TEMP/assets"
      - name: Build narration from saved takes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p showreel/celebrity_story_3d_v6/audio
          python showreel/celebrity_story_3d_v6/fetch_audio.py
          python showreel/celebrity_story_3d_v6/build_narration.py
      - name: Render five seconds
        env:
          IDX: ${{ matrix.index }}
        run: |
          start=$((10#$IDX * 5)); end=$((start + 5))
          python showreel/celebrity_story_3d_v6/render.py --assets "$RUNNER_TEMP/assets" \
            --samples 3 --width 540 --start "$start" --end "$end" \
            --output "$RUNNER_TEMP/$IDX.mp4" > "$RUNNER_TEMP/render.log" 2>&1 || { tail -80 "$RUNNER_TEMP/render.log"; exit 1; }
          ls -lh "$RUNNER_TEMP/$IDX.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: clip-${{ matrix.index }}
          path: ${{ runner.temp }}/${{ matrix.index }}.mp4
          retention-days: 1
  assemble:
    needs: render
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: clip-*
          path: ${{ runner.temp }}/clips
          merge-multiple: true
      - name: Build narration again for mixing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q imageio-ffmpeg numpy
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p showreel/celebrity_story_3d_v6/audio
          python showreel/celebrity_story_3d_v6/fetch_audio.py
          python showreel/celebrity_story_3d_v6/build_narration.py
      - name: Assemble, mix and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y -qq fonts-dejavu-core
          python showreel/celebrity_story_3d_v6/mux.py "$RUNNER_TEMP/clips" "$RUNNER_TEMP/silent.mp4"
          mkdir -p deliverables
          cp "$RUNNER_TEMP/silent.mp4" deliverables/celebrity-story-third-person-3d-v6.mp4
          ls -lh deliverables/celebrity-story-third-person-3d-v6.mp4
          shasum -a 256 deliverables/celebrity-story-third-person-3d-v6.mp4
      - name: Publish blob identifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request
          path='deliverables/celebrity-story-third-person-3d-v6.mp4'
          data=open(path,'rb').read()
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',
            data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=300) as r: x=json.load(r)
          print('BLOB',x['sha'],len(data))
          open('deliverables/celebrity-story-third-person-3d-v6.json','w').write(json.dumps({'blob':x['sha'],'size':len(data)})+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deliverables/celebrity-story-third-person-3d-v6.json
          git commit -m 'Record v6 render blob [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
