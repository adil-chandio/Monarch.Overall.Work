name: Inspect 3D release upload

on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: ['.github/workflows/celebrity-premium-diagnostics.yml']

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Export failed job log for review
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run view 43163810689 --repo "$GH_REPO" --log-failed > "$RUNNER_TEMP/failure.log" || true
          test -s "$RUNNER_TEMP/failure.log"
          python - <<'PY'
          import base64,json,os,urllib.request
          path=os.path.join(os.environ['RUNNER_TEMP'],'failure.log'); data=open(path,'rb').read()
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',
            data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=120) as response: sha=json.load(response)['sha']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: print('sha='+sha,file=out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ steps.info.outputs.sha }}
          path: ${{ runner.temp }}/failure.log
          retention-days: 1
