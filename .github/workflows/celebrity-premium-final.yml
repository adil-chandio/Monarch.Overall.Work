name: Finalize upgraded celebrity 3D preview

on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: ['.github/workflows/celebrity-premium-final.yml']

permissions:
  actions: read
  contents: write

jobs:
  revise:
    strategy:
      fail-fast: false
      matrix:
        index: ['05','06','07','08','09']
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxfixes3 libxxf86vm1 libsm6 libice6 libxkbcommon0 libgl1 ffmpeg
          python -m pip install -q 'bpy==4.2.23' 'numpy==2.2.6' 'Pillow==13.0.0' 'imageio-ffmpeg==0.8.1' 'pybullet==3.2.7'
      - name: Fetch licensed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python showreel/celebrity_premium_3d/fetch_assets.py "$RUNNER_TEMP/assets"
      - name: Render corrected crowd shots
        env:
          IDX: ${{ matrix.index }}
          CINEMA_ASSETS: ${{ runner.temp }}/assets
          CINEMA_THREADS: '2'
        run: |
          set -euo pipefail
          n=$((10#$IDX)); first=$((n*72)); start=$((n*3)); end=$((start+3))
          if [ "$IDX" = 05 ]; then python showreel/celebrity_premium_3d/probe_motion.py; fi
          mkdir -p "$RUNNER_TEMP/frames"
          python -u showreel/celebrity_premium_3d/render.py --width 480 --samples 4 \
            --start "$start" --end "$end" --out "$RUNNER_TEMP/frames" > "$RUNNER_TEMP/render.log" 2>&1 || { tail -120 "$RUNNER_TEMP/render.log"; exit 1; }
          test "$(find "$RUNNER_TEMP/frames" -name 'frame_*.png' | wc -l)" -eq 72
          ffmpeg -y -v error -framerate 24 -start_number "$first" -i "$RUNNER_TEMP/frames/frame_%05d.png" \
            -frames:v 72 -an -c:v libx264 -preset fast -crf 16 -pix_fmt yuv420p -r 24 "$RUNNER_TEMP/$IDX.mp4"
          test "$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/$IDX.mp4")" = 72
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: foreground-log-${{ matrix.index }}
          path: ${{ runner.temp }}/render.log
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: foreground-${{ matrix.index }}
          path: ${{ runner.temp }}/${{ matrix.index }}.mp4
          retention-days: 1
          if-no-files-found: error
  finish:
    needs: revise
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for the coffee-shot correction
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run watch 43163810689 --repo "$GH_REPO" --exit-status --interval 20
      - name: Retrieve original render shards
        uses: actions/download-artifact@v4
        with:
          pattern: clip-*
          path: ${{ runner.temp }}/clips
          merge-multiple: true
          run-id: 43162462129
          github-token: ${{ github.token }}
      - name: Retrieve coffee correction shards
        uses: actions/download-artifact@v4
        with:
          pattern: replacement-*
          path: ${{ runner.temp }}/fixes
          merge-multiple: true
          run-id: 43163810689
          github-token: ${{ github.token }}
      - name: Retrieve crowd correction shards
        uses: actions/download-artifact@v4
        with:
          pattern: foreground-*
          path: ${{ runner.temp }}/foreground
          merge-multiple: true
      - name: Assemble and verify final cut
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/fixes/03.mp4" "$RUNNER_TEMP/fixes/04.mp4" "$RUNNER_TEMP/fixes/05.mp4" "$RUNNER_TEMP/clips/"
          for i in 05 06 07 08 09; do cp "$RUNNER_TEMP/foreground/$i.mp4" "$RUNNER_TEMP/clips/$i.mp4"; done
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -q 'numpy==2.2.6' 'Pillow==13.0.0' 'imageio-ffmpeg==0.8.1' 'pybullet==3.2.7'
          python -m unittest discover -s showreel/celebrity_premium_3d/tests -v
          python showreel/celebrity_premium_3d/assemble.py "$RUNNER_TEMP/clips" "$RUNNER_TEMP/celebrity-cycles-3d-upgrade.mp4"
          ffprobe -v error -count_frames -show_streams -show_format -of json "$RUNNER_TEMP/celebrity-cycles-3d-upgrade.mp4" > "$RUNNER_TEMP/probe.json"
          python - "$RUNNER_TEMP/probe.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          video=next(s for s in p['streams'] if s['codec_type']=='video')
          audio=next(s for s in p['streams'] if s['codec_type']=='audio')
          assert (video['width'],video['height'])==(480,854)
          assert video['r_frame_rate']=='24/1' and int(video['nb_read_frames'])==1440
          assert audio['codec_name']=='aac' and audio['sample_rate']=='48000'
          assert abs(float(p['format']['duration'])-60)<.05
          print('Verified',video['nb_read_frames'],'frames and 60-second AAC audio')
          PY
          sha256sum "$RUNNER_TEMP/celebrity-cycles-3d-upgrade.mp4" > "$RUNNER_TEMP/sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: finished-film
          path: |
            ${{ runner.temp }}/celebrity-cycles-3d-upgrade.mp4
            ${{ runner.temp }}/probe.json
            ${{ runner.temp }}/sha256.txt
          retention-days: 2
          if-no-files-found: error
      - name: Update unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit celebrity-3d-cycles-upgrade --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --notes-file showreel/celebrity_premium_3d/RELEASE_NOTES.md
          gh release upload celebrity-3d-cycles-upgrade --repo "$GH_REPO" --clobber \
            "$RUNNER_TEMP/celebrity-cycles-3d-upgrade.mp4" showreel/celebrity_premium_3d/ASSET_CREDITS.txt
      - name: Expose a verified blob identifier for local review
        id: blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,urllib.request
          path=os.path.join(os.environ['RUNNER_TEMP'],'celebrity-cycles-3d-upgrade.mp4')
          data=open(path,'rb').read();digest=hashlib.sha256(data).hexdigest()
          payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=payload,
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=300) as response: blob=json.load(response)['sha']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              print('sha='+blob,file=out);print('digest='+digest,file=out)
          print('Verified transfer object created; size',len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: film-${{ steps.blob.outputs.sha }}-${{ steps.blob.outputs.digest }}
          path: ${{ runner.temp }}/sha256.txt
          retention-days: 2
          if-no-files-found: error
