name: Transfer upgraded 3D preview for verification

on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: ['.github/workflows/celebrity-premium-transfer.yml']

permissions:
  actions: read
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Wait for the render and retrieve its checked artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run=43162462129
          gh run watch "$run" --repo "$GH_REPO" --exit-status --interval 20
          gh run download "$run" --repo "$GH_REPO" --name upgraded-film --dir "$RUNNER_TEMP/film"
          file="$RUNNER_TEMP/film/celebrity-cycles-3d-upgrade.mp4"
          expected=$(awk '{print $1}' "$RUNNER_TEMP/film/sha256.txt")
          echo "$expected  $file" | sha256sum -c -
      - name: Copy the verified bytes to a Git object for sandbox review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          path=os.path.join(os.environ['RUNNER_TEMP'],'film','celebrity-cycles-3d-upgrade.mp4')
          data=open(path,'rb').read()
          payload=json.dumps({'content':base64.b64encode(data).decode('ascii'),'encoding':'base64'}).encode('utf-8')
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=payload,
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=300) as response: blob=json.load(response)['sha']
          print('TRANSFER_BLOB',blob,'SHA256',hashlib.sha256(data).hexdigest(),'SIZE',len(data),flush=True)
          PY
