name: Publish rebuilt celebrity 3D preview

on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths:
      - '.github/workflows/celebrity-rebuilt-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Retrieve the verified picture and publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/celebrity-rebuilt-3d-preview.mp4"
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GITHUB_REPOSITORY/git/blobs/32b95d203f4c8144d7d2cf4b597cbd4211c9e111" > "$file"
          echo "664f9c666291e59e749657fda1a4b7a3524ef775941682880cc2593054dc847c  $file" | sha256sum -c -
          gh release upload celebrity-3d-rebuilt-preview "$file" --repo "$GH_REPO"
          gh release edit celebrity-3d-rebuilt-preview --draft=false --repo "$GH_REPO"
          gh release view celebrity-3d-rebuilt-preview --repo "$GH_REPO" --json assets \
            --jq '.assets[] | [.name,.size,.state,.url] | @tsv'
