name: Inspect every coconut animation frame
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [scripts/coconut_allframes.py, .github/workflows/coconut-allframes.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python scripts/coconut_allframes.py
      - name: Save annotated CC BY-SA 2.0 sheets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repo-intel/open-animation-motion/coconut/allframes
          git diff --cached --quiet && exit 0
          git commit -m 'Record every decoded reference animation frame [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
