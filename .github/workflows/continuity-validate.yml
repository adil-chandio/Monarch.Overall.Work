name: Continuity archive validation

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'RECOVER.md'
      - 'MONARCH_CAM.md'
      - 'config/continuity.json'
      - 'config/channels.json'
      - 'tools/continuity.py'
      - 'docs/continuity/**'
      - 'docs/MONARCH_CAM_*.md'
      - 'production/monarch-cam/short_ranking_raw_v5/**'
      - '.github/workflows/continuity-validate.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'RECOVER.md'
      - 'MONARCH_CAM.md'
      - 'config/continuity.json'
      - 'config/channels.json'
      - 'tools/continuity.py'
      - 'docs/continuity/**'
      - 'docs/MONARCH_CAM_*.md'
      - 'production/monarch-cam/short_ranking_raw_v5/**'
      - '.github/workflows/continuity-validate.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate state, evidence hashes and generated ledgers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile continuity tool
        run: python3 -m py_compile tools/continuity.py

      - name: Validate continuity archive
        run: python3 tools/continuity.py validate

      - name: Verify active channel capsule renders
        run: python3 tools/continuity.py channel

      - name: Check generated ledgers are current
        run: python3 tools/continuity.py render --check
