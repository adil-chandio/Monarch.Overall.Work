name: DIAG push-helper probe
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/diag-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Replicate the v8 commit step
        run: |
          set -x
          git config user.name 'probe'
          git config user.email 'probe@example.com'
          mkdir -p production/extinct-life/film-v8-premium/inspection
          echo "{\"probe\": $(date +%s)}" > production/extinct-life/film-v8-premium/inspection/motion-QC.json
          mkdir -p .cache/extinct-v8 && echo dirty > .cache/extinct-v8/leftover
          git add production/extinct-life/film-v8-premium/inspection || true
          echo "ADD_EXIT=$?"
          git status --short | head -5
          if git diff --cached --quiet; then
            echo "NOTHING STAGED"
          else
            git commit -m 'probe [skip ci]'
            echo "COMMIT_EXIT=$?"
            bash scripts/git-push-retrying.sh arena/ba8d901e-monarch-overall-work || echo "PUSH_HELPER_EXIT=$?"
          fi
