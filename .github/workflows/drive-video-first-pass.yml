name: Inspect shared long video samples
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [scripts/drive_video_first_pass.py, .github/workflows/drive-video-first-pass.yml]
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download user-shared link without storing media in repository
        run: |
          python -m pip install -q 'gdown==5.2.0'
          gdown --id 1KOpLeqa8LjHkf3oGs-7F5dZ0JFreI-X8 -O "$RUNNER_TEMP/source.mp4"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$RUNNER_TEMP/source.mp4"
      - name: Inspect short samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOURCE_VIDEO: ${{ runner.temp }}/source.mp4
        run: python scripts/drive_video_first_pass.py
      - name: Save scope-limited analysis
        run: |
          cp audit-output/drive-video-first-pass.json docs/repo-intel/drive-video-first-pass.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repo-intel/drive-video-first-pass.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Drive video sample analysis [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
      - name: Remove source from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/source.mp4"
