name: Prepare documentary footage
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [.github/workflows/duck-footage-v2.yml]
permissions:
  contents: write
jobs:
  footage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - name: Fetch credited clips
        run: |
          python -m pip install -q imageio-ffmpeg
          F=$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')
          mkdir -p showreel/duck_cinema/assets
          curl -fL --retry 3 --max-time 240 'https://upload.wikimedia.org/wikipedia/commons/1/12/Duck_Race_2022_-_Fontainebleau.webm' -o /tmp/ducks.webm
          "$F" -y -loglevel error -ss 12 -i /tmp/ducks.webm -t 48 -vf 'scale=1280:-2' -an -c:v libx264 -preset fast -crf 24 -pix_fmt yuv420p showreel/duck_cinema/assets/ducks-event.mp4
          curl -fL --retry 3 --max-time 240 --range 0-60000000 'https://upload.wikimedia.org/wikipedia/commons/7/7a/Container_Ship_Dashcam_Around_The_World_In_70_Days_Timelapse%2C_4k%2C_60fps.webm' -o /tmp/ship.webm
          "$F" -y -loglevel error -i /tmp/ship.webm -t 28 -vf 'scale=1280:-2' -an -c:v libx264 -preset fast -crf 24 -pix_fmt yuv420p showreel/duck_cinema/assets/ship-dashcam.mp4
      - name: Commit excerpts
        run: |
          git config user.name 'MONARCH render'
          git config user.email 'render@monarch.studio'
          git add -f showreel/duck_cinema/assets/ducks-event.mp4 showreel/duck_cinema/assets/ship-dashcam.mp4
          git commit -m 'Add attributed documentary B-roll excerpts [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
