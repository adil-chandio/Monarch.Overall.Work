name: Publish duel release asset

on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths:
      - '.github/workflows/duel-release.yml'
      - 'showreel/stickman/DUEL_RELEASE_NOTES.md'
      - 'deliverables/monarch-duel-1080x1920.mp4'
      - 'deliverables/monarch-duel-preview.mp4'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
          lfs: false

      - name: Confirm the masters are present
        run: |
          ls -lh deliverables/monarch-duel-1080x1920.mp4
          ls -lh deliverables/monarch-duel-preview.mp4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete stickman-duel-1080x1920 --yes --cleanup-tag 2>/dev/null || true
          gh release create stickman-duel-1080x1920 \
            deliverables/monarch-duel-1080x1920.mp4 \
            deliverables/monarch-duel-preview.mp4 \
            --title "Monarch - the duel (4.75 s, 1080x1920, 24 fps)" \
            --notes-file showreel/stickman/DUEL_RELEASE_NOTES.md \
            --target arena/1f352b8e-monarch-overall-work
          echo '--- assets:'
          gh release view stickman-duel-1080x1920 --json assets \
            -q '.assets[] | .name + " " + (.size|tostring) + " " + .state'
