name: Extinct Life expanded script corpus
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths:
      - .github/workflows/extinct-expanded-study.yml
      - scripts/expand-extinct-script-corpus.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expanded-public-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ba8d901e-monarch-overall-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install yt-dlp
      - name: Resolve existing metadata key without printing it
        env:
          KEY_PRIMARY: ${{ secrets.YOUTUBE_API_KEY }}
          KEY_ALT: ${{ secrets.YTAP1 }}
          KEY_ALT_2: ${{ secrets.YTAPI1 }}
          KEY_ALT_3: ${{ secrets.YT_KEY }}
          KEY_ALT_4: ${{ secrets.YT_API_KEY }}
        run: |
          KEY="${KEY_PRIMARY:-${KEY_ALT:-${KEY_ALT_2:-${KEY_ALT_3:-$KEY_ALT_4}}}}"
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "YOUTUBE_API_KEY=$KEY" >> "$GITHUB_ENV"
          fi
      - name: Retrieve only public captions and bounded public metrics
        run: python scripts/expand-extinct-script-corpus.py
      - name: Preserve derivative research, never complete competitor transcripts
        if: always()
        run: |
          SOURCE=docs/research/data/extinct-expanded-study
          if [ ! -d "$SOURCE" ]; then exit 1; fi
          git config user.name 'Monarch script research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$SOURCE"
          git commit -m 'Record expanded public script corpus evidence [skip ci]'
          bash scripts/git-push-retrying.sh arena/ba8d901e-monarch-overall-work
