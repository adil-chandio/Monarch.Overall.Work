name: Extinct Life v4 — assembly recovery (saved renders)
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/extinct-film-v4-recovery.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  assemble:
    name: Natural English voice, original score, encode and technical QC
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m venv .venv
          .venv/bin/pip install imageio-ffmpeg==0.6.0 numpy==2.2.6
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42237420816
          pattern: picture-*
          path: .cache/pictures
      - name: Collect exactly sixteen non-overlapping continuous frame ranges
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          source=Path('.cache/pictures');dest=Path('.cache/extinct-v4')
          for report in source.rglob('render-*.json'):
              data=json.loads(report.read_text());chapter=int(data['chapter'][1:])-1
              target=dest/f'ch{chapter:02}';target.mkdir(parents=True,exist_ok=True)
              shutil.copy2(report,target/report.name)
              name=f'part-{data["first_frame"]}-{data["last_frame_exclusive"]}.mp4'
              shutil.copy2(report.parent/name,target/name)
          PY
      - name: Assemble full candidate, measure loudness, decode every frame
        run: |
          .venv/bin/python - <<'PYTHON'
          import runpy,traceback
          try:
              runpy.run_path('production/extinct-life/film-v4/finish.py',run_name='__main__')
          except Exception as e:
              detail=traceback.format_exc()+'\n'+str(getattr(e,'stderr',''))[-7000:]
              print('::error::'+detail.replace('%','%25').replace('\r','%0D').replace('\n','%0A'),flush=True)
              raise
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: Full-English-1080p-candidate-and-QC
          path: |
            deliverables/Extinct_Life_v4_Continuous_English_1080p.mp4
            production/extinct-life/film-v4/English-v4.srt
            production/extinct-life/film-v4/QC.json
          retention-days: 90
      - name: Durable GitHub download — explicitly a production candidate, not owner-approved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="extinct-life-v4-recovery-${GITHUB_RUN_ID}"
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Extinct Life — full English v4 production candidate" --notes "Full-length 1920×1080 / 30 fps rendered candidate. Unchanged approved natural English voice; no speed changes. Eighteen continuous narrative sequences instead of 211 forced coverage cuts. Different seeded physical sets, continuous Hermite camera tracks and full-frame scale bridges; revised chapter score and continuous environment foley. No reused v3 video frames. Original procedural score/foley. Illustrative animal stand-ins, laboratory and molecular scenes are not observed study footage or calibrated simulations. Technical QC is attached; it is not a claim of owner creative approval, a human full-length AV review, or premium/photoreal quality. No YouTube upload." deliverables/Extinct_Life_v4_Continuous_English_1080p.mp4 production/extinct-life/film-v4/English-v4.srt production/extinct-life/film-v4/QC.json
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
