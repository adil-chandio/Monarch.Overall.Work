name: Extinct Life actual opening-media review
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths:
      - scripts/review-extinct-motion.py
      - .github/workflows/extinct-motion-review.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-public-openings:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -q 'yt-dlp[default]' pillow
      - name: Try public review excerpts; never use private cookies or bypass access gates
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_COMPALI: ${{ secrets.COMPALI }}
        run: python scripts/review-extinct-motion.py
      - name: Return inspection evidence, not third-party video files
        if: always()
        run: |
          git config user.name 'Monarch motion review'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/research/data/extinct-motion-review/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(yt): record actual opening-media access evidence [skip ci]'
          git push origin HEAD:arena/ba8d901e-monarch-overall-work
