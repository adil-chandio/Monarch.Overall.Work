name: Extinct Life — production-craft evidence (no film render)
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/extinct-production-study.yml, scripts/research-extinct-production.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-production-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ba8d901e-monarch-overall-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'yt-dlp[default]' pillow imageio-ffmpeg
      - name: Use existing metadata connection without revealing credentials
        env:
          KEY_PRIMARY: ${{ secrets.YOUTUBE_API_KEY }}
          KEY_ALT: ${{ secrets.YTAP1 }}
          KEY_ALT_2: ${{ secrets.YTAPI1 }}
          KEY_ALT_3: ${{ secrets.YT_KEY }}
          KEY_ALT_4: ${{ secrets.YT_API_KEY }}
        run: |
          KEY="${KEY_PRIMARY:-${KEY_ALT:-${KEY_ALT_2:-${KEY_ALT_3:-$KEY_ALT_4}}}}"
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "YOUTUBE_API_KEY=$KEY" >> "$GITHUB_ENV"
          fi
      - name: Inspect public publisher media and bounded public metrics, not just titles
        run: python scripts/research-extinct-production.py
      - name: Preserve derivative evidence only, never third-party media for production
        if: always()
        run: |
          git config user.name 'Monarch production research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/research/extinct-production-study/evidence/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record public production-craft retrieval evidence [skip ci]'
          git pull --rebase origin arena/ba8d901e-monarch-overall-work
          git push origin HEAD:arena/ba8d901e-monarch-overall-work
