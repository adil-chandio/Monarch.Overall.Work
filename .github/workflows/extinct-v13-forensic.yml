name: V13 released-master forensic evidence — no film changes
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/extinct-v13-forensic.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.4.6 pillow==12.1.0 imageio-ffmpeg==0.8.1
      - name: Retrieve the exact final released asset, not a scene recreation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/v13-review
          gh release download extinct-life-v13-full-pov-42402505284 --pattern Extinct_Life_V13_Full_POV_English_1080p.mp4 --output .cache/v13-review/released.mp4
      - name: Decode and measure every frame; extract complete one-second and selected temporal/full-resolution evidence
        run: python production/extinct-life/review-v13/extract_evidence.py
      - name: Save compact evidence, never the large movie or raw audio, on the session branch
        run: |
          git config user.name 'Monarch released-film forensic audit'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # media folders are excluded by .gitignore now, so the commit must be conditional
          bash scripts/git-commit-if-changed.sh 'Extract exact released V13 frame, timing and signal evidence for independent creative audit [skip ci]' production/extinct-life/review-v13
          git pull --rebase origin arena/ba8d901e-monarch-overall-work
          git push origin HEAD:arena/ba8d901e-monarch-overall-work
