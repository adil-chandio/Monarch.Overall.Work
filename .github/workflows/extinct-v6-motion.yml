name: V4-based actual 3D motion revision — selected excerpt
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/extinct-v6-motion.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extinct-v6-motion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pictures:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          npm install --no-save --package-lock=false three@0.187.0 playwright@1.64.1 @sparticuz/chromium@153.0.0
          python -m venv .venv
          .venv/bin/pip install imageio-ffmpeg==0.8.1 numpy==2.4.6
          python production/extinct-life/film-v6-motion/prepare.py
          node production/extinct-life/film-v6-motion/motion.test.mjs
      - name: Verify absolute seek and subject motion with a locked camera
        if: matrix.part == 0
        run: node production/extinct-life/film-v6-motion/render.mjs --stills
      - name: Render every native 3D frame in this non-overlapping range
        env:
          PART: ${{ matrix.part }}
        run: |
          BOUNDS=$(python -c 'import os,json; n=json.load(open("production/extinct-life/film-v6-motion/schedule.json"))["total_frames"]; i=int(os.environ["PART"]); print("--from="+str(n*i//6)+" --to="+str(n*(i+1)//6))')
          node production/extinct-life/film-v6-motion/render.mjs $BOUNDS
      - uses: actions/upload-artifact@v4
        with:
          name: v6-native-${{ matrix.part }}
          path: |
            .cache/extinct-v6/part-*.mp4
            .cache/extinct-v6/render-*.json
            .cache/extinct-v6/seek-QC.json
            .cache/extinct-v6/stills/
          include-hidden-files: true
          retention-days: 14
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m venv .venv
          .venv/bin/pip install imageio-ffmpeg==0.8.1 numpy==2.4.6
          .venv/bin/python production/extinct-life/film-v6-motion/finish.py --audio-only
      - uses: actions/upload-artifact@v4
        with:
          name: v6-attributed-audio
          path: |
            .cache/extinct-v6/sb_hiraeth.mp3
            production/extinct-life/film-v6-motion/MUSIC-LICENSE.json
            production/extinct-life/film-v6-motion/CREDITS.md
          include-hidden-files: true
          retention-days: 3
  assemble:
    needs: [pictures, score]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m venv .venv
          .venv/bin/pip install imageio-ffmpeg==0.8.1 numpy==2.4.6
      - uses: actions/download-artifact@v4
        with:
          pattern: v6-*
          path: .cache/extinct-v6
          merge-multiple: true
      - name: Assemble original voice, attributed composed music and native frames
        run: .venv/bin/python production/extinct-life/film-v6-motion/finish.py
      - name: Publish the actual motion excerpt, not a final-film claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="extinct-life-v6-motion-${GITHUB_RUN_ID}"
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title 'V4-based moving 3D revision — 61-second selected development excerpt' --notes "Actual native mesh animation, not generated scene-image slides. Three evolving 3D stages with transport, deposition, foot-contact changes and articulated one-way takeoff. Existing approved English voice; selected excerpts, not the finished 7:19 film. Stylized illustrative assets, NOT photoreal or expert-validated anatomy. Music: 'Hiraeth' by Scott Buckley - released under CC-BY 4.0. www.scottbuckley.com.au . https://creativecommons.org/licenses/by/4.0/ . Music excerpted, faded and mixed under narration; no endorsement implied. Foley is original synthesis, not recorded field sound. Technical checks do not establish owner creative approval or human listening. No YouTube upload." .cache/extinct-v6/Extinct_Life_V6_Actual_3D_Motion_Development.mp4 production/extinct-life/film-v6-motion/QC.json production/extinct-life/film-v6-motion/CREDITS.md
          echo "${TAG}" > .cache/extinct-v6/release-tag.txt
      - name: Preserve released QC and provenance on this session branch
        run: |
          cp .cache/extinct-v6/seek-QC.json production/extinct-life/film-v6-motion/seek-QC.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          b=Path('production/extinct-life/film-v6-motion');q=json.load(open(b/'QC.json'));tag='extinct-life-v6-motion-'+os.environ['GITHUB_RUN_ID'];base='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/releases/'
          d={'status':'Selected 3D development excerpt; NOT the final film','release':base+'tag/'+tag,'video':base+'download/'+tag+'/Extinct_Life_V6_Actual_3D_Motion_Development.mp4','sha256':q['sha256'],'bytes':q['bytes'],'seconds':q['duration_seconds'],'full_film_complete':False}
          (b/'DELIVERY.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name 'Monarch native 3D production'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add production/extinct-life/film-v6-motion
          git commit -m 'Record released moving-3D excerpt QC and attribution [skip ci]'
          git pull --rebase origin arena/ba8d901e-monarch-overall-work
          git push origin HEAD:arena/ba8d901e-monarch-overall-work
