name: V9 full English film — authored assets and native inspection
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/extinct-v9-full.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extinct-v9-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original sculpt and native rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libxi6 libxrender1 libxfixes3 libxxf86vm1 libsm6 libice6 libxkbcommon0
          npm install --no-save --package-lock=false three@0.187.0 playwright@1.64.1 @sparticuz/chromium@153.0.0
          python -m venv .venv
          .venv/bin/pip install bpy==4.2.0 numpy==1.26.4 pillow==11.3.0 imageio-ffmpeg==0.8.1
      - name: Export four original continuous organic actor assets
        run: .venv/bin/python production/extinct-life/film-v9-full/export_assets.py
      - name: Native full-film stage inspection and absolute-time motion checks
        run: node production/extinct-life/film-v9-full/render.mjs --stills
      - name: Preserve reusable assets and actual inspection on the session branch
        run: |
          cp -r .cache/extinct-v9/stills production/extinct-life/film-v9-full/inspection
          cp .cache/extinct-v9/seek-QC.json production/extinct-life/film-v9-full/seek-QC.json
          git config user.name 'Monarch native full-film production'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add production/extinct-life/film-v9-full/native-meshes production/extinct-life/film-v9-full/inspection production/extinct-life/film-v9-full/seek-QC.json
          git diff --cached --quiet || git commit -m 'Preserve V9 original actor assets and full-timeline native inspection [skip ci]'
          git pull --rebase origin arena/ba8d901e-monarch-overall-work
          git push origin HEAD:arena/ba8d901e-monarch-overall-work
      - uses: actions/upload-artifact@v4
        with:
          name: v9-original-actors-and-native-inspection
          path: |
            production/extinct-life/film-v9-full/native-meshes
            .cache/extinct-v9/stills
            .cache/extinct-v9/seek-QC.json
          include-hidden-files: true
          retention-days: 7
