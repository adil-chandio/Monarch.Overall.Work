name: Transfer encrypted screen recording for review
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [scripts/forensic/encrypted_screen_transfer.py, .github/workflows/forensic-encrypted-screen.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve shared source
        run: |
          python -m pip install -q 'gdown==5.2.0'
          gdown --id 1hV2Gf3UER6CzBK-YXe7mURVVO13abIUC -O "$RUNNER_TEMP/source.mp4"
      - name: Encrypt and transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/forensic/encrypted_screen_transfer.py
      - name: Record ciphertext identifiers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repo-intel/encrypted-screen-transfer.json
          git commit -m 'Record encrypted screen transfer manifest [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
      - name: Remove runner files
        if: always()
        run: rm -f "$RUNNER_TEMP/source.mp4" "$RUNNER_TEMP/source.enc" "$RUNNER_TEMP/pass" "$RUNNER_TEMP/pass.enc"
