              discovered = probe_handle(tok_cand, k_cand, u_cand or fallback_u)
              final_u = discovered or u_cand or fallback_u
              print(f"::notice::Slot {slot_name} -> discovered={discovered or 'none'}, final_u={final_u}", flush=True)
              candidates.append((slot_name, final_u, k_cand, tok_cand))

          if not candidates:
              print("::error::No Kaggle credentials found in Actions Repository Secrets.", flush=True)
              raise SystemExit(1)

          # Prefer any account whose handle is NOT unverified 'alielitee' if multiple exist
          chosen = next((c for c in candidates if c[1].lower() != "alielitee"), candidates[0])
          slot_used, u, k, tok = chosen

          kdir = pathlib.Path.home() / ".kaggle"
          kdir.mkdir(parents=True, exist_ok=True)
          if not tok:
              (kdir / "kaggle.json").write_text(json.dumps({"username": u, "key": k}))
              os.chmod(kdir / "kaggle.json", 0o600)

          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"KAGGLE_USERNAME={u}\n")
              fh.write(f"KAGGLE_KEY={k}\n")
              if tok:
                  fh.write(f"KAGGLE_API_TOKEN={tok}\n")
          print(f"::notice::Selected slot={slot_used} | Kaggle user={u} (token_mode={bool(tok)})", flush=True)
          PY

      - name: Generate AI motion clips
        run: |
          if grep -q 'portrait-diagnose' production/mafia-temple/trigger.txt; then
            bash production/mafia-temple/diagnose_liveportrait.sh
          elif grep -q 'liveportrait-pilot' production/mafia-temple/trigger.txt; then
            bash production/mafia-temple/run_liveportrait_pilot.sh
          elif grep -q 'wan-batch-v4' production/mafia-temple/trigger.txt; then
            bash production/mafia-temple/run_wan_alternates.sh
          elif grep -q 'wan-batch-v3' production/mafia-temple/trigger.txt; then
            bash production/mafia-temple/run_wan_batch.sh
          elif grep -q 'wan-pilot' production/mafia-temple/trigger.txt; then
            bash production/mafia-temple/run_wan_pilot.sh
          elif grep -q 'diagnose-v2' production/mafia-temple/trigger.txt; then
            bash production/mafia-temple/diagnose_v2.sh
          elif grep -q 'native-motion-v2' production/mafia-temple/trigger.txt; then
            bash production/mafia-temple/run_v2.sh
          elif grep -q 'walking-retry' production/mafia-temple/trigger.txt; then
            bash production/mafia-temple/run_retry.sh
          else
            bash production/mafia-temple/run_gpu.sh
          fi
      - name: Upload research pilot for review (no automatic Git commit)
        uses: actions/upload-artifact@v4
        with:
          name: portrait-pilot-research
          path: production/mafia-temple/portrait-pilot-output/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save motion clips to the session branch
        run: |
          if grep -q 'liveportrait-pilot' production/mafia-temple/trigger.txt; then
            echo 'Research pilot is an Actions artifact; not committing it.'
            exit 0
          fi
          git config user.name "MONARCH GPU Runner"
          git config user.email "gpu@monarch.studio"
          if grep -q 'portrait-diagnose' production/mafia-temple/trigger.txt; then
            git add -f production/mafia-temple/diagnostics-liveportrait.json
          elif grep -q 'diagnose-v2' production/mafia-temple/trigger.txt; then
            git add -f production/mafia-temple/diagnostics-v2.json
          else
            git add -f production/mafia-temple/clips/*.mp4 production/mafia-temple/clips/*.json
          fi
          git commit -m "Add mafia temple render results [skip ci]"
          git push origin HEAD:arena/6101616c-monarch-overall-work
