          name: portrait-pilot-research
          path: production/mafia-temple/portrait-pilot-output/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload One-to-All research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onetoall-running-research
          path: production/mafia-temple/onetoall-pilot-output/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save motion clips to the session branch
        run: |
          if grep -q 'onetoall-recover-result' production/mafia-temple/trigger.txt; then
            git config user.name 'MONARCH GPU Runner'
            git config user.email 'gpu@monarch.studio'
            git add -f production/mafia-temple/onetoall-pilot-output/
            if ! git diff --cached --quiet; then
              git commit -m 'Recover generated One-to-All research pilot [skip ci]'
              git pull --rebase origin arena/6101616c-monarch-overall-work
              git push origin HEAD:arena/6101616c-monarch-overall-work
            fi
            exit 0
          fi
          if grep -q 'ltx23-smile\|ltx23-reveal\|ltx23-character\|ltx23-environment\|ltx23-cmu-pose\|ltx23-pose-control\|ltx23-running-benchmark\|ltx23-diagnostic\|onetoall-running-research\|onetoall-recover-diagnostics\|onetoall-real-preflight\|onetoall-real-render\|onetoall-real-diagnose' production/mafia-temple/trigger.txt; then
            echo 'Research output is not automatically committed.'
            exit 0
          fi
          if grep -q 'liveportrait-pilot' production/mafia-temple/trigger.txt; then
            echo 'Research pilot is an Actions artifact; not committing it.'
            exit 0
          fi
          git config user.name "MONARCH GPU Runner"
          git config user.email "gpu@monarch.studio"
          if grep -q 'stableanim-depth-diagnose' production/mafia-temple/trigger.txt || grep -q 'stableanim-diagnose' production/mafia-temple/trigger.txt || grep -q 'stableanim-pilot' production/mafia-temple/trigger.txt || grep -q 'stableanim-hands' production/mafia-temple/trigger.txt || grep -q 'stableanim-tall' production/mafia-temple/trigger.txt || grep -q 'stableanim-recover-v7' production/mafia-temple/trigger.txt; then
            git add -f production/mafia-temple/run-pilot-output/
          elif grep -q 'stableanim-walk' production/mafia-temple/trigger.txt; then
            git add -f production/mafia-temple/walk-pilot-output/ production/mafia-temple/run-pilot-output/
          elif grep -q 'depth-scene-pilot' production/mafia-temple/trigger.txt; then
            git add -f production/mafia-temple/depth-pilot-output/
          elif grep -q 'liveportrait-front-v4' production/mafia-temple/trigger.txt || grep -q 'liveportrait-front-v3' production/mafia-temple/trigger.txt || grep -q 'liveportrait-front-turn' production/mafia-temple/trigger.txt || grep -q 'liveportrait-turn-pilot' production/mafia-temple/trigger.txt; then
            git add -f production/mafia-temple/portrait-turn-output/
          elif grep -q 'portrait-recover' production/mafia-temple/trigger.txt; then
            git add -f production/mafia-temple/portrait-pilot-output/*.mp4 production/mafia-temple/portrait-pilot-output/*.json
          elif grep -q 'portrait-diagnose' production/mafia-temple/trigger.txt; then
            git add -f production/mafia-temple/diagnostics-liveportrait.json
          elif grep -q 'diagnose-v2' production/mafia-temple/trigger.txt; then
            git add -f production/mafia-temple/diagnostics-v2.json
          else
            git add -f production/mafia-temple/clips/*.mp4 production/mafia-temple/clips/*.json
          fi
          if git diff --cached --quiet; then
            echo 'No new research results to save.'
            exit 0
          fi
          git commit -m "Add mafia temple render results [skip ci]"
          # Preserve intervening user/session commits if the render was long-running.
          git pull --rebase origin arena/6101616c-monarch-overall-work
          git push origin HEAD:arena/6101616c-monarch-overall-work
