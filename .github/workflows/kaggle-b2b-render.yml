name: Kaggle B2B GPU Render

on:
  push:
    branches:
      - arena/9960286a-monarch-overall-work
      - arena/6101616c-monarch-overall-work
    paths:
      - "gpu-engine/trigger.txt"
      - "production/mafia-temple/trigger.txt"
  workflow_dispatch:
    inputs:
      render_mafia:
        description: Render the 20-second mafia temple project
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kaggle-b2b-render
  cancel-in-progress: true

jobs:
  kaggle-dual-t4:
    if: ${{ github.ref_name == 'arena/9960286a-monarch-overall-work' && (github.event_name != 'workflow_dispatch' || inputs.render_mafia != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/9960286a-monarch-overall-work
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI & FFmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q -U kaggle requests six pillow

      - name: Configure Kaggle Credentials Safely
        env:
          S_COMPALI: ${{ secrets.COMPALI }}
          S_MONARCH: ${{ secrets.MONARCH }}
          S_KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          S_KAGGLE_API_KEY: ${{ secrets.KAGGLE_API_KEY }}
          S_KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          S_KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
          S_KAGGLE_SECRET: ${{ secrets.KAGGLE_SECRET }}
          S_KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
          S_KAGGLE: ${{ secrets.KAGGLE }}
          S_WORKADILCHANDIO: ${{ secrets.WORKADILCHANDIO }}
          S_ADILCHANDIO: ${{ secrets.ADILCHANDIO }}
          S_ADIL: ${{ secrets.ADIL }}
          S_ALIELITEE: ${{ secrets.ALIELITEE }}
          S_KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          S_KAGGLE_USER: ${{ secrets.KAGGLE_USER }}
          S_USERNAME: ${{ secrets.USERNAME }}
          V_KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          V_KAGGLE_USER: ${{ vars.KAGGLE_USER }}
          V_KAGGLE_KEY: ${{ vars.KAGGLE_KEY }}
          V_KAGGLE_API_TOKEN: ${{ vars.KAGGLE_API_TOKEN }}
          V_MONARCH: ${{ vars.MONARCH }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess

          keys = [k for k in os.environ if k.startswith(("S_", "V_"))]
          present = [k for k in sorted(keys) if (os.environ.get(k) or "").strip()]
          print(f"::notice::Present credential slots: {present}", flush=True)

          # Mask all secret values immediately
          for slot in present:
              val = (os.environ.get(slot) or "").strip()
              for line in val.splitlines():
                  if line.strip():
                      print(f"::add-mask::{line.strip()}", flush=True)

          explicit_u = (
              os.environ.get("S_KAGGLE_USERNAME")
              or os.environ.get("S_KAGGLE_USER")
              or os.environ.get("S_USERNAME")
              or os.environ.get("V_KAGGLE_USERNAME")
              or os.environ.get("V_KAGGLE_USER")
              or ""
          ).strip()
          if "@" in explicit_u:
              explicit_u = ""

          # Ordered preference: newly added/verified account slots BEFORE S_ALIELITEE (unverified)
          ordered_slots = [
              ("S_COMPALI", "compali"),
              ("S_MONARCH", "compali"),
              ("S_KAGGLE_KEY", explicit_u or "compali"),
              ("S_KAGGLE_API_TOKEN", explicit_u or "compali"),
              ("S_KAGGLE_API_KEY", explicit_u or "compali"),
              ("S_KAGGLE_TOKEN", explicit_u or "compali"),
              ("S_KAGGLE_JSON", explicit_u or "compali"),
              ("S_KAGGLE", explicit_u or "compali"),
              ("S_KAGGLE_SECRET", explicit_u or "compali"),
              ("S_WORKADILCHANDIO", "workadilchandio"),
              ("S_ADILCHANDIO", "adilchandio"),
              ("S_ADIL", "compali"),
              ("V_KAGGLE_KEY", explicit_u or "compali"),
              ("V_KAGGLE_API_TOKEN", explicit_u or "compali"),
              ("V_MONARCH", "compali"),
              ("S_ALIELITEE", explicit_u or "compali"),
          ]

          def probe_handle(tok_val: str, key_val: str, hint_u: str) -> str:
              env = dict(os.environ)
              if tok_val:
                  env["KAGGLE_API_TOKEN"] = tok_val
                  env["KAGGLE_USERNAME"] = hint_u
                  env["KAGGLE_KEY"] = "placeholder"
              else:
                  env.pop("KAGGLE_API_TOKEN", None)
                  env["KAGGLE_USERNAME"] = hint_u
                  env["KAGGLE_KEY"] = key_val
              for subcmd in (
                  ["kaggle", "kernels", "list", "--mine", "--page-size", "10", "-v"],
                  ["kaggle", "datasets", "list", "--mine", "-v"],
              ):
                  try:
                      r = subprocess.run(subcmd, capture_output=True, text=True, env=env, timeout=20)
                      for line in r.stdout.splitlines()[1:]:
                          ref = line.split(",", 1)[0].strip()
                          if "/" in ref and not ref.lower().startswith("ref"):
                              return ref.split("/", 1)[0].strip()
                  except Exception:
                      pass
              return ""

          candidates = []
          for slot_name, fallback_u in ordered_slots:
              raw = (os.environ.get(slot_name) or "").strip()
              if not raw:
                  continue
              u_cand = explicit_u
              k_cand = raw
              tok_cand = ""
              if raw.startswith("{"):
                  try:
                      d = json.loads(raw)
                      u_cand = str(d.get("username") or u_cand).strip()
                      k_cand = str(d.get("key") or d.get("token") or k_cand).strip()
                  except Exception:
                      pass
              elif ":" in raw and not raw.startswith("KGAT_"):
                  left, right = raw.split(":", 1)
                  u_cand = u_cand or left.strip()
                  k_cand = right.strip()
              if k_cand.startswith("KGAT_"):
                  tok_cand = k_cand
                  k_cand = "placeholder"
              for s in (k_cand, tok_cand):
                  if s and s != "placeholder":
                      print(f"::add-mask::{s}", flush=True)
              discovered = probe_handle(tok_cand, k_cand, u_cand or fallback_u)
              final_u = discovered or u_cand or fallback_u
              print(f"::notice::Slot {slot_name} -> discovered={discovered or 'none'}, final_u={final_u}", flush=True)
              candidates.append((slot_name, final_u, k_cand, tok_cand))

          if not candidates:
              print("::error::No Kaggle credentials found in Actions Repository Secrets.", flush=True)
              raise SystemExit(1)

          # Prefer any account whose handle is NOT unverified 'alielitee' if multiple exist
          chosen = next((c for c in candidates if c[1].lower() != "alielitee"), candidates[0])
          slot_used, u, k, tok = chosen

          kdir = pathlib.Path.home() / ".kaggle"
          kdir.mkdir(parents=True, exist_ok=True)
          if not tok:
              (kdir / "kaggle.json").write_text(json.dumps({"username": u, "key": k}))
              os.chmod(kdir / "kaggle.json", 0o600)

          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"KAGGLE_USERNAME={u}\n")
              fh.write(f"KAGGLE_KEY={k}\n")
              if tok:
                  fh.write(f"KAGGLE_API_TOKEN={tok}\n")
          print(f"::notice::Selected slot={slot_used} | Kaggle user={u} (token_mode={bool(tok)})", flush=True)
          PY

      - name: Render 8 Real AI Motion Clips on Kaggle Dual T4 (4 GPUs across 2 Kernels)
        run: |
          chmod +x gpu-engine/kaggle/push_and_wait.sh
          bash gpu-engine/kaggle/push_and_wait.sh "s01,s02,s03,s04;s05,s06,s07,s08" gpu-engine/clips

      - name: Commit Rendered Clips Back to Session Branch
        run: |
          git config user.name "MONARCH GPU Runner"
          git config user.email "gpu@monarch.studio"
          git add -f gpu-engine/clips/*.mp4 gpu-engine/clips/*.json
          git commit -m "chore(gpu): add 8 Kaggle T4x2 AI motion clips [skip ci]" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin arena/9960286a-monarch-overall-work && \
            git push origin HEAD:arena/9960286a-monarch-overall-work && break
            sleep 5
          done

  mafia-temple-render:
    if: ${{ github.ref_name == 'arena/6101616c-monarch-overall-work' && (github.event_name == 'push' || inputs.render_mafia == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/6101616c-monarch-overall-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer client
        run: python -m pip install --disable-pip-version-check -q -U kaggle requests six pillow
      - name: Configure Kaggle Credentials Safely
        env:
          S_COMPALI: ${{ secrets.COMPALI }}
          S_MONARCH: ${{ secrets.MONARCH }}
          S_KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          S_KAGGLE_API_KEY: ${{ secrets.KAGGLE_API_KEY }}
          S_KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          S_KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
          S_KAGGLE_SECRET: ${{ secrets.KAGGLE_SECRET }}
          S_KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
          S_KAGGLE: ${{ secrets.KAGGLE }}
          S_WORKADILCHANDIO: ${{ secrets.WORKADILCHANDIO }}
          S_ADILCHANDIO: ${{ secrets.ADILCHANDIO }}
          S_ADIL: ${{ secrets.ADIL }}
          S_ALIELITEE: ${{ secrets.ALIELITEE }}
          S_KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          S_KAGGLE_USER: ${{ secrets.KAGGLE_USER }}
          S_USERNAME: ${{ secrets.USERNAME }}
          V_KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          V_KAGGLE_USER: ${{ vars.KAGGLE_USER }}
          V_KAGGLE_KEY: ${{ vars.KAGGLE_KEY }}
          V_KAGGLE_API_TOKEN: ${{ vars.KAGGLE_API_TOKEN }}
          V_MONARCH: ${{ vars.MONARCH }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess

          keys = [k for k in os.environ if k.startswith(("S_", "V_"))]
          present = [k for k in sorted(keys) if (os.environ.get(k) or "").strip()]
          print(f"::notice::Present credential slots: {present}", flush=True)

          # Mask all secret values immediately
          for slot in present:
              val = (os.environ.get(slot) or "").strip()
              for line in val.splitlines():
                  if line.strip():
                      print(f"::add-mask::{line.strip()}", flush=True)

          explicit_u = (
              os.environ.get("S_KAGGLE_USERNAME")
              or os.environ.get("S_KAGGLE_USER")
              or os.environ.get("S_USERNAME")
              or os.environ.get("V_KAGGLE_USERNAME")
              or os.environ.get("V_KAGGLE_USER")
              or ""
          ).strip()
          if "@" in explicit_u:
              explicit_u = ""

          # Ordered preference: newly added/verified account slots BEFORE S_ALIELITEE (unverified)
          ordered_slots = [
              ("S_COMPALI", "compali"),
              ("S_MONARCH", "compali"),
              ("S_KAGGLE_KEY", explicit_u or "compali"),
              ("S_KAGGLE_API_TOKEN", explicit_u or "compali"),
              ("S_KAGGLE_API_KEY", explicit_u or "compali"),
              ("S_KAGGLE_TOKEN", explicit_u or "compali"),
              ("S_KAGGLE_JSON", explicit_u or "compali"),
              ("S_KAGGLE", explicit_u or "compali"),
              ("S_KAGGLE_SECRET", explicit_u or "compali"),
              ("S_WORKADILCHANDIO", "workadilchandio"),
              ("S_ADILCHANDIO", "adilchandio"),
              ("S_ADIL", "compali"),
              ("V_KAGGLE_KEY", explicit_u or "compali"),
              ("V_KAGGLE_API_TOKEN", explicit_u or "compali"),
              ("V_MONARCH", "compali"),
              ("S_ALIELITEE", explicit_u or "compali"),
          ]

          def probe_handle(tok_val: str, key_val: str, hint_u: str) -> str:
              env = dict(os.environ)
              if tok_val:
                  env["KAGGLE_API_TOKEN"] = tok_val
                  env["KAGGLE_USERNAME"] = hint_u
                  env["KAGGLE_KEY"] = "placeholder"
              else:
                  env.pop("KAGGLE_API_TOKEN", None)
                  env["KAGGLE_USERNAME"] = hint_u
                  env["KAGGLE_KEY"] = key_val
              for subcmd in (
                  ["kaggle", "kernels", "list", "--mine", "--page-size", "10", "-v"],
                  ["kaggle", "datasets", "list", "--mine", "-v"],
              ):
                  try:
                      r = subprocess.run(subcmd, capture_output=True, text=True, env=env, timeout=20)
                      for line in r.stdout.splitlines()[1:]:
                          ref = line.split(",", 1)[0].strip()
                          if "/" in ref and not ref.lower().startswith("ref"):
                              return ref.split("/", 1)[0].strip()
                  except Exception:
                      pass
              return ""

          candidates = []
          for slot_name, fallback_u in ordered_slots:
              raw = (os.environ.get(slot_name) or "").strip()
              if not raw:
                  continue
              u_cand = explicit_u
              k_cand = raw
              tok_cand = ""
              if raw.startswith("{"):
                  try:
                      d = json.loads(raw)
                      u_cand = str(d.get("username") or u_cand).strip()
                      k_cand = str(d.get("key") or d.get("token") or k_cand).strip()
                  except Exception:
                      pass
              elif ":" in raw and not raw.startswith("KGAT_"):
                  left, right = raw.split(":", 1)
                  u_cand = u_cand or left.strip()
                  k_cand = right.strip()
