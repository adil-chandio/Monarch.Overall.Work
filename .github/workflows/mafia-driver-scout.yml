name: Private-film driver scout (CPU only)
on:
  push:
    branches: [arena/6101616c-monarch-overall-work]
    paths: [production/mafia-temple/driver-scout-trigger.txt]
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/6101616c-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only inspection tools
        run: python -m pip install -q 'numpy<2' pillow opencv-python-headless requests
      - name: Inspect public-domain motion dataset (no user image)
        run: python production/mafia-temple/scout_aspset.py
      - name: Upload temporary low-resolution inspection sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-scout-sheets
          path: /tmp/driver-scout-output/
          if-no-files-found: warn
          retention-days: 2
