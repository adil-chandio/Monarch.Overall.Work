name: Inspect running driver window
on:
  push:
    branches: [arena/6101616c-monarch-overall-work]
    paths: [production/mafia-temple/driver-window-trigger.txt]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/6101616c-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'numpy<2' pillow opencv-python-headless requests
      - name: Decode each sampled frame
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python production/mafia-temple/inspect_stock_window.py
