name: Screen stock motion candidates
on:
  push:
    branches: [arena/6101616c-monarch-overall-work]
    paths: [production/mafia-temple/stock-scout-trigger.txt]
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/6101616c-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q 'numpy<2' pillow opencv-python-headless requests
      - name: Screen motion and relay low-resolution sheets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python production/mafia-temple/scout_stock.py
