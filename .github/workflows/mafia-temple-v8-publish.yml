name: Monarch temple V8 — build and publish

# The coding sandbox cannot reach uploads.github.com, so the release asset is
# produced and uploaded by a GitHub-hosted runner instead. Everything it runs is
# the same committed toolchain and the same pinned models; the numbers below are
# printed to the log so the published file can be checked without trusting the
# person who ran it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the video to"
        type: string
        default: temple-v8-20s

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch ESPCN x2 model
        run: |
          set -euo pipefail
          mkdir -p production/mafia-temple/qc/models
          tmp="$(mktemp -d)"
          curl -fsSL "https://codeload.github.com/fannymonori/TF-ESPCN/tar.gz/refs/heads/master" -o "$tmp/m.tar.gz"
          tar xzf "$tmp/m.tar.gz" -C "$tmp"
          found="$(find "$tmp" -name 'ESPCN_x2.pb' -print -quit)"
          test -n "$found"
          cp "$found" production/mafia-temple/qc/models/ESPCN_x2.pb
          ls -la production/mafia-temple/qc/models/

      - name: Build the sound master
        working-directory: production/mafia-temple
        run: |
          set -euo pipefail
          mkdir -p render-v8
          python qc/make_sound_v8.py \
            --source monarch-mafia-temple-20s.mp4 \
            --out render-v8/sound_v8.wav \
            --log render-v8/sound_log.json

      - name: Render the picture
        working-directory: production/mafia-temple
        run: |
          set -euo pipefail
          python qc/render_film_v8.py \
            --out render-v8/monarch-temple-v8.mp4 \
            --superres qc/models/ESPCN_x2.pb \
            --audio render-v8/sound_v8.wav \
            --log render-v8/render_log.json \
            --preset medium --crf 17

      - name: Verify the file before publishing it
        working-directory: production/mafia-temple
        run: |
          python - <<'PY'
          import json, subprocess, sys
          sys.path.insert(0, 'qc')
          import imageio_ffmpeg
          import render_film_v8 as rv

          ff = imageio_ffmpeg.get_ffmpeg_exe()
          path = 'render-v8/monarch-temple-v8.mp4'
          probe = subprocess.run([ff, '-hide_banner', '-i', path],
                                 capture_output=True, text=True).stderr
          assert '1280x720' in probe, 'not 720p'
          assert 'Duration: 00:00:20.00' in probe, 'not exactly 20 s'
          assert 'Audio: aac' in probe, 'no audio stream'
          assert '24 fps' in probe, 'not 24 fps'

          log = json.load(open('render-v8/render_log.json'))
          assert log['film']['frames'] == 480, 'not 480 frames'
          assert all(s['duplicated_frames'] == 0 for s in log['shots'])
          assert sum(s['timeline_frames'] for s in log['shots']) >= 480

          sound = json.load(open('render-v8/sound_log.json'))
          lufs = sound['measured']['final_integrated_lufs']
          peak = sound['measured']['final_true_peak_dbfs']
          assert -18.0 <= lufs <= -14.0, f'loudness {lufs} outside target'
          assert peak <= -1.0, f'true peak {peak} too hot'

          print('VERIFIED 720p 480f 20.000s 24fps, dup=0,',
                f'{lufs} LUFS / {peak} dBTP')
          print('eye track:',
                [s['eye_track']['glow'] for s in log['shots'] if s.get('eye_track')])
          PY

      - name: Attach the video to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          gh release upload "$TAG" production/mafia-temple/render-v8/monarch-temple-v8.mp4 \
            --clobber --repo "${{ github.repository }}"
          gh release upload "$TAG" production/mafia-temple/render-v8/render_log.json \
            --clobber --repo "${{ github.repository }}"
          gh release upload "$TAG" production/mafia-temple/render-v8/sound_log.json \
            --clobber --repo "${{ github.repository }}"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes  \(.url)"'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temple-v8-build
          path: |
            production/mafia-temple/render-v8/monarch-temple-v8.mp4
            production/mafia-temple/render-v8/*.json
          retention-days: 14
