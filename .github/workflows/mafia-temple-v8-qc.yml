name: Monarch temple V8 — toolchain QC

# Runs on the free CPU runner. It validates the *tooling and media provenance*,
# not creative quality: unit tests, the exact 20.000 s timeline contract, the
# clip measurements JSON and the honesty of the report files. It never uploads,
# publishes or claims creative acceptance.

on:
  push:
    paths:
      - "production/mafia-temple/**"
      - ".github/workflows/mafia-temple-v8-qc.yml"
  pull_request:
    paths:
      - "production/mafia-temple/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install toolchain
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q "numpy>=1.26,<3" "pillow>=10" imageio-ffmpeg \
            "opencv-contrib-python-headless==4.10.0.84"

      - name: Unit tests and timeline contract
        working-directory: production/mafia-temple
        run: |
          set -o pipefail
          python -m unittest qc/test_film_tools.py -v 2>&1 | tee /tmp/unittest.log

      - name: Re-measure every source clip
        working-directory: production/mafia-temple
        run: python qc/measure_shots.py --clips clips --output /tmp/clip_metrics.json

      - name: Assert no chosen shot is frozen or black
        working-directory: production/mafia-temple
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'qc')
          import render_film_v8 as rv
          metrics = {c['file']: c for c in json.load(open('/tmp/clip_metrics.json'))['clips']}
          bad = []
          for shot in rv.SHOTS:
              m = metrics.get(f'{shot.source}.mp4')
              if not m or 'error' in m:
                  bad.append(f'{shot.name}: unmeasurable')
                  continue
              if m['frozen_run_max'] > 6:
                  bad.append(f'{shot.name}: frozen run {m["frozen_run_max"]} frames')
              if m['dark_frames'] > 0:
                  bad.append(f'{shot.name}: {m["dark_frames"]} black frames')
              if m['motion_mad_mean'] < 0.5:
                  bad.append(f'{shot.name}: almost no motion')
              print(f'ok {shot.name:12s} mad={m["motion_mad_mean"]:.2f} '
                    f'frozen_max={m["frozen_run_max"]} sharp={m["sharpness_mean"]:.0f}')
          if bad:
              print('\n'.join(bad)); raise SystemExit('shot selection failed QC')
          PY

      - name: Timeline and shot table invariants
        working-directory: production/mafia-temple
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, 'qc')
          import render_film_v8 as rv
          plan = [0] * rv.TOTAL_FRAMES
          for s in rv.SHOTS:
              for f in range(s.start, min(s.end, rv.TOTAL_FRAMES)):
                  plan[f] += 1
          assert rv.TOTAL_FRAMES == 480, 'film is not 20.000 s at 24 fps'
          assert all(plan), 'timeline has a hole'
          assert not any(c > 2 for c in plan), 'three shots overlap'
          total = sum(s.frames for s in rv.SHOTS) - sum(
              a.end - b.start for a, b in zip(rv.SHOTS, rv.SHOTS[1:]) if a.end > b.start)
          assert total == 480, f'contributed frames resolve to {total}, expected 480'
          print('timeline ok:', [(s.name, s.start, s.end) for s in rv.SHOTS])
          PY

      - name: Report files must keep their disclaimers
        working-directory: production/mafia-temple
        run: |
          python - <<'PY'
          from pathlib import Path
          need = {
            'V8-CUT-REPORT.md': ['Not creative acceptance', 'not a finished', 'KNOWN-LIMITS.md'],
            'KNOWN-LIMITS.md': ['Likeness match', 'Human review', 'Rights'],
          }
          for name, phrases in need.items():
              text = Path(name).read_text()
              missing = [p for p in phrases if p not in text]
              assert not missing, f'{name} is missing {missing}'
              print(f'ok {name}')
          PY

      - name: Media must not be tracked
        working-directory: production/mafia-temple
        run: |
          tracked=$(git ls-files | grep -Ei '\.(mp4|mov|wav|png|jpg)$' || true)
          echo "tracked media: ${tracked:-none}"
          if echo "$tracked" | grep -q 'render-v8\|qc/out\|qc/models'; then
            echo "ERROR: build outputs are tracked"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: temple-v8-qc
          path: |
            /tmp/clip_metrics.json
            /tmp/unittest.log
          retention-days: 14
