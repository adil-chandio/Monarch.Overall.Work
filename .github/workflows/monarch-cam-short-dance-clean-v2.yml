name: Monarch Cam — clean-premium V2 24-second albatross-dance Short

on:
  push:
    branches:
      - arena/390292fc-monarch-overall-work
    paths:
      - '.github/workflows/monarch-cam-short-dance-clean-v2.yml'
      - 'production/monarch-cam/short_dance_clean_v2/render_dance_visual_clean_v2.py'
      - 'production/monarch-cam/short_dance_clean_v2/build_dance_audio_clean_v2.py'
      - 'production/monarch-cam/short_dance_clean_v2/source_recon_dance.py'
      - 'production/monarch-cam/short_dance_clean_v2/dance_short_spec.json'
      - 'production/monarch-cam/short_dance_clean_v2/source_manifest_dance.json'
      - 'production/monarch-cam/short_dance_clean_v2/DANCE_RENDER_TRIGGER.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monarch-cam-short-dance-clean-v2-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  render-review-and-deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HOME: production/monarch-cam/work/short_dance_clean_v2/hf
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      EARSHOT_THREADS: '4'
      RECON_OUT: production/monarch-cam/work/short_dance_clean_v2
      RECON_REVIEW: production/monarch-cam/short_dance_clean_v2/review
    steps:
      - name: Checkout this production branch
        uses: actions/checkout@v4
        with:
          ref: arena/390292fc-monarch-overall-work
          fetch-depth: 1

      - name: Install bounded media, licensed-audio and rendering tools
        timeout-minutes: 18
        run: |
          timeout 600 python -m pip install --disable-pip-version-check -q \
            --no-input --timeout 30 --retries 2 \
            requests edge-tts numpy scipy pillow opencv-python-headless \
            soundfile soxr librosa pyloudnorm scikit-learn matplotlib transformers static-ffmpeg
          python - <<'PY'
          import os
          from static_ffmpeg.run import get_or_fetch_platform_executables_else_raise
          ffmpeg, ffprobe = get_or_fetch_platform_executables_else_raise()
          with open(os.environ['GITHUB_PATH'], 'a') as fh:
              fh.write(os.path.dirname(ffmpeg) + '\n')
          print('static ffmpeg:', ffmpeg)
          print('static ffprobe:', ffprobe)
          PY
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install Earshot with CPU-only torch
        timeout-minutes: 20
        run: |
          timeout 900 python -m pip install --disable-pip-version-check -q \
            --no-input --timeout 30 --retries 2 \
            --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
          timeout 300 python -m pip install --disable-pip-version-check -q --no-deps --no-input \
            --timeout 30 --retries 2 \
            'git+https://github.com/Leonxlnx/earshot.git@main'
          python -c 'import torch; from earshot import api; print("Earshot import OK; torch", torch.__version__)'

      - name: Validate clean-premium V2 contracts, factual guardrails, cleared audio, fonts and original MP4
        run: |
          python -m py_compile \
            production/monarch-cam/short_dance_clean_v2/render_dance_visual_clean_v2.py \
            production/monarch-cam/short_dance_clean_v2/build_dance_audio_clean_v2.py \
            production/monarch-cam/short_dance_clean_v2/source_recon_dance.py
          python - <<'PY'
          import hashlib, json, math
          from pathlib import Path
          base = Path('production/monarch-cam/short_dance_clean_v2')
          spec = json.loads((base/'dance_short_spec.json').read_text())
          manifest = json.loads((base/'source_manifest_dance.json').read_text())
          metadata = json.loads((base/'dance_viral_metadata.json').read_text())
          fps = spec['fps']
          assert (spec['duration'], spec['width'], spec['height'], fps, spec['frame_count']) == (24.0, 1080, 1920, 30, 720)
          assert spec['frame_count'] == int(spec['duration'] * fps)
          assert len(spec['narration']) == 13 and spec['narration_words'] == 59
          assert sum(len(x['text'].split()) for x in spec['narration']) == 59
          assert len(spec['scenes']) == 13 and len(spec['audio']['cues']) == 16 and len(spec['dance_steps']) == 3
          assert spec['narration'][0]['start'] <= 0.15
          assert spec['dance_steps'][0]['time'] <= 6.0
          assert spec['narration'][-1]['start'] <= 18.5
          assert spec['scenes'][-1]['rate'] < 1.0
          scene_starts = {int(round(s['start'] * fps)) for s in spec['scenes']}
          scene_ends = [int(round(s['end'] * fps)) for s in spec['scenes']]
          assert scene_ends == sorted(scene_ends) and scene_ends[-1] == spec['frame_count']
          diagram_frames = {math.ceil(s['time'] * fps - 1e-9) for s in spec['dance_steps']}
          interrupts = set(spec['pattern_interrupts'])
          allowed = {2} | scene_starts | diagram_frames | interrupts
          prem = spec['audio']['premium']
          for cue in spec['audio']['cues']:
              assert round(cue['frame'] / fps, 6) == round(cue['time'], 6), cue
              assert cue['frame'] in allowed, cue
              assert cue['salience_role'] in ('hero', 'support', 'breath'), cue
              assert 'pan_start' in cue and 'pan_end' in cue, cue
              assert abs(cue['effective_peak_db'] - (cue['peak_db'] + cue['salience_gain_db'])) < 1e-6, cue
          assert all(0.0 <= t <= 52.581 for t in spec['source_windows'])
          assert set(spec['audio']['sfx']) == {'impact', 'whoosh', 'boing', 'tick'}
          assert prem['envelope_smoothing'] == 'pchip'
          assert prem['salience_roles']['support'] <= -3.0
          assert prem['salience_roles']['breath'] <= -5.0
          assert len(prem['sub_bloom_frames']) == 4
          assert prem['stereo_width_music'] >= 0.87
          assert prem['stereo_width_ambience'] >= 0.58
          assert prem['sfx_room_mix'] >= 0.11
          assert prem['sfx_room_decay_ms'] >= 135
          assert prem['voice_presence_dip'] >= 0.46
          assert prem['voice_lowpass_hz'] <= 9900
          assert prem['voice_fade_s'] >= 0.026
          assert prem['premaster_ceiling_dbfs'] >= -1.45
          assert prem['sub_bloom']['peak_dbfs'] >= -27.5
          assert prem['sub_min_gain'] >= 0.79
          vis = spec['visual']['v2']
          assert vis['text_policy'] == 'minimal_captions_only_v2'
          assert vis['exact_cover_text'] == 'THIS IS A JOB INTERVIEW.'
          assert vis['exact_cover_ab_text'] == 'WOULD YOU PASS?'
          assert vis['action_window'][2] > 1000 and abs(vis['action_window'][2] / vis['action_window'][3] - 16 / 9) < 0.02
          assert vis['palette']['background'] == '#07111C'
          assert vis['palette']['text'] == '#F4F1E8'
          assert vis['palette']['accent'] == '#6FCFC0'
          assert vis['scene_transition_frames'] == 5
          assert vis['halation_strength'] > 0 and vis['bloom_radius'] >= 12
          assert vis['caption_tracking_px'] >= 1
          assert vis['motion_drift_x'] > 0 and vis['motion_drift_y'] > 0
          assert all(sc['top'] == '' for sc in spec['scenes'])
          assert all(sc.get('badge') in (None, '') for sc in spec['scenes'])
          assert all(sc.get('card_step') in (None, 0) for sc in spec['scenes'])
          assert all(len(x['caption'].split()) <= 4 for x in spec['narration'])
          policy = manifest['policy']['allowed']
          for asset in manifest['assets']:
              assert asset['source_page_verified'] is True, asset['id']
              assert asset['license'] in policy, asset['id']
              if not asset.get('local'):
                  assert asset['download_urls'], asset['id']
                  assert asset.get('openverse_record'), asset['id']
          assert any(a['id'] == 'native_audio' and a.get('local') for a in manifest['assets'])
          text_blob = ' '.join(
              [x['text'] for x in spec['narration']] +
              [x['caption'] for x in spec['narration']] +
              [x['top'] for x in spec['scenes']]
          ).lower()
          metadata_blob = json.dumps({k: metadata[k] for k in ('primary', 'comments')}).lower()
          forbidden = ('handle', 'car door', '25m', 'part 2', 'viral guarantee', 'bear', 'food reward', 'bears in cars', 'nps')
          for phrase in forbidden:
              assert phrase not in text_blob, phrase
          for phrase in ('handle', '25m', 'part 2', 'bear/car', 'viral guarantee'):
              assert phrase not in metadata_blob, phrase
          assert metadata['video'] == 'deliverables/MONARCH_CAM_They_Dont_Flirt_They_Choreograph_24s_Short_CLEAN_PREMIUM_V2.mp4'
          assert metadata['status'] == 'upload_ready_clean_premium_v2'
          assert metadata.get('v2_edition') is True
          assert metadata['primary']['cover_text'] == 'THIS IS A JOB INTERVIEW.'
          assert metadata['primary']['title'] == "They Don't Flirt. They Choreograph."
          facts = (base/'review/SOURCE_FACTS.md').read_text()
          assert 'Independently fetched and read on 2026-11-06' in facts
          assert 'cabled_mess' in (base/'CREDITS.md').read_text()
          assert 'V2 picture' in (base/'CREDITS.md').read_text()
          assert 'copy-paste' in (base/'DANCE_PLAN_AND_METADATA.md').read_text().lower()
          assert 'V2' in (base/'DANCE_PLAN_AND_METADATA.md').read_text()
          assert 'minimal tracked' in (base/'CLEAN_V2_ENHANCEMENTS.md').read_text()
          assert (base/'review/CLEAN_V2_ENHANCEMENTS.md').is_file()
          baseline = json.loads((base/'review/earshot_baseline.json').read_text())
          assert baseline['source'] == 'clean-premium edition critique (commit 7131c49)'
          assert (base/'review/earshot_baseline_original.json').is_file()
          fonts = [Path('public/showreel/fonts') / name for name in ('Manrope-800.ttf', 'Manrope-700.ttf', 'IBMPlexMono-400.ttf', 'Anton-Regular.ttf')]
          assert all(path.is_file() for path in fonts), fonts
          original = Path('deliverables/MONARCH_CAM_They_Dont_Flirt_They_Choreograph_24s_Short.mp4')
          assert original.is_file()
          assert hashlib.sha256(original.read_bytes()).hexdigest() == '2e276482e9d01ae1391d9d8cb3ffb152867fe19e8e6ce84b3cd35323c2f25671'
          premium = Path('deliverables/MONARCH_CAM_They_Dont_Flirt_They_Choreograph_24s_Short_PREMIUM.mp4')
          assert premium.is_file()
          assert hashlib.sha256(premium.read_bytes()).hexdigest() == 'fe6da9e4b1f441e6f1be76199743163cf64ecd12089e1632500d4dea92ae396c'
          clean = Path('deliverables/MONARCH_CAM_They_Dont_Flirt_They_Choreograph_24s_Short_CLEAN_PREMIUM.mp4')
          assert clean.is_file()
          assert hashlib.sha256(clean.read_bytes()).hexdigest() == '708c1960893ce238017e11b871e44f1d451ac0c941936a74a0b895ddc09edb89'
          assert metadata['enhancement']['clean_preserved'] == str(clean)
          assert metadata['video'] != str(original)
          assert metadata['video'] != str(premium)
          assert metadata['video'] != str(clean)
          print('Clean-premium V2 24s, picture/sound polish, cleared-audio, factual, font and original/premium/clean-preservation contracts OK')
          PY

      - name: Retrieve the public-domain USFWS clip and rebuild clean-premium V2 review sheets
        timeout-minutes: 15
        run: |
          set -o pipefail
          python production/monarch-cam/short_dance_clean_v2/source_recon_dance.py \
            2>&1 | tee production/monarch-cam/short_dance_clean_v2/review/source_recon.log

      - name: Lock exact visual timings after contact-sheet review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('production/monarch-cam/short_dance_clean_v2')
          review = base/'review'
          spec = json.loads((base/'dance_short_spec.json').read_text())
          lock = {
              'status': 'APPROVED_FOR_RENDER',
              'topic': spec['topic'],
              'source': 'Laysan Albatross Mating Dance 2016 — Ann Bell / U.S. Fish & Wildlife Service (public domain)',
              'review_basis': 'Coarse 1-second and fine 0.5-second contact sheets from source_recon_dance.py were viewed; exact source windows were selected for the hook, bow, bill-clack, sky-point, synchronized freeze, dance-party wide, replay and loop. V2 adds filmic grade, halation, cross-dissolves and tracked captions without extra text.',
              'approved_by': 'Arena agent, contact-sheet visual review',
              'full_motion_review': False,
              'native_audio_listening': False,
              'note': 'No human full-motion review or human listening to native audio occurred; delivered AAC is measured by nine gates, technical QC and model-assisted review.',
              'v2_visual_enhancements': spec['enhancement']['visual'],
              'v2_sound_enhancements': spec['enhancement']['sound'],
              'exact_timecodes': [
                  {'timeline_in': s['start'], 'timeline_out': s['end'], 'source_in': s['source_start'], 'rate': s['rate'], 'id': s['id'], 'layout': s['layout']}
                  for s in spec['scenes']
              ],
              'dance_steps': spec['dance_steps'],
              'cue_frames': spec['pattern_interrupts'],
              'cover_frame_time': 0.07,
          }
          (review/'visual_review_lock.json').write_text(json.dumps(lock, indent=2), encoding='utf-8')
          manifest_path = review/'review-manifest.json'
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text())
              manifest['visual_timestamp_approval'] = 'APPROVED_AFTER_CONTACT_SHEET_REVIEW'
              manifest['visual_review_basis'] = 'Coarse/fine contact-sheet review; exact windows in visual_review_lock.json'
              manifest['v2_edition'] = True
              manifest['source_video_ledger'] = 'production/monarch-cam/short_dance_clean_v2/review/source_video_ledger.json'
              manifest_path.write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print('Clean-premium V2 visual timing lock written')
          PY

      - name: Render the clean-premium V2 24-second native-vertical picture
        timeout-minutes: 25
        run: |
          set -o pipefail
          mkdir -p production/monarch-cam/short_dance_clean_v2/review
          rm -f production/monarch-cam/short_dance_clean_v2/review/workflow_failure.txt
          rm -f production/monarch-cam/short_dance_clean_v2/review/tts_failures.json
          python production/monarch-cam/short_dance_clean_v2/render_dance_visual_clean_v2.py \
            2>&1 | tee production/monarch-cam/short_dance_clean_v2/review/visual_build.log

      - name: Synthesize narration, design premium cleared sound, calibrate AAC and mux
        timeout-minutes: 30
        run: |
          set -o pipefail
          python production/monarch-cam/short_dance_clean_v2/build_dance_audio_clean_v2.py \
            2>&1 | tee production/monarch-cam/short_dance_clean_v2/review/audio_build.log

      - name: Run all nine measured gates on the delivered clean-premium V2 AAC stream
        timeout-minutes: 10
        run: |
          set -o pipefail
          python -m showreel.audio_qc.gates \
            deliverables/MONARCH_CAM_They_Dont_Flirt_They_Choreograph_24s_Short_CLEAN_PREMIUM_V2.mp4 \
            --profile web --json production/monarch-cam/short_dance_clean_v2/review/audio_qc.json \
            2>&1 | tee production/monarch-cam/short_dance_clean_v2/review/audio_qc.log

      - name: Assemble clean-premium V2 delivery, Earshot comparison and review summary
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('production/monarch-cam/short_dance_clean_v2/review')
          technical = json.loads((root/'technical_qc.json').read_text())
          assert technical['v2']['separate_from_previous_editions'] is True
          audio = json.loads((root/'audio_qc.json').read_text())
          earshot = json.loads((root/'earshot_final_status.json').read_text())
          critique = json.loads((root/'earshot_critique.json').read_text())
          baseline = json.loads((root/'earshot_baseline.json').read_text())
          baseline_original = json.loads((root/'earshot_baseline_original.json').read_text())
          voices = json.loads((root/'voice_ledger.json').read_text())
          mix = json.loads((root/'source_mix_report.json').read_text())
          lock = json.loads((root/'visual_review_lock.json').read_text())
          manifest = json.loads((root/'review-manifest.json').read_text()) if (root/'review-manifest.json').exists() else {}
          ledger = json.loads((root/'visual_edit_ledger.json').read_text())
          cues = json.loads((root/'resolved_cues.json').read_text())
          vpc = json.loads((root/'visual_v2_qc.json').read_text())
          thumbs = json.loads((root/'exact_thumbnail_manifest.json').read_text())
          metadata_json = json.loads(Path('production/monarch-cam/short_dance_clean_v2/dance_viral_metadata.json').read_text())
          text_blob = json.dumps({k: metadata_json[k] for k in ('primary', 'comments')}).lower()
          
          def metric(name):
              return next(m for m in critique['metrics'] if m['metric'] == name)
          hit, sub, width, preal = metric('hit_rate'), metric('band_sub'), metric('side_to_mid_db'), metric('p_real')
          hit_upper = float(hit['range'][1]) if hit['range'][1] is not None else 1.86
          gates = {
              'hit_rate_in_range': float(hit['value']) <= hit_upper + 1e-9,
              'no_major_issues': int(critique['major_issues']) == 0,
              'no_critical_issues': int(critique['critical_issues']) == 0,
              'score_not_below_clean': float(critique['score']) >= float(baseline['score']) - 0.005,
              'hit_density_not_degraded': float(hit['value']) <= float(baseline['metrics']['hit_rate']['value']) + 0.25,
              'sub_weight_not_degraded': float(sub['value']) >= float(baseline['metrics']['band_sub']['value']) - 1.0,
              'stereo_width_not_degraded': float(width['value']) >= float(baseline['metrics']['side_to_mid_db']['value']) - 1.0,
              'premaster_ceiling_bounded': -1.45 <= float(mix['premium']['premaster_ceiling_dbfs']) <= -1.0,
              'v2_music_width': float(mix['premium']['stereo_width_music']) >= 0.87,
              'v2_room_mix': float(mix['premium']['sfx_room_mix']) >= 0.11,
              'v2_voice_dip': float(mix['premium']['voice_presence_dip']) >= 0.46,
          }
          v2_sound_pass = all(gates.values())
          comparison = {
              'baseline_clean': baseline,
              'baseline_original': baseline_original,
              'v2': {
                  'score': critique['score'], 'verdict': critique['verdict'],
                  'in_range': critique['in_range'], 'scored': critique['scored'],
                  'critical_issues': critique['critical_issues'], 'major_issues': critique['major_issues'],
                  'metrics': {
                      'hit_rate': {'value': hit['value'], 'range': hit['range']},
                      'band_sub': {'value': sub['value'], 'range': sub['range']},
                      'side_to_mid_db': {'value': width['value'], 'range': width['range']},
                      'p_real': {'value': preal['value'], 'range': preal['range']},
                  }
              },
              'gates': gates,
              'v2_sound_pass': v2_sound_pass,
              'note': 'Model-assisted comparison against the delivered CLEAN edition; p_real may remain uncertain. Not human listening or approval.'
          }
          (root/'earshot_comparison.json').write_text(json.dumps(comparison, indent=2), encoding='utf-8')
          
          visual_flags = all(bool(vpc.get(k)) for k in (
              'minimal_captions_only', 'no_top_headlines', 'no_badges', 'no_dance_card',
              'no_progress', 'no_footer', 'no_macro_inset', 'no_source_labels',
              'no_brand_watermark', 'no_cut_flashes', 'cinema_grade', 'premium_palette',
              'seamless_loop_crossfade', 'exact_text_thumbnails', 'v2_cinematic_grade',
              'v2_halation_bloom', 'v2_scene_crossfades', 'v2_tracked_captions',
              'v2_motion_drift', 'v2_sound_polish'))
          thumb_files = [root / item['file'] for item in thumbs['outputs']]
          v2_visual_pass = visual_flags and all(p.is_file() for p in thumb_files) and (root/'cover_hook.jpg').is_file()
          v2_visual_pass = v2_visual_pass and abs(vpc['action_window'][2] / vpc['action_window'][3] - 16 / 9) < 0.02
          original_sha = hashlib.sha256(Path('deliverables/MONARCH_CAM_They_Dont_Flirt_They_Choreograph_24s_Short.mp4').read_bytes()).hexdigest()
          premium_sha = hashlib.sha256(Path('deliverables/MONARCH_CAM_They_Dont_Flirt_They_Choreograph_24s_Short_PREMIUM.mp4').read_bytes()).hexdigest()
          clean_sha = hashlib.sha256(Path('deliverables/MONARCH_CAM_They_Dont_Flirt_They_Choreograph_24s_Short_CLEAN_PREMIUM.mp4').read_bytes()).hexdigest()
          summary = {
              'deliverable': 'deliverables/MONARCH_CAM_They_Dont_Flirt_They_Choreograph_24s_Short_CLEAN_PREMIUM_V2.mp4',
              'package': "They Don't Flirt. They Choreograph. — Clean Premium V2",
              'scope': 'Separate V2 clean-premium edition of the new-topic USFWS albatross Short; original 24s, PREMIUM and CLEAN MP4s preserved.',
              'original_preserved': original_sha == '2e276482e9d01ae1391d9d8cb3ffb152867fe19e8e6ce84b3cd35323c2f25671',
              'premium_preserved': premium_sha == 'fe6da9e4b1f441e6f1be76199743163cf64ecd12089e1632500d4dea92ae396c',
              'clean_preserved': clean_sha == '708c1960893ce238017e11b871e44f1d451ac0c941936a74a0b895ddc09edb89',
              'duration_seconds': 24.0,
              'frames': 720,
              'narration_words': sum(x['words'] for x in voices),
              'all_narration_slots_pass': all(x['end_s'] <= (voices[i+1]['start'] if i+1 < len(voices) else 23.8) for i,x in enumerate(voices)),
              'technical_pass': technical['passed'],
              'technical_checks': technical['checks'],
              'nine_gate_audio_pass': audio['pass'],
              'nine_gate_audio_failed': audio['failed'],
              'earshot_status': earshot,
              'earshot_model_review_pass': all(earshot.get(k) == 'complete' for k in ('timeline', 'sheet', 'critique')),
              'earshot_sfx_selection_used': mix.get('sfx_selection_model_used', False),
              'native_clip_audio_used': mix.get('native_clip_audio_used', False),
              'generated_bird_vocalisations': mix.get('generated_bird_vocalisations', True),
              'visual_lock_approved': lock.get('status') == 'APPROVED_FOR_RENDER',
              'source_review_approved': manifest.get('visual_timestamp_approval') == 'APPROVED_AFTER_CONTACT_SHEET_REVIEW',
              'visual_scenes': len(ledger['scenes']),
              'resolved_cue_events': len(cues['events']),
              'sub_bloom_events': mix['premium']['sub_bloom_events'],
              'salience_roles': mix['premium']['salience_roles'],
              'stereo_width_music': mix['premium']['stereo_width_music'],
              'voice_presence_dip': mix['premium']['voice_presence_dip'],
              'premaster_ceiling_dbfs': mix['premium']['premaster_ceiling_dbfs'],
              'v2_sound_pass': v2_sound_pass,
              'v2_visual_pass': v2_visual_pass,
              'earshot_hit_rate': hit['value'],
              'earshot_hit_rate_upper': hit_upper,
              'earshot_band_sub': sub['value'],
              'earshot_side_to_mid_db': width['value'],
              'earshot_p_real': preal['value'],
              'earshot_score': critique['score'],
              'earshot_verdict': critique['verdict'],
              'earshot_major_issues': critique['major_issues'],
              'earshot_comparison': 'production/monarch-cam/short_dance_clean_v2/review/earshot_comparison.json',
              'visual_v2_qc': 'production/monarch-cam/short_dance_clean_v2/review/visual_v2_qc.json',
              'exact_thumbnail_manifest': 'production/monarch-cam/short_dance_clean_v2/review/exact_thumbnail_manifest.json',
              'cover_exists': (root/'cover.jpg').is_file(),
              'cover_hook_exists': (root/'cover_hook.jpg').is_file(),
              'cover_ab_exists': (root/'cover_WOULD_YOU_PASS.jpg').is_file(),
              'contact_sheet_exists': (root/'vertical_contact_sheet.jpg').is_file(),
              'source_poster_exists': (root/'source_poster.jpg').is_file(),
              'coarse_sheets_exist': all((root/f'coarse_contact_sheet_{i:02d}.jpg').is_file() for i in range(1,4)),
              'fine_sheets_exist': all((root/f'fine_contact_sheet_{i:02d}.jpg').is_file() for i in range(1,7)),
              'no_forbidden_phrases': not any(p in text_blob for p in ('handle', '25m', 'part 2', 'bear/car', 'viral guarantee')),
              'workflow_failure_absent': not (root/'workflow_failure.txt').exists(),
              'human_full_motion_review': False,
              'human_native_audio_listening': False,
              'human_approval': False,
              'virality_guarantee': False,
              'credits': 'production/monarch-cam/short_dance_clean_v2/CREDITS.md',
              'plan': 'production/monarch-cam/short_dance_clean_v2/DANCE_PLAN_AND_METADATA.md',
              'metadata': 'production/monarch-cam/short_dance_clean_v2/review/DANCE_UPLOAD_METADATA.md',
              'visual_review': 'production/monarch-cam/short_dance_clean_v2/review/vertical_contact_sheet.jpg',
              'creative_review': 'Clean-premium V2 design objective only. Objective, model-assisted and contact-sheet checks are evidence, not human listening, retention, audience hypnosis, a 3x result, subscribe/like behavior or a virality guarantee.'
          }
          (root/'qc_summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          required = [
              'original_preserved', 'premium_preserved', 'clean_preserved', 'technical_pass', 'nine_gate_audio_pass', 'earshot_model_review_pass',
              'all_narration_slots_pass', 'visual_lock_approved', 'source_review_approved',
              'v2_sound_pass', 'v2_visual_pass', 'cover_exists', 'cover_hook_exists',
              'cover_ab_exists', 'contact_sheet_exists', 'source_poster_exists',
              'coarse_sheets_exist', 'fine_sheets_exist', 'no_forbidden_phrases', 'workflow_failure_absent'
          ]
          if not all(summary[k] for k in required) or summary['generated_bird_vocalisations'] or not summary['native_clip_audio_used']:
              raise SystemExit('Clean-premium V2 albatross Short QC failed')
          if summary['narration_words'] != 59 or summary['visual_scenes'] != 13 or summary['resolved_cue_events'] != 16:
              raise SystemExit('Clean-premium V2 albatross Short content contract failed')
          print(json.dumps(summary, indent=2))
          PY

