          git add production/monarch-cam/short_dance_clean_v2
          if ! git diff --cached --quiet; then
            git commit -m "chore(monarch-cam): capture clean-premium V2 albatross Short failure diagnostics"
            git pull --rebase --autostash origin arena/390292fc-monarch-overall-work
            git push origin HEAD:arena/390292fc-monarch-overall-work
          fi
          exit 1

