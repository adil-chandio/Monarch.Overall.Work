          git config user.name "monarch-cam-short-dance-clean-v2-bot"
          git config user.email "monarch-cam-short-dance-clean-v2-bot@users.noreply.github.com"
          mkdir -p production/monarch-cam/short_dance_clean_v2/review
          echo "A clean-premium V2 albatross Short render, build or QC step failed; inspect adjacent logs and review JSON." \
