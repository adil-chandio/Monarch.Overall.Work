              'metadata': 'production/monarch-cam/short_ranking_v3/review/DANCE_UPLOAD_METADATA.md',
              'visual_review': 'production/monarch-cam/short_ranking_v3/review/vertical_contact_sheet.jpg',
              'creative_review': 'Clean-premium V3 design objective only. Objective, model-assisted and contact-sheet checks are evidence, not human listening, retention, audience hypnosis, a 3x result, subscribe/like behavior or a virality guarantee.'
          }
          (root/'qc_summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          required = [
              'original_preserved','premium_preserved','clean_preserved','v2_preserved','technical_pass','nine_gate_audio_pass','earshot_model_review_pass',
              'all_narration_slots_pass','visual_lock_approved','source_review_approved',
