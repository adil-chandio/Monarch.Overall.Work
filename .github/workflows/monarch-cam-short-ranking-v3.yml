              'cover_ab_exists','contact_sheet_exists','source_poster_exists',
              'coarse_sheets_exist','fine_sheets_exist','no_forbidden_phrases','workflow_failure_absent'
          ]
          if not all(summary[k] for k in required) or summary['generated_animal_vocalisations'] or not summary['native_clip_audio_used']:
              raise SystemExit('Clean-premium V3 ranked-animal Short QC failed')
          if summary['narration_words'] != 69 or summary['visual_scenes'] != 13 or summary['resolved_cue_events'] != 16 or summary['rank_steps'] != 5 or summary['cleared_video_sources'] != 5:
              raise SystemExit('Clean-premium V3 ranked-animal Short content contract failed')
          print(json.dumps(summary, indent=2))
          PY

      - name: Return failure diagnostics when a clean-premium V3 render/build/QC step fails
        if: failure()
        run: |
          git config user.name "monarch-cam-short-ranking-v3-bot"
          git config user.email "monarch-cam-short-ranking-v3-bot@users.noreply.github.com"
          mkdir -p production/monarch-cam/short_ranking_v3/review
          echo "A clean-premium V3 ranked-animal Short render, build or QC step failed; inspect adjacent logs and review JSON." \
            > production/monarch-cam/short_ranking_v3/review/workflow_failure.txt
          git add production/monarch-cam/short_ranking_v3
          if ! git diff --cached --quiet; then
            git commit -m "chore(monarch-cam): capture clean-premium V3 ranked-animal Short failure diagnostics"
            git pull --rebase --autostash origin arena/390292fc-monarch-overall-work
            git push origin HEAD:arena/390292fc-monarch-overall-work
          fi
          exit 1

      - name: Upload clean-premium V3 Short, exact thumbnails, ledgers, credits, model review and metadata
        uses: actions/upload-artifact@v4
        with:
          name: monarch-cam-5-unexpected-animal-skills-ranked-35s-short-clean-premium-v3
          path: |
            deliverables/MONARCH_CAM_5_Unexpected_Animal_Skills_Ranked_35s_Short_CLEAN_PREMIUM_V3.mp4
            production/monarch-cam/short_ranking_v3/review/
            production/monarch-cam/short_ranking_v3/CREDITS.md
            production/monarch-cam/short_ranking_v3/CLEAN_V3_ENHANCEMENTS.md
            production/monarch-cam/short_ranking_v3/review/CLEAN_V3_ENHANCEMENTS.md
