              'earshot_hit_rate': hit['value'],
              'earshot_hit_rate_upper': hit_upper,
              'earshot_band_sub': sub['value'],
              'earshot_side_to_mid_db': width['value'],
              'earshot_p_real': preal['value'],
              'earshot_score': critique['score'],
              'earshot_verdict': critique['verdict'],
              'earshot_major_issues': critique['major_issues'],
              'earshot_comparison': 'production/monarch-cam/short_ranking_v3/review/earshot_comparison.json',
              'visual_v3_qc': 'production/monarch-cam/short_ranking_v3/review/visual_v3_qc.json',
              'exact_thumbnail_manifest': 'production/monarch-cam/short_ranking_v3/review/exact_thumbnail_manifest.json',
              'video_category': metadata_json['video_category'],
              'youtube_category_id': metadata_json['youtube_category_id'],
              'cover_exists': (root/'cover.jpg').is_file(),
              'cover_hook_exists': (root/'cover_hook.jpg').is_file(),
              'cover_ab_exists': (root/'cover_RANK_THESE_5.jpg').is_file(),
              'contact_sheet_exists': (root/'vertical_contact_sheet.jpg').is_file(),
              'source_poster_exists': (root/'source_poster.jpg').is_file(),
              'coarse_sheets_exist': all((root/f'coarse_{sid}_contact_sheet_01.jpg').is_file() for sid in ['squirrel','hermit_crab','starfish','octopus','titmouse']),
              'fine_sheets_exist': all((root/f'fine_{sid}_contact_sheet_01.jpg').is_file() for sid in ['squirrel','hermit_crab','starfish','octopus','titmouse']),
              'no_forbidden_phrases': not any(p in text_blob for p in ('handle','25m','part 2','bear/car','viral guarantee','most impressive ever','human approval','tiktok','instagram')),
              'workflow_failure_absent': not (root/'workflow_failure.txt').exists(),
