name: Monarch Cam - Viral-Style V7

on:
  push:
    branches: [arena/2b012328-monarch-overall-work]
    paths:
      - '.github/workflows/monarch-cam-short-ranking-viral-v7.yml'
      - 'production/monarch-cam/short_ranking_raw_v7/*.py'
      - 'production/monarch-cam/short_ranking_raw_v7/*.json'
      - 'production/monarch-cam/short_ranking_raw_v7/RENDER_TRIGGER_V7.md'
      - 'production/monarch-cam/short_ranking_raw_v7/review/selected_windows.json'
      - 'production/monarch-cam/short_ranking_raw_v7/review/candidates/candidate_review_manifest.json'
  workflow_dispatch:

concurrency:
  group: monarch-cam-viral-style-v7-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  V7_WORK: production/monarch-cam/work/short_ranking_raw_v7
  V7_REVIEW: production/monarch-cam/short_ranking_raw_v7/review
  V7_MP4: deliverables/MONARCH_CAM_7_Most_Unexpected_Internet_Moments_Ranked_60s_Short_VIRALSTYLE_V7.mp4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: arena/2b012328-monarch-overall-work
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          timeout 900 sudo apt-get update -qq
          timeout 900 sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -3
          ffprobe -hide_banner -version | head -3

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pillow opencv-python-headless soundfile pyloudnorm requests imageio-ffmpeg

      - name: Compile V7 scripts and validate contracts
        run: |
          python -m py_compile \
            production/monarch-cam/short_ranking_raw_v7/validate_raw_v7.py \
            production/monarch-cam/short_ranking_raw_v7/candidate_probe_v7.py \
            production/monarch-cam/short_ranking_raw_v7/select_moments_v7.py \
            production/monarch-cam/short_ranking_raw_v7/verify_sources_v7.py \
            production/monarch-cam/short_ranking_raw_v7/source_recon_ranking_v7.py \
            production/monarch-cam/short_ranking_raw_v7/source_audio_audit_v7.py \
            production/monarch-cam/short_ranking_raw_v7/render_ranking_visual_v7.py \
            production/monarch-cam/short_ranking_raw_v7/build_ranking_audio_raw_v7.py \
            production/monarch-cam/short_ranking_raw_v7/technical_qc_v7.py
          python production/monarch-cam/short_ranking_raw_v7/validate_raw_v7.py

      - name: Runner probe of rights-cleared social-origin candidates
        run: python production/monarch-cam/short_ranking_raw_v7/candidate_probe_v7.py

      - name: Lock seven objective audio/motion windows
        run: python production/monarch-cam/short_ranking_raw_v7/select_moments_v7.py

      - name: Per-title Commons API rights and social-origin verification
        run: python production/monarch-cam/short_ranking_raw_v7/verify_sources_v7.py

      - name: Source recon, SHA-1 checks and V7 window clips
        run: python production/monarch-cam/short_ranking_raw_v7/source_recon_ranking_v7.py

      - name: Native source audio audit
        run: python production/monarch-cam/short_ranking_raw_v7/source_audio_audit_v7.py

      - name: Render V7 reference-style full-frame picture
        run: python production/monarch-cam/short_ranking_raw_v7/render_ranking_visual_v7.py

      - name: Build raw per-window native audio track and mux MP4
        run: python production/monarch-cam/short_ranking_raw_v7/build_ranking_audio_raw_v7.py

      - name: Nine web audio gates
        run: |
          set -o pipefail
          python -m showreel.audio_qc.gates \
            "${{ env.V7_MP4 }}" \
            --profile web \
            --json "${{ env.V7_REVIEW }}/audio_qc.json" \
            2>&1 | tee "${{ env.V7_REVIEW }}/audio_qc.log"

      - name: Technical QC with sampled-frame and rights checks
        run: python production/monarch-cam/short_ranking_raw_v7/technical_qc_v7.py

      - name: Write V7 delivery summary
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('.').resolve()
          review = root / 'production/monarch-cam/short_ranking_raw_v7/review'
          out = root / 'deliverables/MONARCH_CAM_7_Most_Unexpected_Internet_Moments_Ranked_60s_Short_VIRALSTYLE_V7.mp4'
          obj = lambda n: json.loads((review / n).read_text(encoding='utf-8'))
          t = obj('technical_qc.json')
          a = obj('audio_qc.json')
          native = obj('native_audio_ledger.json')
          social = obj('social_origin_ledger.json')
          layout = obj('layout_manifest.json')
          visual = obj('visual_v7_qc.json')
          meta = json.loads((root / 'production/monarch-cam/short_ranking_raw_v7/ranking_v7_metadata.json').read_text(encoding='utf-8'))
          src_manifest = obj('verified_sources.json')
          src_ledger = obj('source_video_ledger.json')
          src_audio = obj('source_audio_audit.json')
          audio_ledger = obj('native_audio_ledger.json')
          selected = obj('selected_windows.json')
          candidates = obj('candidates/candidate_video_ledger.json')
          if not t.get('passed') or not a.get('pass') or not native.get('final_web_gate_pass'):
              raise SystemExit('QC gate did not pass')
          summary = {
              'topic': '7 Most Unexpected Internet Moments, Ranked.',
              'package': 'Viral-Style V7 - separate from rejected V6',
              'deliverable': str(out.relative_to(root)),
              'bytes': out.stat().st_size,
              'sha256': hashlib.sha256(out.read_bytes()).hexdigest(),
              'title': meta['primary'],
              'category': meta['video_category'],
              'duration_seconds': 60.0,
              'frame_count': 1800,
              'fps': 30,
              'resolution': '1080x1920',
              'audio': 'Raw per-window native Commons audio only; no narration, music, effects, bed, generated calls or added layers.',
              'visual_policy': 'Blurred full-frame background plus sharp uncut source frame; no V6 crop routine, no zoom, no black empty top, no letterbox; all seven rank labels visible from the first frame.',
              'technical': {'passed': t['passed'], 'checks': t['checks'], 'sha256': t['sha256'], 'bytes': t['bytes'], 'probe': t['probe'], 'sampled_frames': t['sampled_frames']},
              'audio_checks': {'passed': a.get('pass'), 'gates': a.get('gates', {})},
              'native_audio': native,
              'social_origin': {
                  'policy': social['policy'],
                  'all_api_license_verified': social['all_api_license_verified'],
                  'all_social_origin_verified': social['all_social_origin_verified'],
                  'all_original_commons_pages': social['all_original_commons_pages'],
                  'all_original_sha1_verified': social['all_original_sha1_verified'],
                  'no_unverified_reposts': social['no_unverified_reposts'],
                  'api_restrictions_recorded': social['api_restrictions_recorded'],
                  'rights_not_legal_opinion': social['rights_not_legal_opinion'],
                  'cc_by_attribution_recorded': social['cc_by_attribution_recorded'],
                  'assets': social['assets'],
              },
              'layout': {'safe_area': layout['safe_area'], 'all_primary_elements_inside_safe_area': layout['all_primary_elements_inside_safe_area'], 'hook': layout['hook'], 'list': layout['list'], 'right_ui': layout['right_ui'], 'bottom_bar': layout['bottom_bar'], 'flags': layout['flags']},
              'visual': visual,
              'source_manifest': src_manifest,
              'source_clip_ledger': src_ledger,
              'source_audio_audit': src_audio,
              'audio_ledger': audio_ledger,
              'selected_windows': {'edition': selected['edition'], 'probe_basis': selected['probe_basis'], 'frame_count': selected['frame_count'], 'scenes': selected['scenes']},
              'candidate_probe': {'candidate_count': candidates['candidate_count'], 'completed_count': candidates['completed_count'], 'audio_visual_pass_count': candidates['audio_visual_pass_count'], 'motion_pass_count': candidates['motion_pass_count']},
              'runner_probe_passed': bool(t['checks']['runner_probe_passed']),
              'runner_audio_visual_probe_passed': bool(t['checks']['runner_audio_visual_probe_passed']),
              'runner_visual_motion_probe': bool(t['checks']['runner_visual_motion_probe']),
              'contact_sheets_written': bool(t['checks']['contact_sheets_written']),
              'source_review_recorded': bool(t['checks']['source_review_recorded']),
              'visual_lock_written': bool(t['checks']['visual_lock_written']),
              'safe_area_check': bool(t['checks']['safe_area_check_recorded']),
              'social_origin_check': bool(t['checks']['social_origin_check_recorded'] and t['checks']['social_origin_per_title_verified']),
              'v6_rejected': True,
              'v7_human_review_pending': True,
              'full_motion_review': False,
              'native_audio_listening': False,
              'human_approval': False,
              'sign_off': False,
              'audience_result_promise': False,
              'virality_guarantee': False,
              'current_trending_claim': False,
              'unverified_social_repost': False,
              'social_platform_reposts_selected': False,
              'note': 'Technical build and objective checks only. V4/V5/V6 were rejected. V7 uses rights-cleared social-origin Commons mirrors, not unverified currently trending TikTok/Instagram/Reddit/Dailymotion/YouTube reposts. Commons extmetadata is a rights record, not a legal opinion. No human full-motion/native-audio listening, creative approval, sign-off, perfection, retention, virality or audience result is claimed.',
          }
          (review / 'qc_summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('V7 delivery', summary['sha256'], summary['bytes'], 'bytes', flush=True)
          PY

      - name: Upload V7 MP4, contact sheets and QC evidence
        uses: actions/upload-artifact@v4
        with:
          name: monarch-cam-viral-style-v7-${{ github.sha }}
          path: |
            ${{ env.V7_MP4 }}
            ${{ env.V7_REVIEW }}/cover*.jpg
            ${{ env.V7_REVIEW }}/frame_*.jpg
            ${{ env.V7_REVIEW }}/payoff_frame_*.jpg
            ${{ env.V7_REVIEW }}/v7_*_contact_sheet_*.jpg
            ${{ env.V7_REVIEW }}/candidates/candidate_*_sheet_*.jpg
            ${{ env.V7_REVIEW }}/candidates/candidate_audio_probe.json
            ${{ env.V7_REVIEW }}/candidates/candidate_video_ledger.json
            ${{ env.V7_REVIEW }}/candidates/candidate_review_manifest.json
            ${{ env.V7_REVIEW }}/source_poster.jpg
            ${{ env.V7_REVIEW }}/UPLOAD_METADATA_RANKING_V7.txt
            ${{ env.V7_REVIEW }}/selected_windows.json
            ${{ env.V7_REVIEW }}/verified_sources.json
            ${{ env.V7_REVIEW }}/social_origin_ledger.json
            ${{ env.V7_REVIEW }}/source_video_ledger.json
            ${{ env.V7_REVIEW }}/source_windows.json
            ${{ env.V7_REVIEW }}/source_audio_audit.json
            ${{ env.V7_REVIEW }}/native_audio_ledger.json
            ${{ env.V7_REVIEW }}/audio_qc.json
            ${{ env.V7_REVIEW }}/audio_qc.log
            ${{ env.V7_REVIEW }}/technical_qc.json
            ${{ env.V7_REVIEW }}/layout_manifest.json
            ${{ env.V7_REVIEW }}/visual_v7_qc.json
            ${{ env.V7_REVIEW }}/visual_edit_ledger.json
            ${{ env.V7_REVIEW }}/visual_review_lock.json
            ${{ env.V7_REVIEW }}/review-manifest.json
            ${{ env.V7_REVIEW }}/qc_summary.json
          retention-days: 30
          if-no-files-found: error

      - name: Failure diagnostics
        if: failure()
        run: |
          echo '--- V7 work tree ---'
          find production/monarch-cam/work/short_ranking_raw_v7 -maxdepth 2 -type f -printf '%p %s bytes\n' | sort | head -120 || true
          echo '--- V7 review ---'
          find production/monarch-cam/short_ranking_raw_v7/review -maxdepth 2 -type f -printf '%p %s bytes\n' | sort | head -120 || true
          echo '--- MP4 ---'
          ls -lah deliverables/MONARCH_CAM_7_Most_Unexpected_Internet_Moments_Ranked_60s_Short_VIRALSTYLE_V7.mp4 || true
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,width,height,r_frame_rate -of json deliverables/MONARCH_CAM_7_Most_Unexpected_Internet_Moments_Ranked_60s_Short_VIRALSTYLE_V7.mp4 || true

      - name: Commit V7 MP4 and generated review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${{ env.V7_MP4 }}"
          git add production/monarch-cam/short_ranking_raw_v7/review
          git add .github/workflows/monarch-cam-short-ranking-viral-v7.yml
          git add .gitignore
          if git diff --cached --quiet; then
            echo 'No V7 changes to commit'
          else
            git commit -m "build(monarch-cam): viral-style V7 60s Short [skip ci]"
            git fetch origin arena/2b012328-monarch-overall-work
            git merge --no-edit -X ours origin/arena/2b012328-monarch-overall-work || true
            git push origin HEAD:arena/2b012328-monarch-overall-work
          fi
