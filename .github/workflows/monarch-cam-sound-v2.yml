name: Monarch Cam — licensed soundtrack V2

on:
  push:
    branches:
      - arena/c678cc81-monarch-overall-work
    paths:
      - '.github/workflows/monarch-cam-sound-v2.yml'
      - 'production/monarch-cam/sound_v2/build_sound_v2.py'
      - 'production/monarch-cam/sound_v2/source_manifest.json'
      - 'production/monarch-cam/sound_v2/cues.json'
  workflow_dispatch:
    inputs:
      skip_earshot:
        description: 'Use deterministic source trims and skip model review (diagnostic fallback only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: monarch-cam-sound-v2-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  source-design-mix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      HF_HOME: production/monarch-cam/work/hf
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      EARSHOT_THREADS: '4'
    steps:
      - name: Checkout this production branch
        uses: actions/checkout@v4
        with:
          ref: arena/c678cc81-monarch-overall-work
          fetch-depth: 1

      - name: Install media and licensed-audio production tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q \
            requests edge-tts numpy scipy pillow opencv-python-headless \
            soundfile soxr librosa pyloudnorm scikit-learn matplotlib transformers

      - name: Install Earshot with CPU-only torch
        run: |
          python -m pip install --disable-pip-version-check -q \
            --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6'
          python -m pip install --disable-pip-version-check -q --no-deps \
            'git+https://github.com/Leonxlnx/earshot.git@main'
          python -c 'import torch; from earshot import api; print("Earshot import OK; torch", torch.__version__)'

      - name: Build the new licensed soundtrack and stream-copy the approved picture
        run: |
          set -o pipefail
          mkdir -p production/monarch-cam/sound_v2/review
          if [[ '${{ inputs.skip_earshot }}' == 'true' ]]; then
            python production/monarch-cam/sound_v2/build_sound_v2.py --skip-earshot \
              2>&1 | tee production/monarch-cam/sound_v2/review/build.log
          else
            python production/monarch-cam/sound_v2/build_sound_v2.py \
              2>&1 | tee production/monarch-cam/sound_v2/review/build.log
          fi

      - name: Run nine measured audio gates on the delivered AAC stream
        run: |
          set -o pipefail
          python -m showreel.audio_qc.gates \
            deliverables/MONARCH_CAM_Bear_Opening_30s_Sound_V2.mp4 \
            --profile web --json production/monarch-cam/sound_v2/review/audio_qc.json \
            2>&1 | tee production/monarch-cam/sound_v2/review/audio_qc.log

      - name: Assemble V2 delivery and provenance summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('production/monarch-cam/sound_v2/review')
          technical = json.loads((root/'technical_qc.json').read_text())
          audio = json.loads((root/'audio_qc.json').read_text())
          music = json.loads((root/'music_selection.json').read_text())
          earshot = json.loads((root/'earshot_final_status.json').read_text())
          summary = {
              'deliverable': 'deliverables/MONARCH_CAM_Bear_Opening_30s_Sound_V2.mp4',
              'scope': 'Approved 30-second picture with a new licensed soundtrack only; not a full episode',
              'old_procedural_background_reused': False,
              'picture_stream_identical_to_v1': technical['gates']['picture_stream_identical'],
              'music_selection': music['selected'],
              'technical_pass': technical['pass'],
              'nine_gate_audio_pass': audio['pass'],
              'nine_gate_audio_failed': audio['failed'],
              'earshot_status': earshot,
              'credits': 'production/monarch-cam/sound_v2/CREDITS.md',
              'stems': 'production/monarch-cam/sound_v2/review/stems_premaster/ (review artifact; WAV masters not committed)',
              'creative_review': 'Measured/model checks complete; user listening review remains the final creative gate',
          }
          (root/'qc_summary.json').write_text(json.dumps(summary, indent=2))
          if not technical['pass'] or not audio['pass']:
              raise SystemExit('V2 QC failed')
          print(json.dumps(summary, indent=2))
          PY

      - name: Return failure diagnostics when a build/QC step fails
        if: failure()
        run: |
          git config user.name "monarch-cam-sound-v2-bot"
          git config user.email "monarch-cam-sound-v2-bot@users.noreply.github.com"
          mkdir -p production/monarch-cam/sound_v2/review
          echo "A Sound V2 build or QC step failed; inspect adjacent logs and review JSON." \
            > production/monarch-cam/sound_v2/review/workflow_failure.txt
          git add production/monarch-cam/sound_v2/review
          if ! git diff --cached --quiet; then
            git commit -m "chore(monarch-cam): capture soundtrack V2 failure diagnostics"
            git pull --rebase origin arena/c678cc81-monarch-overall-work
            git push origin HEAD:arena/c678cc81-monarch-overall-work
          fi
          exit 1

      - name: Upload V2 review deliverable, credits, cue list, models and stems
        uses: actions/upload-artifact@v4
        with:
          name: monarch-cam-bear-opening-sound-v2
          path: |
            deliverables/MONARCH_CAM_Bear_Opening_30s_Sound_V2.mp4
            production/monarch-cam/sound_v2/review/
            production/monarch-cam/sound_v2/CREDITS.md
            production/monarch-cam/sound_v2/cues.json
            production/monarch-cam/sound_v2/source_manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Return the improved MP4 and compact review record to this branch
        run: |
          git config user.name "monarch-cam-sound-v2-bot"
          git config user.email "monarch-cam-sound-v2-bot@users.noreply.github.com"
          rm -f production/monarch-cam/sound_v2/review/workflow_failure.txt
          git add -f deliverables/MONARCH_CAM_Bear_Opening_30s_Sound_V2.mp4
          git add production/monarch-cam/sound_v2/review production/monarch-cam/sound_v2/CREDITS.md
          if git diff --cached --quiet; then
            echo "Sound V2 deliverable and QC unchanged"
            exit 0
          fi
          git commit -m "chore(monarch-cam): deliver licensed soundtrack V2"
          git pull --rebase origin arena/c678cc81-monarch-overall-work
          git push origin HEAD:arena/c678cc81-monarch-overall-work
