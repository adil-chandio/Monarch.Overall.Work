name: Monarch Cam - V4 replacement-source audio and visual probe

on:
  push:
    branches:
      - arena/390292fc-monarch-overall-work
    paths:
      - '.github/workflows/monarch-cam-v4-candidate-audio-probe.yml'
      - 'production/monarch-cam/short_ranking_raw_v4/candidate_audio_probe.py'
      - 'production/monarch-cam/short_ranking_raw_v4/candidate_sources.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monarch-cam-v4-candidate-audio-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout this production branch
        uses: actions/checkout@v4
        with:
          ref: arena/390292fc-monarch-overall-work
          fetch-depth: 1

      - name: Install bounded media and rendering tools
        timeout-minutes: 18
        run: |
          timeout 600 python -m pip install --disable-pip-version-check -q \
            --no-input --timeout 30 --retries 2 \
            requests numpy pillow soundfile pyloudnorm static-ffmpeg
          python - <<'PY'
          import os
          from static_ffmpeg.run import get_or_fetch_platform_executables_else_raise
          ffmpeg, ffprobe = get_or_fetch_platform_executables_else_raise()
          with open(os.environ['GITHUB_PATH'], 'a') as fh:
              fh.write(os.path.dirname(ffmpeg) + '\n')
          print('static ffmpeg:', ffmpeg)
          print('static ffprobe:', ffprobe)
          PY
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Restore cached CC0 source media
        id: v3-source-cache
        uses: actions/cache/restore@v4
        with:
          path: production/monarch-cam/work/short_ranking_v3/media
          key: monarch-cam-v3-sources-${{ hashFiles('production/monarch-cam/short_ranking_v3/source_manifest_ranking.json') }}
          restore-keys: |
            monarch-cam-v3-sources-

      - name: Measure native audio and coarse visual frames for CC0 candidates
        timeout-minutes: 40
        run: |
          set -o pipefail
          mkdir -p production/monarch-cam/short_ranking_raw_v4/review/candidates
          python production/monarch-cam/short_ranking_raw_v4/candidate_audio_probe.py \
            2>&1 | tee production/monarch-cam/short_ranking_raw_v4/review/candidates/candidate_probe.log

      - name: Return replacement-source probe diagnostics to this branch
        if: always()
        run: |
          git config user.name "Monarch Cam V4 Probe"
          git config user.email "actions@github.com"
          mkdir -p production/monarch-cam/short_ranking_raw_v4/review/candidates
          git add production/monarch-cam/short_ranking_raw_v4/review/candidates
          if git diff --cached --quiet; then
            echo 'No candidate diagnostics to return'
          else
            git commit -m "chore(monarch-cam): return V4 replacement-source probe diagnostics [skip ci]"
            git push origin arena/390292fc-monarch-overall-work
          fi
