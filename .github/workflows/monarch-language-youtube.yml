name: Language-native YouTube research
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: ['.github/workflows/monarch-language-youtube.yml']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify research guards
        run: python -m unittest discover -s research/monarch_language_audit/tests -v
      - name: Collect bounded public YouTube metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.YTAP1 || secrets.YTAPI1 || secrets.YT_KEY || secrets.YT_API_KEY }}
        run: python -u research/monarch_language_audit/multilingual_youtube.py --output "$RUNNER_TEMP/language-youtube.json"
      - name: Store checksum-verified metadata as a public Git blob
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          data=(Path(os.environ['RUNNER_TEMP'])/'language-youtube.json').read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',
              data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=120) as response: sha=json.load(response)['sha']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              print('sha='+sha,file=out);print('digest='+digest,file=out)
          (Path(os.environ['RUNNER_TEMP'])/'language-receipt.txt').write_text('bytes='+str(len(data))+'\nsha256='+digest+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: language-youtube-${{ steps.receipt.outputs.sha }}-${{ steps.receipt.outputs.digest }}
          path: ${{ runner.temp }}/language-receipt.txt
          retention-days: 2
          if-no-files-found: error
