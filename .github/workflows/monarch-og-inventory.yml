name: Inspect shared reference archive without extracting
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: ['.github/workflows/monarch-og-inventory.yml']
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the explicitly shared Drive ZIP
        run: |
          python -m pip install -q gdown==5.2.0
          gdown 'https://drive.google.com/uc?id=1SGF3F8GjzvVdMaRVeG7Ujg9XccLaB35W' -O "$RUNNER_TEMP/og-reference.zip"
      - name: Inspect central directory; encrypt inventory
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python research/monarch_og_audit/inspect_archive.py
      - name: Publish ciphertext receipt only
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-inventory-${{ steps.inspect.outputs.blob }}-${{ steps.inspect.outputs.digest }}
          path: ${{ runner.temp }}/og-inventory-receipt.txt
          retention-days: 1
      - name: Remove runner archive
        if: always()
        run: rm -f "$RUNNER_TEMP/og-reference.zip"
