name: Check public channels in the reference screenshots
# Repeat after correcting a same-name handle candidate; prior receipt is retained.
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: ['.github/workflows/monarch-og-reference-channels.yml']
permissions:
  contents: write
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test selection, format boundaries and rate-limit handling
        run: python -m unittest discover -s research/monarch_og_audit/tests -v
      - name: Resolve selected public handles and inventory recent uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.YTAP1 || secrets.YTAPI1 || secrets.YT_KEY || secrets.YT_API_KEY }}
        run: python -u research/monarch_og_audit/channel_followup.py
      - name: Store public metadata with a checksum receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          data=(Path(os.environ['RUNNER_TEMP'])/'og-reference-channels.json').read_bytes()
          digest=hashlib.sha256(data).hexdigest()
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=120) as response: sha=json.load(response)['sha']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              print('sha='+sha,file=out);print('digest='+digest,file=out)
          (Path(os.environ['RUNNER_TEMP'])/'reference-receipt.txt').write_text('bytes='+str(len(data))+'\nsha256='+digest+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: og-references-${{ steps.receipt.outputs.sha }}-${{ steps.receipt.outputs.digest }}
          path: ${{ runner.temp }}/reference-receipt.txt
          retention-days: 2
          if-no-files-found: error
