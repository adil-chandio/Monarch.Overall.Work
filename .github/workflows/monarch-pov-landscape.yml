name: MONARCH POV channel landscape
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [scripts/monarch_pov_landscape.py, .github/workflows/monarch-pov-landscape.yml]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.YTAP1 || secrets.YTAPI1 || secrets.YT_KEY || secrets.YT_API_KEY }}
        run: python scripts/monarch_pov_landscape.py
      - name: Save snapshot
        run: |
          mkdir -p docs/repo-intel
          cp audit-output/monarch-pov-landscape.json docs/repo-intel/monarch-pov-landscape.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repo-intel/monarch-pov-landscape.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record MONARCH POV competitor metadata [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
