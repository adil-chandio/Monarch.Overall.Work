name: probe bear market
on:
  push:
    paths: [ "probe-bear-trigger.txt" ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Probe
        run: |
          set -o pipefail
          python research/viral_og_v21/probe_bear_market.py 2>&1 | tee research/viral_og_v21/api_evidence/bear_market_probe.log
      - name: Commit
        if: always()
        run: |
          git config user.name "monarch-forensic-bot"
          git config user.email "forensic-bot@users.noreply.github.com"
          git add research/viral_og_v21/api_evidence/bear_market_probe.* || true
          git commit -m "chore(v21): cave-bear market probe [skip ci]" || true
          git push origin HEAD:arena/2b012328-monarch-overall-work || true
