name: probe search routes
on:
  push:
    paths: [ "probe-search-routes-trigger.txt" ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Resolve key secret
        env: { YOUTUBE_API_KEY: "${{ secrets.YOUTUBE_API_KEY }}" }
        run: echo "key_present=$([ -n "$YOUTUBE_API_KEY" ] && echo true || echo false)"
      - name: Probe
        env: { YOUTUBE_API_KEY: "${{ secrets.YOUTUBE_API_KEY }}" }
        run: |
          set -o pipefail
          mkdir -p research/viral_og_v21/api_evidence
          python research/viral_og_v21/probe_search_routes.py 2>&1 | tee research/viral_og_v21/api_evidence/probe_search_routes.log || true
      - name: Commit probe log
        if: always()
        run: |
          git config user.name "monarch-forensic-bot"
          git config user.email "forensic-bot@users.noreply.github.com"
          git add research/viral_og_v21/api_evidence/probe_search_routes.log
          git commit -m "chore(v21): discovery route probe log [skip ci]" || true
          git push origin HEAD:arena/2b012328-monarch-overall-work || true
