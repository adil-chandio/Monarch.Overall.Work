name: Reference video — forensic transcript

# Why this exists: the development sandbox cannot reach any speech-to-text model host
# (huggingface.co 000, cdn-lfs 000, ggml files 404 at their old GitHub paths), so the
# competitor analysis could describe the picture but not one word of the narration.
# Runners have the network; this is where the transcript gets made.
#
# The source video is NOT committed. It is 31 MB of someone else's channel, and the
# repo's rule is that Git holds knowledge, not media. The video lives in Drive; its
# file id is the input. Pull it with a Drive token, or drop it at the path below.

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive file id of the reference video (must be shared: anyone with the link)"
        required: false
        default: "16vYFVlKJwTE7tZYJ5jSrv90KT09r4SgF"
      model:
        description: "faster-whisper model"
        required: false
        default: "base.en"
      out_dir:
        description: "where the transcript is written"
        required: false
        default: "docs/research/competitor-apexmorph/forensics"

permissions:
  contents: write

concurrency:
  group: reference-forensics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transcribe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and faster-whisper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet 'faster-whisper>=1.1,<2'

      # Drive is the only transfer path in this repo. The token is optional: when it is
      # absent the step says so and the job still works if the video is already present.
      - name: Fetch the reference video
        env:
          FILE_ID: ${{ inputs.drive_file_id }}
        run: |
          mkdir -p .cache/ref
          OUT=.cache/ref/reference.mp4
          if [ -z "$FILE_ID" ]; then
            echo '::warning::no drive_file_id given'
            exit 0
          fi
          # Confirm-avoid-login is required: Drive serves an HTML interstitial to
          # anything that looks like a browser, and saving that instead of the
          # video produces a 60 KB "file" that fails at the transcribe step with a
          # message about audio rather than about the download.
          curl -sS -L -o "$OUT"             "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          SIZE=$(stat -c%s "$OUT" 2>/dev/null || echo 0)
          echo "downloaded $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo '::error::the download is too small to be the video — Drive served HTML, or the file is not shared.'
            echo '::error::Share the file as "anyone with the link" and re-run. This is not an audio problem.'
            head -c 400 "$OUT" || true
            rm -f "$OUT"
            exit 1
          fi
          file "$OUT"

      - name: Transcribe
        run: |
          if [ ! -s .cache/ref/reference.mp4 ]; then
            echo "::error::the reference video is not present. Nothing to transcribe."
            echo "::error::Either set GOOGLE_DRIVE_TOKEN so the fetch step works, or place the file at .cache/ref/reference.mp4."
            exit 1
          fi
          python scripts/research/reference-forensic-transcribe.py \
            .cache/ref/reference.mp4 "${{ inputs.out_dir }}" "${{ inputs.model }}"

      - name: Show the numbers in the run summary
        if: always()
        env:
          F: ${{ inputs.out_dir }}/speech-stats.json
        run: |
          if [ -f "$F" ]; then
            python scripts/research/speech-stats-to-summary.py "$F" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'no speech-stats.json produced' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the transcript
        run: |
          D="${{ inputs.out_dir }}"
          if [ ! -f "$D/transcript.json" ]; then
            echo "::error::no transcript was written — nothing to commit"
            exit 1
          fi
          git config user.name 'Monarch reference forensics'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          bash scripts/git-commit-if-changed.sh \
            'research: forensic transcript of the ApexMorph orca video [skip ci]' "$D"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-transcript
          path: ${{ inputs.out_dir }}/
          retention-days: 90
