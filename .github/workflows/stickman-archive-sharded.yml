name: Stickman research — bounded real-footage frame study
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/stickman-archive-sharded.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-frames:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow imageio-ffmpeg numpy
      - name: Process disjoint real-source movies; never count generation as visual review
        timeout-minutes: 23
        env:
          STUDY_SHARD: ${{ matrix.shard }}
          STUDY_SHARDS: '4'
        run: python scripts/stickman-archive-decode.py
      - name: Preserve completed evidence even on a bounded processing failure
        if: always()
        run: |
          git config user.name 'Monarch animation research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/research/stickman-study/archive-footage
          git diff --cached --quiet || git commit -m 'Preserve actual film-frame research, shard ${{ matrix.shard }} [skip ci]'
          git pull --rebase origin arena/ba8d901e-monarch-overall-work
          git push origin HEAD:arena/ba8d901e-monarch-overall-work
