name: Stickman research — expanded public archival source-identity discovery and actual frame decoding
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/stickman-archive.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'yt-dlp[default]' pillow imageio-ffmpeg numpy
      - name: Resolve actual public creator movie files and decode accessible footage
        run: python scripts/stickman-archive-access.py
      - name: Decode public movies and index every actual video frame
        run: python scripts/stickman-archive-decode.py
      - name: Preserve evidence and small timestamped research quotations, never full third-party movies
        if: always()
        run: |
          git config user.name 'Monarch animation research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/research/stickman-study/public-archives docs/research/stickman-study/archive-footage
          git diff --cached --quiet || git commit -m 'Record alternate public footage access and actual decoded research quotations [skip ci]'
          bash scripts/git-push-retrying.sh arena/ba8d901e-monarch-overall-work
