name: Stickman research — ordinary public browser playback
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/stickman-browser.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Test real public video playback, verify requested video identity, never substitute ads or thumbnails
        run: node scripts/stickman-browser-study.mjs
      - name: Preserve actual findings
        if: always()
        run: |
          git config user.name 'Monarch animation research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/research/stickman-study/browser-playback
          git diff --cached --quiet || git commit -m 'Record actual public browser playback results and timestamped research quotes [skip ci]'
          bash scripts/git-push-retrying.sh arena/ba8d901e-monarch-overall-work
