name: Stickman public video and comment probe
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [scripts/stickman_media_probe.py, .github/workflows/stickman-media-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q yt-dlp
      - name: Probe public media and comments
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.YTAP1 || secrets.YTAPI1 || secrets.YT_KEY || secrets.YT_API_KEY }}
        run: python scripts/stickman_media_probe.py
      - name: Save probe results
        run: |
          mkdir -p docs/repo-intel
          cp audit-output/stickman-media-probe.json docs/repo-intel/stickman-media-probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repo-intel/stickman-media-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record stickman public media probe [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
