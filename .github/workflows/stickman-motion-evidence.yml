name: Analyze public stickman animation samples
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [scripts/stickman_dailymotion_inspect.py, .github/workflows/stickman-motion-evidence.yml]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q yt-dlp
      - name: Collect public visual evidence
        run: python scripts/stickman_dailymotion_inspect.py
      - name: Save results and research sheets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repo-intel/stickman-motion-evidence
          git diff --cached --quiet && exit 0
          git commit -m 'Record public animation contact sheets [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
