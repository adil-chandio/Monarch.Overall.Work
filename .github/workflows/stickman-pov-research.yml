name: Stickman POV research
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [scripts/stickman_pov_research.py, .github/workflows/stickman-pov-research.yml]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search YouTube public metadata
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.YTAP1 || secrets.YTAPI1 || secrets.YT_KEY || secrets.YT_API_KEY }}
        run: python scripts/stickman_pov_research.py
      - name: Save public snapshot
        run: |
          mkdir -p docs/repo-intel
          cp audit-output/stickman-pov-public.json docs/repo-intel/stickman-pov-public.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repo-intel/stickman-pov-public.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record stickman POV public research [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
