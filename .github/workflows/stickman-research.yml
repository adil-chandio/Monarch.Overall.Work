name: Stickman research — API discovery and relevant shortlist and supported-JS public playback check
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/stickman-research.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve existing research API key without exposing it
        env:
          KEY_PRIMARY: ${{ secrets.YOUTUBE_API_KEY }}
          KEY_ALT: ${{ secrets.YTAP1 }}
          KEY_ALT_2: ${{ secrets.YTAPI1 }}
          KEY_ALT_3: ${{ secrets.YT_KEY }}
          KEY_ALT_4: ${{ secrets.YT_API_KEY }}
        run: |
          KEY="${KEY_PRIMARY:-${KEY_ALT:-${KEY_ALT_2:-${KEY_ALT_3:-$KEY_ALT_4}}}}"
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "YOUTUBE_API_KEY=$KEY" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'yt-dlp[default]'
      - name: Discover a broad cohort and check actual public-video access, not thumbnails
        run: python scripts/research-stickman.py --access-only
      - name: Preserve public metadata, failures and true study status only
        if: always()
        run: |
          git config user.name 'Monarch evidence-based animation research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/research/stickman-study
          git diff --cached --quiet || git commit -m 'Record stickman API discovery and media-access feasibility, not completed forensics [skip ci]'
          bash scripts/git-push-retrying.sh arena/ba8d901e-monarch-overall-work
