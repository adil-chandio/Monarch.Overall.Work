name: v21 catalogue match
on:
  push:
    paths: [ "v21-catalogue-match-trigger.txt" ]
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Match
        run: |
          set -o pipefail
          python research/viral_og_v21/resolve_by_catalogue.py 2>&1 | tee research/viral_og_v21/api_evidence/catalogue_match.log
      - name: Commit
        if: always()
        run: |
          git config user.name "monarch-forensic-bot"
          git config user.email "forensic-bot@users.noreply.github.com"
          git add research/viral_og_v21/api_evidence/catalogue_match_v21.json research/viral_og_v21/api_evidence/catalogue_match.log
          git commit -m "chore(v21): catalogue-shape channel match [skip ci]" || true
          git push origin HEAD:arena/2b012328-monarch-overall-work || true
