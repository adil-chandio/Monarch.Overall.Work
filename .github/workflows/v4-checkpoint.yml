name: v4 checkpoint (first 30 %)

# Why this exists: the full film is a 7-minute render behind a 12-step gate, and a
# wrong turn in the first seven seconds — where all the motion is — costs the whole
# cycle to discover. This renders the first 30 % on its own and stops, so the hook
# and the first four shots can be approved before anything else is built. The full
# render is a separate job and is not blocked by this one.

on:
  push:
    branches: ["arena/**"]
    paths: ["showreel/v4/**", "tools/**", ".github/workflows/v4-checkpoint.yml"]
  workflow_dispatch:

permissions:
  contents: write

# The checkpoint and the full render trigger on the same paths, so before this they
# started together and raced for the apt lock: one job sat in "Install ffmpeg" for
# twenty-five minutes with nothing to report, the other failed on the lock. One
# group, serialised rather than cancelled, because both have to run.
concurrency:
  group: v4-apt-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No actions/setup-python: it downloads a python, puts it first on PATH, and
      # then the apt packages for the *system* python are invisible to it — which
      # made 'import numpy' fail on a runner where numpy had just been installed.
      # The runner's own python3 is newer than the 3.11 that was being pinned.

      - name: What the checks need, and nothing else
        timeout-minutes: 3
        run: |
          # This job used to apt-get install ffmpeg, fonts and numpy. ffmpeg and the
          # fonts are already on the runner image, and the numpy install is gone —
          # check_part.py is plain Python now. Every line here is a line that can
          # stall, and two of them did: apt has now timed out twice on this step.
          ffmpeg -version | head -1
          python3 --version

      - name: Install renderer, gate and chrome-headless-shell
        run: |
          npm install --no-save --silent jsdom@30 gsap@3 puppeteer-core@23
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$PWD/.browsers"
          CHROME_PATH=$(find "$PWD/.browsers" -name 'chrome-headless-shell' -type f | head -n 1)
          echo "CHROME=$CHROME_PATH" >> $GITHUB_ENV
          test -x "$CHROME_PATH" && echo "chrome ok: $CHROME_PATH"

      - name: Gates — no scene outlives its window, nothing leaks
        run: |
          node tools/timeline_probe.mjs showreel/v4/index.html
          node tools/verify_v4.mjs

      - name: Render the first 30 %
        run: |
          set +e
          node tools/render_v4.mjs --out public/demo/v4-30-silent.mp4 --part 0.30 --part-tag "first 30%" 2>&1 | tee /tmp/render-part.out
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # a ::error:: annotation is readable through the API even when the raw
            # job log cannot be downloaded
            echo "::error title=checkpoint render failed::$(tail -c 1200 /tmp/render-part.out | tr '\n' ' ')"
          fi
          exit "$status"

      - name: Cut the reference to the same window
        run: python3 tools/make_checkpoint_ref.py 0.30

      - name: Check the checkpoint frames
        run: python3 tools/check_part.py --frames 210

      - name: Publish the checkpoint
        if: always()
        run: |
          git config user.name "monarch-forensics-bot"
          git config user.email "forensics@monarch.studio"
          git add -f public/demo/v4-30-silent.mp4 public/demo/ref30.mp4 analysis/v4-build/render-part.log 2>/dev/null || true
          git commit -m "checkpoint(v4): first 30 % for approval [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push skipped"
