name: V7 audio-window diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v7-audio-window-diagnostic.yml'
      - 'production/monarch-cam/short_ranking_raw_v7/DIAGNOSTIC_TRIGGER.md'

concurrency:
  group: monarch-cam-v7-audio-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  V7_WORK: production/monarch-cam/work/short_ranking_raw_v7
  V7_REVIEW: production/monarch-cam/short_ranking_raw_v7/review

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: arena/2b012328-monarch-overall-work
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools
        run: |
          timeout 900 sudo apt-get update -qq
          timeout 900 sudo apt-get install -y -qq ffmpeg

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pillow opencv-python-headless soundfile pyloudnorm requests imageio-ffmpeg

      - name: Probe candidate audio and motion windows
        run: python production/monarch-cam/short_ranking_raw_v7/candidate_probe_v7.py

      - name: Lock seven objective windows
        continue-on-error: true
        run: python production/monarch-cam/short_ranking_raw_v7/select_moments_v7.py

      - name: Verify per-title Commons rights
        continue-on-error: true
        run: python production/monarch-cam/short_ranking_raw_v7/verify_sources_v7.py

      - name: Recon source windows and clips
        continue-on-error: true
        run: python production/monarch-cam/short_ranking_raw_v7/source_recon_ranking_v7.py

      - name: Audit selected native audio windows
        continue-on-error: true
        run: python production/monarch-cam/short_ranking_raw_v7/source_audio_audit_v7.py

      - name: Print compact continuous-audio diagnostic
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          review = Path('production/monarch-cam/short_ranking_raw_v7/review')

          def load(name):
              path = review / name
              return json.loads(path.read_text()) if path.exists() else {}

          probe = load('candidates/candidate_audio_probe.json')
          audit = load('source_audio_audit.json')
          selected = load('selected_windows.json')
          out = {'candidates': {}, 'selected_windows': [], 'selected_audio_audit': {}}
          for aid, e in probe.get('assets', {}).items():
              top = (e.get('top_windows') or [None])[0]
              out['candidates'][aid] = {
                  'duration_seconds': e.get('duration_seconds'),
                  'integrated_lufs': e.get('integrated_lufs'),
                  'audio_visual_probe_passed': e.get('runner_audio_visual_probe_passed'),
                  'motion_probe_passed': e.get('runner_visual_motion_probe'),
                  'candidate_window_count': e.get('candidate_window_count'),
                  'continuous_window_count': e.get('continuous_window_count'),
                  'best_continuous_window': None if not top else {
                      k: top.get(k) for k in (
                          'start', 'rms_dbfs', 'motion_score', 'score', 'selectable',
                          'min_full_block_rms_dbfs', 'quiet_full_block_count',
                          'continuous_native_audio'
                      )
                  },
              }
          for s in selected.get('scenes', []):
              out['selected_windows'].append({
                  'rank': s.get('rank'), 'source_id': s.get('source_id'),
                  'source_start': s.get('source_start'), 'duration': s.get('duration'),
                  'runner_audio_rms_dbfs': s.get('runner_audio_rms_dbfs'),
                  'runner_motion_score': s.get('runner_motion_score'),
                  'runner_min_full_block_rms_dbfs': s.get('runner_min_full_block_rms_dbfs'),
                  'runner_quiet_full_block_count': s.get('runner_quiet_full_block_count'),
                  'runner_continuous_native_audio': s.get('runner_continuous_native_audio'),
              })
          for aid, e in audit.get('assets', {}).items():
              out['selected_audio_audit'][aid] = {
                  'segment_rms_dbfs': e.get('segment_rms_dbfs'),
                  'full_half_second_blocks': e.get('full_half_second_blocks'),
                  'quiet_full_block_count': e.get('quiet_full_block_count'),
                  'min_full_block_rms_dbfs': e.get('min_full_block_rms_dbfs'),
                  'continuous_native_audio': e.get('continuous_native_audio'),
                  'native_audio_audible': e.get('native_audio_audible'),
              }
          print('V7_AUDIO_DIAGNOSTIC_JSON_BEGIN')
          print(json.dumps(out, indent=1, sort_keys=True))
          print('V7_AUDIO_DIAGNOSTIC_JSON_END')
          PY

      - name: Upload audio-window measurements
        uses: actions/upload-artifact@v4
        with:
          name: monarch-cam-v7-audio-window-measurements-${{ github.sha }}
          path: |
            ${{ env.V7_REVIEW }}/candidates/candidate_audio_probe.json
            ${{ env.V7_REVIEW }}/candidates/candidate_video_ledger.json
            ${{ env.V7_REVIEW }}/candidates/candidate_review_manifest.json
            ${{ env.V7_REVIEW }}/selected_windows.json
            ${{ env.V7_REVIEW }}/verified_sources.json
            ${{ env.V7_REVIEW }}/social_origin_ledger.json
            ${{ env.V7_REVIEW }}/source_video_ledger.json
            ${{ env.V7_REVIEW }}/source_windows.json
            ${{ env.V7_REVIEW }}/source_audio_audit.json
          retention-days: 7
          if-no-files-found: warn
