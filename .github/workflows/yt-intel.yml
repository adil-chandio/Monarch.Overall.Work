name: YT Intel — topic research

# Runs the same tool a human runs locally, on a schedule, so the topic pool never goes
# stale and the weekly Ops review has fresh numbers without anyone remembering to click.
on:
  push:
    branches:
      - arena/9960286a-monarch-overall-work
    paths:
      - "yt-intel-trigger.txt"
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to research (blank = use config/topic-queue.json)'
        required: false
        default: ''
      limit:
        description: 'How many search results to analyse'
        required: false
        default: '30'
      order:
        description: 'Search filter: relevance | date | viewCount | thisMonth | thisWeek'
        required: false
        default: ''
  schedule:
    # Mondays 04:00 UTC — before the week's planning session
    - cron: '0 4 * * 1'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The default GITHUB_TOKEN cannot push to a protected branch or, in this repo, has
      # been unreliable for the render job. An SSH deploy key with write access is the
      # durable answer. If the secret is absent the job still runs and still produces the
      # report as a downloadable artifact — it just cannot commit it.
      - name: Wire the commit key (optional)
        env:
          YT_COMMIT_KEY: ${{ secrets.YT_COMMIT_KEY }}
        # `if: env.YT_COMMIT_KEY != ''` never fired: the `secrets` context is not available to
        # step conditionals, so this step was skipped on every run since it was written.
        run: |
          if [ -z "$YT_COMMIT_KEY" ]; then
            echo "no YT_COMMIT_KEY secret — the default token will try the commit instead"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$YT_COMMIT_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url origin git@github.com:${{ github.repository }}.git
          ssh -T -o StrictHostKeyChecking=accept-new git@github.com || true

      - name: Runtime deps (all free, all pip)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pillow yt-dlp pytrends

      - name: Offline self-test (fail fast if the maths broke)
        run: python -m yt_intel.test_offline

      - name: Resolve the key secret
        env:
          KEY_PRIMARY: ${{ secrets.YOUTUBE_API_KEY }}
          KEY_ALT: ${{ secrets.YTAP1 }}
          KEY_ALT_2: ${{ secrets.YTAPI1 }}
        # The key secret must be named YOUTUBE_API_KEY for the tool to pick it up. A closely
        # near-miss secret (YTAP1) is a very easy mistake to make in a mobile browser, so the
        # likely spellings are accepted here and normalised into one name — and the log says
        # which one won. This step itself shipped with a typo'd name once and proved why the
        # check has to exist rather than be assumed.
        # The value is masked; only its length and first four characters are printed.
        run: |
          KEY="${KEY_PRIMARY:-$KEY_ALT}"
          [ -z "$KEY" ] && KEY="$KEY_ALT_2"
          if [ -z "$KEY" ]; then
            echo "no key secret (YOUTUBE_API_KEY / YTAP1 / YTAPI1) — staying keyless"
            exit 0
          fi
          echo "::add-mask::$KEY"
          echo "YOUTUBE_API_KEY=$KEY" >> "$GITHUB_ENV"
          if [ -n "$KEY_PRIMARY" ]; then
            echo "using secret YOUTUBE_API_KEY (${#KEY} chars)"
          else
            echo "using secret YTAP1 (${#KEY} chars) — rename it to YOUTUBE_API_KEY when convenient"
          fi

      - name: Which lane are we in?
        run: python -m yt_intel lanes

      - name: Key doctor (proves the key before trusting it)
        # no key configured? skip instead of failing the schedule — keyless mode still works
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then echo "no key secret — staying keyless"; else python -m yt_intel doctor; fi

      - name: Resolve the run plan (marker file or queue)
        id: plan
        run: |
          if [ -f yt-intel-trigger.txt ]; then
            TOPIC="$(sed -n 1p yt-intel-trigger.txt | sed 's/#.*//' | xargs)"
            # optional second line: the search filter (relevance | date | viewCount | thisMonth | thisWeek)
            ORDER="$(sed -n 2p yt-intel-trigger.txt | sed 's/#.*//' | xargs)"
            echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
            echo "order=$ORDER" >> "$GITHUB_OUTPUT"
            echo "from marker file: topic=${TOPIC:-<queue>} order=${ORDER:-<default>}"
          else
            echo "topic=" >> "$GITHUB_OUTPUT"
            echo "order=" >> "$GITHUB_OUTPUT"
          fi

      - name: Research (one topic, or the whole queue)
        env:
          YT_INTEL_MAX_TOPICS: '4'
        run: |
          TOPIC="${{ github.event.inputs.topic || steps.plan.outputs.topic }}"
          LIMIT="${{ github.event.inputs.limit || '30' }}"
          if [ -n "$TOPIC" ]; then
            ORDER="${{ github.event.inputs.order || steps.plan.outputs.order }}"
            echo "single topic: $TOPIC (order ${ORDER:-relevance})"
            python -m yt_intel topic "$TOPIC" --limit "$LIMIT" ${ORDER:+--order "$ORDER"} \
              --json "public/yt-intel/$(echo "$TOPIC" | tr '[:upper:] ' '[:lower:]-').json"
          else
            echo "no topic given -> walking config/topic-queue.json (quota-capped)"
            node scripts/yt-queue.mjs --limit "$LIMIT"
          fi

      - name: Refresh the UI index (public/yt-intel/index.json)
        run: node scripts/yt-index.mjs

      - name: Upload the report even if nothing could be committed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-intel-report
          path: public/yt-intel/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit the report
        id: commit
        run: |
          git config user.name "monarch-yt-bot"
          git config user.email "workadilchandio@gmail.com"
          git add public/yt-intel || true
          if git diff --cached --quiet; then echo "no change"; echo "committed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "chore(yt-intel): refresh topic research [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "committed=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 5
          done
          echo "committed=false" >> "$GITHUB_OUTPUT"
          echo "::warning::push failed after 3 attempts — the report is in the run artifact instead"

      - name: Summary
        if: always()
        run: |
          echo "### YT Intel run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          f = pathlib.Path("public/yt-intel/index.json")
          if not f.exists():
              print("no index produced"); raise SystemExit
          d = json.loads(f.read_text())
          rows = d.get("reports", [])[:5]
          print("| topic | verdict | score | status |")
          print("|---|---|---|---|")
          for r in rows:
              print(f"| {r.get('topic')} | {r.get('verdict')} | {r.get('score')} | {r.get('status')} |")
          PY
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Committed: ${{ steps.commit.outputs.committed }}" >> "$GITHUB_STEP_SUMMARY" 
