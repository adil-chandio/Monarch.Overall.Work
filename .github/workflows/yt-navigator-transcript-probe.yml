name: Test transcript component from YT Navigator
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [scripts/yt_navigator_transcript_probe.py, .github/workflows/yt-navigator-transcript-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'youtube-transcript-api==0.6.3'
      - run: python scripts/yt_navigator_transcript_probe.py
      - name: Record status only
        run: |
          cp audit-output/yt-navigator-transcript-probe.json docs/repo-intel/yt-navigator-transcript-probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repo-intel/yt-navigator-transcript-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record transcript probe result [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
