name: V17 Next-Level Niche - real YouTube API forensic

# Deep 10x niche / competitor forensic using the EXISTING YOUTUBE_API_KEY Actions secret.
# Arena token cannot use workflow_dispatch (403), so a marker-file push triggers it.
# Research / benchmark only. Competitor videos are third-party copyrighted works,
# NOT source clips. No video or audio is downloaded. Public metadata, public captions
# where available, public comments and public thumbnail image statistics only.
on:
  push:
    branches:
      - arena/2b012328-monarch-overall-work
    paths:
      - "v17-next-level-trigger.txt"

permissions:
  contents: write

concurrency:
  group: v17-next-level-forensic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/2b012328-monarch-overall-work

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve key secret (presence only; value masked)
        env:
          KEY_PRIMARY: ${{ secrets.YOUTUBE_API_KEY }}
          KEY_ALT: ${{ secrets.YTAP1 }}
        run: |
          KEY="${KEY_PRIMARY:-$KEY_ALT}"
          if [ -z "$KEY" ]; then
            echo "::error::no key secret resolved - cannot be a real API-lane run"
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "YOUTUBE_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "key resolved (${#KEY} chars); value never printed or stored"

      - name: Runtime deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pillow yt-dlp

      - name: Prove the lane
        run: python -m yt_intel lanes --json || true

      - name: 20 next-level search lanes + mostPopular + deep forensic
        run: python research/next_level_niche_v17/build_next_level_forensic_v17.py

      - name: HARD QC - real API evidence must exist
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('research/next_level_niche_v17/api_evidence/run.json')
          r = json.loads(p.read_text())
          assert r['key_present'] is True, 'key not resolved'
          assert r['lane_reports'] >= 16, r['lane_reports']
          assert r['lane_rows'] >= 200, r['lane_rows']
          assert r['unique_videos'] >= 200, r['unique_videos']
          assert r['channels_resolved'] >= 50, r['channels_resolved']
          assert r['most_popular_regions'] >= 2, r['most_popular_regions']
          assert r['video_categories'] >= 10, r['video_categories']
          assert r['million_view_videos'] >= 50, r['million_view_videos']
          assert r['candidate_videos_after_title_safety'] >= 30, r['candidate_videos_after_title_safety']
          assert r['comments_videos'] >= 8, r['comments_videos']
          assert r['teardowns'] >= 8, r['teardowns']
          assert r['thumbnail_stats'] >= 10, r['thumbnail_stats']
          print('FORENSIC QC PASS', json.dumps(r, indent=2))
          PY

      - name: Upload API evidence even if the commit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-next-level-api-evidence
          path: research/next_level_niche_v17/
          if-no-files-found: warn

      - name: Commit evidence + data appendix
        if: always()
        run: |
          git config user.name "monarch-yt-bot"
          git config user.email "workadilchandio@gmail.com"
          git add research/next_level_niche_v17
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore(v17): real API next-level niche forensic evidence [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || echo "::warning::push failed; evidence is in the run artifact"
