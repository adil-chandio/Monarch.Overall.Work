name: Test official public YouTube video understanding
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [scripts/yt_official_video_probe.py, .github/workflows/yt-official-video-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official video input
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YTAP1: ${{ secrets.YTAP1 }}
          YTAPI1: ${{ secrets.YTAPI1 }}
          YT_KEY: ${{ secrets.YT_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/yt_official_video_probe.py
      - name: Test YT Navigator transcript dependency
        run: |
          pip install 'youtube-transcript-api==0.6.3'
          python scripts/yt_navigator_transcript_probe.py
      - name: Save sanitized probe result
        run: |
          cp audit-output/yt-official-video-probe.json docs/repo-intel/yt-official-video-probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp audit-output/yt-navigator-transcript-probe.json docs/repo-intel/yt-navigator-transcript-probe.json
          git add docs/repo-intel/yt-official-video-probe.json docs/repo-intel/yt-navigator-transcript-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record official video understanding probe [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
