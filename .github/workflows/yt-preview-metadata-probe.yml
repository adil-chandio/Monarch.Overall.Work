name: Test public YouTube preview metadata
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [scripts/yt_preview_metadata_probe.cjs, .github/workflows/yt-preview-metadata-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - run: node scripts/yt_preview_metadata_probe.cjs
      - name: Save result
        run: |
          cp audit-output/yt-preview-metadata-probe.json docs/repo-intel/yt-preview-metadata-probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repo-intel/yt-preview-metadata-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record preview metadata probe [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
