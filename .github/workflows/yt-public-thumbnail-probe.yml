name: Inspect public YouTube thumbnail previews
on:
  push:
    branches: [arena/1f352b8e-monarch-overall-work]
    paths: [scripts/yt_public_thumbnail_probe.py, .github/workflows/yt-public-thumbnail-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1f352b8e-monarch-overall-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/yt_public_thumbnail_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-thumbnail-inspection
          path: audit-output/youtube-thumbnails/*.jpg
          if-no-files-found: warn
          retention-days: 1
      - name: Provide small public thumbnail candidates for inspection
        run: |
          for f in audit-output/youtube-thumbnails/*-[123].jpg; do
            echo "::notice title=$(basename "$f")::$(base64 -w0 "$f")"
          done
      - name: Save metadata only
        run: |
          cp audit-output/yt-public-thumbnail-probe.json docs/repo-intel/yt-public-thumbnail-probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repo-intel/yt-public-thumbnail-probe.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record public thumbnail preview probe [skip ci]'
          git push origin HEAD:arena/1f352b8e-monarch-overall-work
