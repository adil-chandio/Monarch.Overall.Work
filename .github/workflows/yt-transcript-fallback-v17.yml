name: V17 Transcript fallback - public captions only

# The first V17 forensic pass recorded 12/12 yt-dlp bot-check failures. This
# workflow retries with youtube-transcript-api and alternate yt-dlp clients.
# No video/audio download. No API key needed. Public captions only.
on:
  push:
    branches:
      - arena/2b012328-monarch-overall-work
    paths:
      - "v17-transcript-trigger.txt"

permissions:
  contents: write

concurrency:
  group: v17-transcript-fallback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/2b012328-monarch-overall-work

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Runtime deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet youtube-transcript-api yt-dlp

      - name: Public-caption transcript fallback
        run: python research/next_level_niche_v17/transcript_fallback_v17.py

      - name: Report transcript availability (honest, does not fail the run)
        run: |
          python - <<'PY'
          import json
          r=json.load(open('research/next_level_niche_v17/api_evidence/transcript_fallback_run_v17.json'))
          print(json.dumps(r, indent=2))
          if r['usable_transcripts'] == 0:
              print('::warning::no public transcript could be retrieved; evidence records the access failure')
          PY

      - name: Upload transcript evidence even if captions were unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-transcript-fallback-evidence
          path: research/next_level_niche_v17/
          if-no-files-found: warn

      - name: Commit transcript evidence + report
        if: always()
        run: |
          git config user.name "monarch-yt-bot"
          git config user.email "workadilchandio@gmail.com"
          git add research/next_level_niche_v17
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore(v17): public-caption transcript fallback evidence [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || echo "::warning::push failed; evidence is in the run artifact"
