name: V21 Viral OG - user swipe file channels, API-measured

# Input is the user's own Drive swipe file (37 channels / 130 rows read from 71 screenshots).
# Resolves each channel, pulls its catalogue, adds 6 cluster lanes x short/long, then
# outliers + comments + thumbnails + caption attempt.
on:
  push:
    branches: [arena/2b012328-monarch-overall-work]
    paths: ["v21-viral-trigger.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v21-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  og:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/2b012328-monarch-overall-work

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve key secret (presence only; value masked)
        env:
          KEY_PRIMARY: ${{ secrets.YOUTUBE_API_KEY }}
          KEY_ALT: ${{ secrets.YTAP1 }}
        run: |
          KEY="${KEY_PRIMARY:-$KEY_ALT}"
          if [ -z "$KEY" ]; then echo "::error::no key resolved"; exit 1; fi
          echo "::add-mask::$KEY"
          echo "YOUTUBE_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "key resolved (${#KEY} chars); never printed or stored"

      - name: Runtime deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy pillow

      - name: V21 resolve channels once (cached; search only on miss)
        run: python research/viral_og_v21/resolve_v21.py

      - name: Commit channel cache immediately
        if: always()
        run: |
          git config user.name "monarch-forensic-bot"
          git config user.email "forensic-bot@users.noreply.github.com"
          git add research/viral_og_v21/api_evidence/channel_cache_v21.json || true
          if git diff --cached --quiet; then echo "cache unchanged"; else
            git commit -m "chore(v21): channel resolution cache [skip ci]"
            git push origin HEAD:arena/2b012328-monarch-overall-work || true
          fi

      - name: V21 viral OG forensic
        run: |
          mkdir -p research/viral_og_v21/api_evidence
          python research/viral_og_v21/build_viral_og_v21.py 2>&1 | tee research/viral_og_v21/api_evidence/build_v21.log

      - name: Diagnostics (always)
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          base = pathlib.Path('research/viral_og_v21/api_evidence')
          out = {n: ('MISSING' if not (base/n).exists() else (base/n).stat().st_size)
                 for n in ('run_v21.json','channel_deep_v21.json','videos_v21.json','comments_v21.json')}
          if (base/'channels_v21.json').exists():
              d = json.loads((base/'channels_v21.json').read_text())
              out['unresolved'] = d.get('unresolved')
              out['channels'] = [{'n': c['screenshot_name'], 'api': c['title'], 'subs': c['subs'],
                                  'cat': c.get('catalogue_n'), 'med': c.get('median_views'),
                                  'out': c.get('outlier_count'), 'by': c['resolved_by']}
                                 for c in d['channels']]
          (base/'diagnostics_v21.json').write_text(json.dumps(out, indent=1, ensure_ascii=False)+'\n')
          print(json.dumps(out, indent=1)[:6000])
          PY

      - name: Commit V21 evidence
        if: always()
        run: |
          git config user.name "monarch-forensic-bot"
          git config user.email "forensic-bot@users.noreply.github.com"
          git add research/viral_og_v21/api_evidence || true
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "chore(v21): viral OG swipe-file forensic evidence [skip ci]"
            git push origin HEAD:arena/2b012328-monarch-overall-work
          fi

      - name: HARD QC - V21 evidence must exist and join
        run: |
          python - <<'PY'
          import json, pathlib
          b = pathlib.Path('research/viral_og_v21/api_evidence')
          run = json.loads((b/'run_v21.json').read_text())
          assert run['key_present'] is True
          assert run['secret_value_printed_or_stored'] is False
          assert run['screenshot_channels'] >= 30, run['screenshot_channels']
          assert run['resolved_channels'] >= 28, run['resolved_channels']
          assert run['identity_verified_channels'] >= 22, run['identity_verified_channels']
          assert run['catalogue_videos'] >= 500, run['catalogue_videos']
          assert run['lanes'] == 20, run['lanes']
          assert run['lane_rows'] >= 600, run['lane_rows']
          assert all(l['ids_count'] > 0 for l in json.loads((b/'lanes_v21.json').read_text())['lanes']), 'empty lane'
          assert run['unique_videos'] >= 800, run['unique_videos']
          vids = json.loads((b/'videos_v21.json').read_text())
          assert vids['count'] == run['unique_videos'], (vids['count'], run['unique_videos'])
          deep = json.loads((b/'channel_deep_v21.json').read_text())
          ids = {v['id'] for v in vids['videos']}
          missing = sum(1 for c in deep['catalogue'].values() for o in c['outliers'] if o['id'] not in ids)
          assert missing == 0, missing
          print('V21 HARD QC PASS')
          PY

      - name: Upload V21 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-viral-og-evidence
          path: research/viral_og_v21/api_evidence/
          if-no-files-found: warn
