name: Original local audio — ephemeral encrypted analysis bridge
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/zack-audio-bridge.yml, scripts/research/zack-audio-bridge.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-local-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ba8d901e-monarch-overall-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'faster-whisper>=1.1,<2' 'transformers>=4.48,<4.53' scipy numpy soundfile 'yt-dlp[default]' cryptography
      - name: Publish ephemeral recipient, await encrypted source PCM, analyze, encrypt result
        run: |
          git config user.name 'Monarch ephemeral audio research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python scripts/research/zack-audio-bridge.py
      - name: Transfer encrypted model results only
        if: always()
        run: |
          if [ ! -f refs/research-audio-bridge/results/manifest.json ]; then exit 0; fi
          git add refs/research-audio-bridge/results/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Transfer encrypted remaining-source audio evidence [skip ci]'
          git pull --rebase origin arena/ba8d901e-monarch-overall-work
          git push origin HEAD:arena/ba8d901e-monarch-overall-work
