name: Actual source audio — model analysis, not perceptual listening
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/zack-audio-model-analysis.yml, scripts/research/zack-audio-model-analysis.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-audio-model-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ba8d901e-monarch-overall-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'faster-whisper>=1.1,<2' 'transformers>=4.48,<4.53' scipy numpy soundfile 'yt-dlp[default]' cryptography
      - name: Hash-match actual soundtracks, transcribe and score broad audio-event candidates
        run: python scripts/research/zack-audio-model-analysis.py
      - name: Transfer encrypted analysis only on the same branch
        if: always()
        run: |
          if [ ! -f refs/research-audio-models/manifest.json ]; then exit 0; fi
          git config user.name 'Monarch audio research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add refs/research-audio-models/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Transfer encrypted source-audio model evidence; not human listening [skip ci]'
          git pull --rebase origin arena/ba8d901e-monarch-overall-work
          git push origin HEAD:arena/ba8d901e-monarch-overall-work
