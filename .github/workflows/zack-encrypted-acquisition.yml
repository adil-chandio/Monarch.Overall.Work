name: Ten creator-edition references — encrypted research acquisition only
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/zack-encrypted-acquisition.yml, scripts/research/zack-encrypted-acquisition.py, refs/research-transfer/public.pem]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  private-reference-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ba8d901e-monarch-overall-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'yt-dlp[default]' cryptography
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download public sources, verify publisher, decode both tracks and encrypt
        run: python scripts/research/zack-encrypted-acquisition.py
      - name: Transfer ciphertext only to the same tracked branch
        if: always()
        run: |
          git config user.name 'Monarch private-reference transfer'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add refs/research-transfer/manifest.json
          find refs/research-transfer -maxdepth 1 -name '*.enc' -print0 | xargs -0 -r git add -f --
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Transfer encrypted creator-reference study inputs; no plaintext media [skip ci]'
          bash scripts/git-push-retrying.sh arena/ba8d901e-monarch-overall-work
