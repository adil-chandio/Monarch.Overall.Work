name: Zack originals — bounded footage access test (no production)
on:
  push:
    branches: [arena/ba8d901e-monarch-overall-work]
    paths: [.github/workflows/zack-original-access.yml, scripts/research/zack-access-probe.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  access-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/ba8d901e-monarch-overall-work
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'yt-dlp[default]'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify original creator and test ordinary public media access
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YTAP1: ${{ secrets.YTAP1 }}
          YTAPI1: ${{ secrets.YTAPI1 }}
          YT_KEY: ${{ secrets.YT_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/research/zack-access-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zack-original-access-review-evidence
          path: .cache/zack-access-review/
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
      - name: Preserve access diagnostics only; never publish competitor media
        if: always()
        run: |
          git config user.name 'Monarch reference research'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/research/zack-original-access/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record original-source footage access evidence [skip ci]'
          git pull --rebase origin arena/ba8d901e-monarch-overall-work
          git push origin HEAD:arena/ba8d901e-monarch-overall-work
