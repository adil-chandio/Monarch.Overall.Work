name: Continuity audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install renderer test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/render.txt
      - name: Repository validation
        run: python tools/studio.py validate
      - name: Continuity integrity and freshness
        run: python tools/continuity.py audit --max-age-minutes 70
      - name: Unit tests
        run: python -m unittest discover -s tests -v
