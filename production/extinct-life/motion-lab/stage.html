<!doctype html><html><head><meta charset="utf-8"><title>Extinct Life — Procedural Motion Study</title><style>*{box-sizing:border-box}body{margin:0;background:#071013;overflow:hidden}canvas{position:absolute;inset:0}#overlay{position:absolute;inset:0;pointer-events:none;font-family:Arial,sans-serif;color:#eee9dc}#brand{position:absolute;left:5%;top:6%;font-size:23px;letter-spacing:5px}#lab{position:absolute;right:5%;top:6%;font-size:16px;letter-spacing:3px;color:#b9c5c6}#copy{position:absolute;left:6%;bottom:16%;font-size:64px;font-weight:600;letter-spacing:-2px;line-height:1.03;max-width:650px}#label{position:absolute;left:6%;bottom:7%;font-size:17px;letter-spacing:2px;color:#b5bdb6}#shade{position:absolute;inset:0;box-shadow:inset 0 0 180px 30px #0008}</style></head><body><div id="overlay"><div id="brand">EXTINCT LIFE</div><div id="lab">R&D / MOTION STUDY</div><div id="copy"></div><div id="label">PROCEDURAL 3D · NOT SPECIMEN FOOTAGE</div><div id="shade"></div></div><script type="module">
import * as T from '/three.module.js';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1920,1080);renderer.setPixelRatio(1);renderer.setClearColor(0x071013);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.prepend(renderer.domElement);
const camera=new T.PerspectiveCamera(36,16/9,.025,180);
const scene=new T.Scene();scene.fog=new T.FogExp2(0x071013,.025);
scene.add(new T.HemisphereLight(0xb4d2de,0x21130b,2));
const key=new T.DirectionalLight(0xffdfad,4.0);key.position.set(-3,6,4);scene.add(key);
const rim=new T.DirectionalLight(0x71b9c8,4);rim.position.set(5,2,-4);scene.add(rim);
const fill=new T.PointLight(0xf2b778,28,18,2);fill.position.set(-2,2,1);scene.add(fill);
let seed=2718;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}const lerp=T.MathUtils.lerp;const clamp=x=>Math.max(0,Math.min(1,x));const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const grainGeo=new T.IcosahedronGeometry(.11,2);const grainMat=new T.MeshStandardMaterial({color:0xc1a47e,roughness:.91,metalness:.04});
const count=1250,grains=new T.InstancedMesh(grainGeo,grainMat,count);scene.add(grains);grains.frustumCulled=false;
const bases=[];const dummy=new T.Object3D();const color=new T.Color();
for(let i=0;i<count;i++){const a=rand()*Math.PI*2,b=Math.acos(rand()*2-1),r=2.4*Math.pow(rand(),.45);bases.push({x:Math.cos(a)*Math.sin(b)*r,y:Math.cos(b)*r*.6,z:Math.sin(a)*Math.sin(b)*r,s:.45+rand()*1.7,rx:rand()*6,ry:rand()*6,rz:rand()*6,layer:Math.floor(rand()*4)});color.setHSL(.07+rand()*.055,.12+rand()*.23,.17+rand()*.23);grains.setColorAt(i,color)}
const specimen=new T.Group();scene.add(specimen);
// Original mesh strata; not a sampled geological cross section.
const strata=[];
for(let i=0;i<5;i++){const g=new T.CylinderGeometry(1.8-i*.06,1.85-i*.05,.24,13,1);g.rotateY(i*.39);const m=new T.Mesh(g,new T.MeshStandardMaterial({color:[0x655341,0x493b31,0x7a6852,0x3d3931,0x8c7558][i],roughness:.95}));m.position.y=-.6+i*.22;specimen.add(m);strata.push(m)}
// Separate fragments, deliberately NOT a continuous genome/double helix.
const molecular=new T.Group();scene.add(molecular);
const cyan=new T.MeshStandardMaterial({color:0x91d0c3,emissive:0x267264,emissiveIntensity:.4,roughness:.35,metalness:.45});const amber=new T.MeshStandardMaterial({color:0xe4b264,emissive:0xa05a16,emissiveIntensity:.35,roughness:.4,metalness:.3});const bond=new T.MeshStandardMaterial({color:0x6f9690,roughness:.55,metalness:.3});
const segments=[];
for(let i=0;i<36;i++){const g=new T.Group(),n=3+Math.floor(rand()*5);for(let j=0;j<n;j++){const theta=j*.58;const x=Math.sin(theta)*.3,y=(j-n/2)*.22,z=Math.cos(theta)*.3;for(let sign of [-1,1]){const s=new T.Mesh(new T.SphereGeometry(.066,8,6),sign===1?cyan:amber);s.position.set(sign*x,y,sign*z);g.add(s)}const cyl=new T.Mesh(new T.CylinderGeometry(.025,.025,.6,6),bond);cyl.rotation.z=Math.PI/2;cyl.rotation.y=-theta+Math.PI/2;cyl.position.y=y;g.add(cyl)}g.position.set((rand()-.5)*15,(rand()-.5)*8,(rand()-.5)*16);g.rotation.set(rand()*3,rand()*3,rand()*3);molecular.add(g);segments.push({g,base:g.position.clone(),r:g.rotation.clone()})}
const hero=segments[0];hero.base.set(0,.4,0);hero.g.scale.setScalar(2.2);
const dustGeo=new T.BufferGeometry(),points=[];for(let i=0;i<550;i++)points.push((rand()-.5)*35,(rand()-.5)*20,(rand()-.5)*35);dustGeo.setAttribute('position',new T.Float32BufferAttribute(points,3));const dust=new T.Points(dustGeo,new T.PointsMaterial({color:0xa1b8ad,size:.024,transparent:true,opacity:.28,sizeAttenuation:true}));scene.add(dust);
const copy=document.querySelector('#copy'),label=document.querySelector('#label');
window.__seek=(f)=>{const t=f/60;const expanding=smooth((t-3.5)/3);
 for(let i=0;i<count;i++){const b=bases[i];const spread=1+expanding*3.0;dummy.position.set(b.x*spread,b.y*spread+expanding*(b.layer-1.5)*.55,b.z*spread);dummy.rotation.set(b.rx+expanding*.3,b.ry+t*.012,b.rz);dummy.scale.setScalar(b.s);dummy.updateMatrix();grains.setMatrixAt(i,dummy.matrix)}grains.instanceMatrix.needsUpdate=true;
 specimen.rotation.y=-.35+t*.09;specimen.rotation.z=.12;for(let i=0;i<5;i++)strata[i].position.y=-.6+i*.22+expanding*(i-2)*.8;
 grains.visible=t<9;specimen.visible=t<7; molecular.visible=t>=7;dust.rotation.y=t*.012;
 if(t<7){const q=smooth(t/7);camera.position.set(lerp(7.8,3.2,q),lerp(4.6,1.3,q),lerp(8.5,4,q));camera.lookAt(.1,0,0);copy.textContent=t<3.5?'Not just the surface.':'';copy.style.opacity=t<3.5?String(1-smooth((t-2.5)/1)): '0';label.textContent='PROCEDURAL 3D · SCHEMATIC SEDIMENT';}
 else if(t<12){const q=smooth((t-7)/5);camera.position.set(lerp(3.2,.6,q),lerp(1.3,.7,q),lerp(4,-4,q));camera.lookAt(-.4,.4,-8);copy.textContent='';copy.style.opacity='0';label.textContent='ABSTRACT DNA FRAGMENTS · NOT MOLECULAR DATA';}
 else{const q=smooth((t-12)/6);camera.position.set(Math.sin(q*1.15)*4.8,1.1+q*.7,5.2-Math.sin(q*.8)*1.5);camera.lookAt(0,.3,0);copy.textContent=t>14?'Read the fragments.':'';copy.style.opacity=String(smooth((t-14)/.7));label.textContent='MOTION PIPELINE TEST · NOT THE EPISODE OR FINAL ART DIRECTION';}
 for(const s of segments){s.g.position.copy(s.base);s.g.rotation.set(s.r.x+t*.035,s.r.y+t*.07,s.r.z);}
 renderer.render(scene,camera);
};window.__seek(0);window.__ready=true;
</script></body></html>
