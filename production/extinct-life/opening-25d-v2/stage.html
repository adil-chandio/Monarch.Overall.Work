function rail(t){const k=edit.cameraRail;if(t<=k[0].t)return k[0].v;if(t>=k.at(-1).t)return k.at(-1).v;let i=0;while(i<k.length-2&&t>k[i+1].t)i++;const A=k[i],B=k[i+1],dt=B.t-A.t,u=(t-A.t)/dt;const slope=j=>j===0?(k[1].v-k[0].v)/(k[1].t-k[0].t):j===k.length-1?(k[j].v-k[j-1].v)/(k[j].t-k[j-1].t):(k[j+1].v-k[j-1].v)/(k[j+1].t-k[j-1].t);return (2*u*u*u-3*u*u+1)*A.v+(u*u*u-2*u*u+u)*dt*slope(i)+(-2*u*u*u+3*u*u)*B.v+(u*u*u-u*u)*dt*slope(i+1);}
function shot(i,t){sceneTime=Math.max(0,t-starts[i]);const view=(sourceT,wide,cold)=>{const z=i===0?mix(1.10,1.02,ease(t/3.35)):i===5?mix(1,1.08,ease((t-23.45)/4.5)):i===6?mix(1.02,1.12,ease((t-27.95)/2.4)):i>=8?mix(1,1.06,ease((t-35.55)/9.45)):1;g.save();g.translate(960,580);g.scale(z,z);g.translate(-960,-580);world(sourceT,wide,cold);g.restore();};switch(i){
case 0:view(t,false,false);label('Northern Greenland · a lost lineage','Illustrated reconstruction · not actual footage');break;
case 1:view(t,true,true);label('Today · a very different coast','Concept landscape · not footage of the study site');break;
case 2:mapScene(t);break;
case 3:sediment(t);break;
case 4:comparison(t,false);break;
case 5:view(t,true,false);label('A community begins to emerge','Artistic reconstruction · not one proven simultaneous scene');break;
case 6:view(t-24,false,false);label('An outline, not a photograph.','Appearance is illustrative—not recovered from DNA');break;
case 7:comparison(t,true);break;
case 8:view(t,true,false);label('How much can we actually read?','Illustrated reconstruction');break;
case 9:{view(t,true,false);const q=ease((t-40.3)/.75);g.save();g.globalAlpha=q;g.fillStyle=grad(0,0,1400,0,[[0,'#092630eb'],[1,'#09263000']]);g.fillRect(0,0,W,H);text('EXTINCT LIFE',140,277,24,C.gold);text('The Lost World Inside',135,422,83,C.ivory,'AtlasSerif');g.save();g.globalAlpha*=ease((t-40.45)/.65);text('a Handful of Dirt',135,518,83,C.ivory,'AtlasSerif');g.restore();line([[140,579],[140+160*ease((t-40.6)/.8),579]],C.gold,2);text('A world made readable.',140,645,29,C.muted,'AtlasSerif');text('Kjær et al. · Nature (2022)',140,840,21,C.muted);text('10.1038/s41586-022-05453-y',140,877,21,C.muted);text('2.5D ILLUSTRATION · SYNTHETIC NARRATION',140,1020,17,C.muted);g.restore();break;}}
}
const deckA=document.createElement('canvas'),deckB=document.createElement('canvas');deckA.width=deckB.width=W;deckA.height=deckB.height=H;const ctxA=deckA.getContext('2d'),ctxB=deckB.getContext('2d');
function renderTo(ctx,i,t){g=ctx;g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';shot(i,t);g=master;}
function drawCarrier(seam,u){if(!seam.carrier)return;const q=ease(u),a=seam.carrier.from,b=seam.carrier.to,x=mix(a[0],b[0],q),y=mix(a[1],b[1],q)-Math.sin(q*Math.PI)*36;g.save();g.globalAlpha=Math.sin(u*Math.PI)*.7;const glow=g.createRadialGradient(x,y,1,x,y,32);glow.addColorStop(0,'#e9c58077');glow.addColorStop(1,'#e9c58000');g.fillStyle=glow;g.fillRect(x-32,y-32,64,64);ellipse(x,y,4,4,C.gold);g.restore();}
window.__seek=f=>{const t=f/FPS;g=master;g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;let idx=0;for(let i=1;i<starts.length;i++)if(t>=starts[i])idx=i;const seam=idx>0?edit.seams[idx-1]:null;if(seam&&idx!==9&&t<seam.t+seam.duration){const u=clamp((t-seam.t)/seam.duration);renderTo(ctxA,idx-1,t);renderTo(ctxB,idx,t);g=master;g.drawImage(deckA,0,0);g.save();g.globalAlpha=ease(u);g.drawImage(deckB,0,0);g.restore();drawCarrier(seam,u);}else{shot(idx,t);}g.save();g.globalAlpha=.16;g.fillStyle=grainPattern;g.fillRect(0,0,W,H);g.globalAlpha=1;const lens=g.createRadialGradient(960,500,550,960,500,1250);lens.addColorStop(0,'#041a2400');lens.addColorStop(1,'#041a2438');g.fillStyle=lens;g.fillRect(0,0,W,H);g.restore();};
window.__motionStats=t=>({camera:rail(t),time:t});
Promise.all([fetch('/greenland.json').then(r=>r.json()),document.fonts.load('80px AtlasSerif'),fetch('/edit.json').then(r=>r.json())]).then(([d,fonts,e])=>{mapData=d;edit=e;window.__seek(0);window.__ready=true;});
