  <rect x="90" y="230" width="1740" height="620" rx="12" fill="#131c2b" stroke="#2c3f5c" stroke-width="2"/><text x="118" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#5bd6d0" text-anchor="start" font-weight="700" >THE RULE, RESTATED</text><rect x="140" y="300" width="530" height="180" rx="12" fill="#17243a" stroke="#5bd6d0" stroke-width="3"/><text x="405" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#e8eef7" text-anchor="middle" font-weight="700" >1  PREDICTION</text><rect x="720" y="300" width="530" height="180" rx="12" fill="#17243a" stroke="#5bd6d0" stroke-width="3"/><text x="985" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#e8eef7" text-anchor="middle" font-weight="700" >2  VIOLATION</text><rect x="1300" y="300" width="530" height="180" rx="12" fill="#17243a" stroke="#5bd6d0" stroke-width="3"/><text x="1565" y="408" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#e8eef7" text-anchor="middle" font-weight="700" >3  SHORT DELAY</text><rect x="140" y="550" width="530" height="180" rx="12" fill="#17243a" stroke="#5bd6d0" stroke-width="3"/><text x="405" y="658" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#e8eef7" text-anchor="middle" font-weight="700" >4  REPAIR</text><rect x="720" y="550" width="530" height="180" rx="12" fill="#17243a" stroke="#5bd6d0" stroke-width="3"/><text x="985" y="658" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#e8eef7" text-anchor="middle" font-weight="700" >5  REPLAY</text><rect x="1300" y="550" width="530" height="180" rx="12" fill="#17243a" stroke="#5bd6d0" stroke-width="3"/><text x="1565" y="658" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" fill="#e8eef7" text-anchor="middle" font-weight="700" >6  SHARE</text><text x="130" y="810" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#ff9c9c" text-anchor="start" font-weight="400" >Honest limits: public counts only