<style>
  /* =====================================================================
     v4 · every position below was measured on REF-01, not composed by taste.
     Canvas 720x1280 (the reference's own master size), 30 fps, 23.35 s.
     Reference numbers live in docs/reference/REF-01-nvidia-reel.md.

  :root{

    --green-deep:#13400b;
    --red-plate:#a21a1b;     /* measured: 2008 plate base */

    --glass:#efe7d6;         /* measured: subscribe glyph / glass card core */

  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#000; overflow:hidden; }
  #root{ position:relative; width:720px; height:1280px; overflow:hidden; background:#000; }

  .scene{ position:absolute; inset:0; will-change:transform,opacity,filter;
          opacity:0; }   /* a scene paints only when the timeline turns it on */
  .layer{ position:absolute; }
  .plate{ position:absolute; inset:0; background-size:cover; background-position:center;
          /* REF-01's plates are soft. Measured on delivered frames: at 3px this
             build reads edge 3.00 on the CTA where the reference reads 1.68, and
             3.66 on the hook where it reads 2.23. 4px halves both gaps. */
          filter:blur(4px); }

                       box-shadow:0 10px 30px rgba(0,0,0,.28); }

          background:linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.16));
          backdrop-filter:blur(14px) saturate(1.2);
          box-shadow:0 2px 0 rgba(255,255,255,.45) inset, 0 -1px 0 rgba(0,0,0,.25) inset, 0 18px 40px rgba(0,0,0,.45); }

  /* ---------------------------------------------------------------- depth stage
     A flat plate can only breathe as one piece — measured, the rebuild's plates
     moved 0.00 % while the reference's shots push +2.3 %/s. Depth needs at least
     two planes that can move at different rates. This is the container that gives
     them a shared camera, and the per-plane class that lets each one be told how
     far away it is. The scale multipliers below are the parallax: `far` grows the
     least, `near` the most, so the same push separates them.
     */
  .stage{ position:absolute; inset:0; perspective:1400px; perspective-origin:50% 46%;
          overflow:hidden; }
  .plane{ position:absolute; inset:0; will-change:transform;

<script>
(function () {
  "use strict";
  var d = document;
  var FPS = 30, TOTAL = 23.35;

  /* the reference's own cut list, in seconds — measured, see REF-01 §2 */
  var CUTS = [0.533, 0.833, 1.000, 1.300, 3.133, 9.133, 11.700,
              12.167, 12.467, 12.967, 13.333, 14.800];

  /* ------------------------------------------------------------------ scenes
     One table owns visibility. The first attempt used hand-written `set` calls and
     they fought each other: a `fromTo` created after a `set` on the same property
     wins for the whole overlap, so three scenes were never hidden. Now each scene
     is one row, and the only tweens ever touching a scene's own opacity are its
     fade-in and its hide.

     A dissolve starts BEFORE its cut (35 % of its length) and finishes after it
     (65 %), so the frame at the cut is already visibly different from the frame
     before it — that is what makes the cut measurable, and it is exactly what the
     reference does: the outgoing plate is still underneath while the next one
     arrives. */
  var SCENES = [
    // id,   in,     dissolve, out
    ["s1",   0.000,  0.00,   0.533],
    ["s2",   0.533,  0.00,   0.833],
    ["s3",   0.833,  0.17,   1.000],
    ["s4",   1.000,  0.43,   1.300],
    ["s5",   1.300,  0.00,   3.133],
    ["s6",   3.133,  0.00,   9.133],
    ["s7",   9.133,  0.00,  11.700],
    ["s8",  11.700,  0.00,  12.167],
    ["s9",  12.167,  0.00,  12.467],
    ["s10", 12.467,  0.00,  12.667],
    ["s15", 12.667,  0.00,  12.967],
    ["s12", 12.967,  0.00,  13.333],
    ["s13", 13.333,  0.37,  14.800],
    ["s14", 14.800,  0.00,  99.000]
  ];

  var tl = gsap.timeline({ paused: true });

  /* frame-snap: a cut that is not on a frame boundary can only be applied on the
     next frame, which is where the 1-2 frame drift in the loop came from */
  var fr = function (t) { return Math.round(t * FPS) / FPS; };

  SCENES.forEach(function (row, i) {
    var id = "#" + row[0], inT = fr(row[1]), dis = row[2], outT = fr(row[3]);
    /* a scene that starts at 0 must not get a zero-length "hide" at 0 first: the
       hide and the show land on the same tick and the renderer captures the hide,
       which is why the first six frames of the film were pure black */
    if (inT > 0) tl.set(id, { opacity: 0 }, 0);
    if (dis > 0) {
      /* Jolt, then settle — this is what REF-01 actually does.
         Its alpha profile at 0.833 reads 0 -> 0.757 in ONE frame, then a slow climb
         to 1.0. A smooth crossfade (my first, second and third attempt) only gets
         the incoming plate to ~17 % by the cut, so the cut frame changes by almost
         nothing and the detector scores it 0.12 against the reference's 1.33.
         Here the plate lands at 0.66 on the cut frame and finishes over the rest of
         the span, while the outgoing plate fades out underneath it. The cut frame
         then carries a two-thirds change — a cut you can feel. */
      tl.set(id, { opacity: 0.66 }, Math.max(inT - 1 / FPS, 0));
      /* the entrance may never outlive its own window: s4's entrance ran to 1.3225 s
         while its hide was a set at 1.300 s, so the running tween wrote opacity 1
         straight back after the hide and s4 stood on screen until the end of the
         film — under every later scene, and in front of them wherever a later scene
         has a transparent or backdrop-filtered layer. Clamping the entrance to the
         scene's own display window is what makes the hide stick. */
      var entDur = Math.min(Math.max(dis * 0.75, 2 / FPS), Math.max(outT - inT, 1 / FPS));
      tl.to(id, { opacity: 1, duration: entDur, ease: "power2.out" }, inT);
    } else {
      /* Set at the very start of the composition when it is the opening scene, so
         that time 0 — the frame the renderer captures first — is already correct.
         It has to be AT 0, not at 0.0001: a set 0.1 ms in the future has not fired
         when the timeline is at exactly 0, and seeking backwards over it restores
         the recorded start value (opacity 0), which is why frame 0 was still black
         after the hide collision was fixed. With no hide at 0 any more, a show at 0
         is safe. */
      tl.set(id, { opacity: 1 }, inT);
    }
    /* the outgoing plate stays AT full opacity on the cut frame, then fades under
       the incoming one — otherwise the frame that matters most is a fade to black */
    var next = SCENES[i + 1];
    if (outT < 90) {
      if (next && next[2] > 0) {
        tl.to(id, { opacity: 0, duration: Math.max(next[2] * 0.75, 2 / FPS), ease: "none" }, outT);
      } else {
        tl.set(id, { opacity: 0 }, outT);
      }
    }
  });

  /* ---------------------------------------------------------------- helpers */
  /* a whip-in: the reference never eases a reveal, it arrives and stops */
  function slam(sel, t, fromX, dur) {
    /* the type arrives in ~3 frames; the motion blur sells the hit, and keeping the
       travel short means the cut stays the biggest change in its own window */
    tl.fromTo(sel, { x: fromX * 0.35, opacity: 0, filter: "blur(16px)" },
      { x: 0, opacity: 1, filter: "blur(0px)", duration: Math.min(dur, 0.11), ease: "power3.out" }, t);
  }

  /* ================= S1 · slow green reveal on white ================= */
  /* the hook has to move: 0.108 motion in the reference's first second, measured.
     A word fading up cannot reach that, so the plate pushes and the word rises into
     it — the same trick the reference uses before its first cut. */
  /* three things move at once so the first second has the reference's density:
     the gradient pushes back, a ghost word crosses frame, and the real word lands */
  tl.fromTo("#s1zoom", { scale: 1.22 }, { scale: 1.0, duration: 0.55, ease: "power2.out" }, 0);
  tl.fromTo("#s1ghost", { x: 0 }, { x: 660, duration: 0.55, ease: "power1.out" }, 0);
  tl.fromTo("#s1sweep", { x: 0 }, { x: 1320, duration: 0.46, ease: "power1.inOut" }, 0.03);
  tl.set("#s1sweep", { opacity: 0 }, 0.50);
  tl.fromTo("#s1w", { opacity: 0, y: 28, scale: 0.95 },
    { opacity: 1, y: 0, scale: 1, duration: 0.26, ease: "power3.out" }, 0.10);

  /* ================= S2 · TWENTY slides in, BILLION snaps onto it ===== */
  tl.set("#s2a", { x: -260, opacity: 0, filter: "blur(14px)" }, 0);
  tl.to("#s2a", { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.10, ease: "power3.out" }, 0.533);
  tl.set("#s2b", { x: 200, opacity: 0, filter: "blur(14px)" }, 0);
  tl.to("#s2b", { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.10, ease: "power3.out" }, 0.567);

  /* ================= S3 / S4 · the green field, then the envelope =========
     REF-01 measured frame by frame: at 0.95 s the envelope and "BILLION" are
     already on screen over the same green field, flying in with motion blur. So
     0.83-1.30 is one continuous move, and the plate only settles at 1.27 s.

     The motion is therefore built in code and read off the reference: the
     envelope arrives from frame-left and slightly low, overshooting to the right
     and settling — a jolt, not an ease — while the whole frame creeps out by 3 %
     over the 1.3 s, which is the camera push the depth probe measured (+2.4 %/s). */
  tl.fromTo("#s4plate", { x: -190, y: 70, scale: 1.16, rotation: -2.2 },
    { x: 14, y: -6, scale: 1.05, rotation: 0, duration: 0.34, ease: "power3.out" }, 0.833);
  tl.to("#s4plate", { x: 0, y: 0, scale: 1.0, duration: 0.30, ease: "power2.inOut" }, 1.173);
  /* the field breathes for the whole window: this is the push, applied to the
     whole plate so nothing is cut and nothing can seam */
  tl.fromTo("#s4", { scale: 1.0 }, { scale: 1.035, duration: 0.99, ease: "none" }, 0.833);

  /* ================= S5 · HE SAID NO ======================================
     The plate is the reference's own frame at 2.10 s, used 1:1 — measured against
     the reference at the same timestamp, the bag lands within 3 px and 0.4 %, so
     nothing here is composed by hand. What moves is only what the reference moves.

     The camera push was the one thing that was wrong: 5.2 % here, while the
     reference gains 1.0 % across this window (bag template, 1.000 -> 1.010). A
     push that is five times too strong makes the bag read larger and lower than
     the reference at every frame, which is what it was doing. */
  tl.fromTo("#s5", { scale: 1.0 }, { scale: 1.010, duration: 1.83, ease: "none" }, 1.30);

  /* The colour of this shot, measured as the share of the frame that reads green
     (a count of pixels, so it cannot be fooled the way a mean saturation can):

         reference  1.32 s 15.2 %   1.50 8.2 %   1.70 6.2 %   2.05 4.8 %   2.25 0 %

     The plate is that 4.8 % state and the field then finishes draining to nothing
     by 2.25. So most of the drain happens BEFORE the plate's own timestamp — the
     scene opens far greener than the frame the plate was taken from, and that is
     why holding the plate still showed green where the reference was grey. */
  tl.fromTo("#s5plate", { filter: "saturate(2.1)" },
    { filter: "saturate(1.0)", duration: 0.78, ease: "power2.out" }, 1.32);
  tl.to("#s5plate", { filter: "saturate(0.05)", duration: 0.25, ease: "power1.in" }, 2.00);

  /* HE SAID and NO are two beats, not one: HE SAID is a faint pre-echo in the
     reference from about 2.2 s and solid by 2.45, NO slams 2.35 -> 2.95 and is the
     harder hit, so it travels further. */
  /* Measured arrival, not a guess: HE SAID is faint from 2.10 and solid by 2.45,
     a fade with almost no scale. NO is not there at 2.50 and is 461 px wide at
     2.60 — full size inside a tenth of a second — so it does not fly in, it
     arrives. A big scale-in was the one thing this scene was doing that the
     reference never does. */
  tl.fromTo("#s5he", { opacity: 0, scale: 1.06, y: 6 },
    { opacity: 1, scale: 1.0, y: 0, duration: 0.35, ease: "power2.out" }, 2.10);
  tl.fromTo("#s5no", { opacity: 0, scale: 1.05, y: 6 },
    { opacity: 1, scale: 1.0, y: 0, duration: 0.10, ease: "none" }, 2.54);

  /* ================= S6 · the reveal plate ================================
     Reference: the mark spins up, the money arrives, "2008" fades up, then the
     subject rises from the bottom edge. 6.00 s hold, and the reference pushes
     +2.4 %/s across the whole of it.

     This is the depth shot. Three planes ride ONE camera push at three
     distances, so a single gesture separates them:

       far    the 2008 field and its raking light   x1.000  (the reference's pace)
       mid    the hand, the money, the mark         x1.028
       near   the man, cut from his own background  x1.060

     On top of that the planes drift apart laterally and the near plane settles
     down from its entrance, so the separation is visible at any single frame and
     not only when the shot is over. The multipliers are not decoration: at
     x1.028 over 6 s the mid plane gains 17 % against the far plane, which is a
     real parallax ratio rather than the 1.0005 the flat build measured. */
  tl.fromTo("#logoMark", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2)" }, 3.15);
  tl.fromTo("#wire", { opacity: 0, scale: .92, transformOrigin: "50% 60%" }, { opacity: .55, scale: 1, duration: 0.7, ease: "power2.out" }, 3.31);
  tl.fromTo("#s6hand", { opacity: 0, x: -70, y: 40 }, { opacity: 1, x: 0, y: 0, duration: 0.55, ease: "power3.out" }, 3.42);
  tl.fromTo("#s6yr", { opacity: 0, filter: "blur(18px)" },
    { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power2.out" }, 3.62);

  /* the man arrives from the bottom edge, and his plane is the closest one */
  tl.fromTo("#s6near", { opacity: 0, y: 150 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 4.68);

  /* ---- the camera: one push, three distances ---- */
  tl.fromTo("#s6far",  { scale: 1.000 }, { scale: 1.146, duration: 6.0, ease: "none" }, 3.133);
  tl.fromTo("#s6mid",  { scale: 1.000 }, { scale: 1.178, duration: 6.0, ease: "none" }, 3.133);
  tl.fromTo("#s6near", { scale: 1.000 }, { scale: 1.214, duration: 6.0, ease: "none" }, 3.133);

  /* the planes also slide at different rates — a push alone reads as a zoom,
     lateral separation is what reads as depth */
  tl.fromTo("#s6far", { x: 0 }, { x: -26, duration: 6.0, ease: "none" }, 3.133);
  tl.fromTo("#s6mid", { x: 0 }, { x: 14, duration: 6.0, ease: "none" }, 3.133);
  tl.fromTo("#s6near", { x: 0 }, { x: 34, duration: 6.0, ease: "none" }, 3.133);

  /* the light rakes across the far plane — the reference's 2008 field is lit, and
     this is the far plane's own motion so it adds depth without moving the man */
  tl.fromTo("#s6rays", { x: -90, opacity: .18 }, { x: 60, opacity: .42, duration: 6.0, ease: "none" }, 3.133);

  /* ================= S7 · red-eye toggle + yellow pill ===================
     Measured: the cut does not change the shot. R/G goes 1.40 -> 1.75 in 3 frames.
     The pill arrives at 9.70 s and holds. 2.57 s, then the loop restarts. */
  /* the cut at 9.133 is not a new subject, it is a new grade: the plate goes, the
     frame tightens and cools, and only then do the eyes burn. Without the grade
     shift the frame is near-identical to shot 6 and the cut disappears. */
  /* Shot 7 measures [22,12,6] in this build; REF-01's own shot 7 is [52,29,29].
     Grading it up to the reference's colour was tried and REVERTED: at
     brightness 1.70 the plate becomes as bright as shot 6, the 9.133 s cut stops
     reading as a cut (13 cuts -> 12, recall 11/13, worst offset 2600 ms) and the
     film loses a node of its edit to gain a luma point it was already passing.
     Measured, not argued — tools/grade_sim.py solves the colour, the diff run
     showed the price. The real fix is a different plate for this shot, not a
     brighter grade on this one. */
  tl.set("#s7img", { filter: "none" }, 0);
  tl.set("#s7img", { filter: "brightness(.70) contrast(1.28) saturate(.55)" }, 9.133);
  tl.set("#s7img", { filter: "brightness(.62) contrast(1.30) saturate(.50)" }, 20.700);
  tl.fromTo("#s7img", { scale: 1.0 }, { scale: 1.04, duration: 2.57, ease: "none" }, 9.133);
  /* the grade arrives with the cut: at 9.133 the frame is already red-eyed in the
     reference (R/G 1.75 on shot 7's first frame), and that colour jump is most of
     why this cut reads as a cut at all */
  tl.set("#redEye", { opacity: 0 }, 0);
  tl.to("#redEye", { opacity: 1, duration: 3 / FPS, ease: "none" }, 9.133 - 1 / FPS);
  tl.fromTo("#pillY", { opacity: 0, y: 26, scale: .92 },
    { opacity: 1, y: 0, scale: 1, duration: 0.26, ease: "back.out(1.8)" }, 9.82);

  /* ================= S8–S13 · the same five shots, tighter ===============
     The reference replays its own motif here at 0.47 / 0.30 / 0.20 / 0.30 / 0.37 /
     1.47 s, so the viewer feels "I have seen this" at 11.7 s. */
  tl.fromTo("#s8w", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.24, ease: "power2.out" }, 11.73);

  tl.set("#s9a", { x: -260, opacity: 0, filter: "blur(14px)" }, 0);
  tl.to("#s9a", { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.09, ease: "power3.out" }, 12.167);
  tl.set("#s9b", { x: 200, opacity: 0, filter: "blur(14px)" }, 0);
  tl.to("#s9b", { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.09, ease: "power3.out" }, 12.167);

  tl.set("#s15b", { rotation: -7, scale: 1.05 }, 0);
  tl.to("#s15b", { scale: 1, duration: 0.14, ease: "power2.out" }, 12.667);

  slam("#s13he",   13.76, -70, 0.14);
  slam("#s13said", 13.88, -90, 0.14);
  slam("#s13no",   14.04, -150, 0.18);

  /* ================= S14 · the CTA ======================================
     Reference: plate holds 0.65 s, the subject arrives, the yellow pill lands, a
     2-frame flash at 20.633 re-grades him, and the glass card holds to the end.
     8.55 s — 36 % of the film is CTA. That is the format, not an accident. */
  tl.set("#s14plate", { opacity: 1 }, 0);
  tl.to("#s14warm", { opacity: 1, duration: 0.30, ease: "none" }, 15.45);
  tl.to("#s14warm", { opacity: 0, duration: 0.25, ease: "none" }, 20.70);
  tl.fromTo("#s14img", { opacity: 0, y: 300 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 15.45);
  tl.fromTo("#s14img", { scale: 1.07 }, { scale: 1.0, duration: 6.6, ease: "none" }, 16.07);
  tl.to("#s14plate", { opacity: 0, duration: 0.45, ease: "none" }, 15.45);
  /* Measured off REF-01: the yellow pill starts arriving at 19.03 and is still
     growing at 19.9 (its yellow-pixel share climbs 0.8% -> 3.1% -> 4.5% -> 6.0% ->
     7.5% across that span). The build popped it in fully at 18.72, which is both
     early and instant. */
  tl.fromTo("#s14pillY", { opacity: 0, scale: .82 }, { opacity: 1, scale: 1, duration: 0.92, ease: "power2.out" }, 19.03);

  /* The flash, re-measured off REF-01 frame by frame (mean luma of the decoded
     picture):   49 49 49 46 46 46 61 61 145 139 139 48 47 49 48 45 45 42 40 40
     so it is THREE frames — 145 then 139 then 139 — building over one frame at 61
     and decaying through 48 to a slower fall afterwards. The build had it as two
     frames flat at 217/255 = 0.85, which is both shorter and harder than the
     reference, so the cut at 20.633 read differently to the eye and to any
     brightness metric. 145 luma over a ~40 base needs the white at ~0.5, not 0.9. */
  tl.set("#flash", { opacity: 0 }, 0);
  tl.set("#flash", { opacity: 0.22 }, 20.633 - 2 / FPS);
  tl.set("#flash", { opacity: 0.52 }, 20.633 - 1 / FPS);
  tl.set("#flash", { opacity: 0.50 }, 20.633);
  tl.set("#flash", { opacity: 0.50 }, 20.633 + 1 / FPS);
  tl.set("#flash", { opacity: 0.0 }, 20.633 + 3 / FPS);
  tl.to("#s14red", { opacity: 1, duration: 3 / FPS, ease: "none" }, 20.700);
  /* REF-01's cut detector finds no cut at 20.633, and neither should this build:
     the flash alone is within what the detector absorbs. The pill was clearing on
     exactly that frame, stacking a second full change onto the flash, which is what
     produced "1 extra cut" in the diff. It now clears after the flash, into the
     glass card. */
  tl.to("#s14pillY", { opacity: 0, scale: .96, duration: 0.22, ease: "power2.in" }, 20.750);
  tl.fromTo("#glassCard", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.30, ease: "power2.out" }, 20.800);
  tl.to("#s14", { scale: 1.004, duration: 2.5, ease: "none" }, 20.85);

  /* ---------------------------------------------------------------- hand-off */
  tl.time(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  window.__duration = TOTAL;
  window.__fps = FPS;
  window.__scenes = SCENES;
  /* the same table as data, so a checker can verify the render against it */
  window.__sceneTable = {
    fps: FPS,
    duration: TOTAL,
    /* 23.35 s is 700.5 frames at 30 fps; the renderer takes Math.round, so 701 */
    frames: Math.round(TOTAL * FPS + 0.5),
    scenes: SCENES.map(function (r) {
      return { id: r[0], in: r[1], dissolve: r[2], out: r[3] };
    }),
    /* full-frame effects: for these frames no single plate owns the picture, so a
       per-scene colour check must skip them rather than call them wrong */
    flashes: [[20.633 - 2 / FPS, 20.633 + 3 / FPS]]
  };
  if (d.fonts && d.fonts.ready) {
    d.fonts.ready.then(function () { d.documentElement.setAttribute("data-fonts", "ready"); });
  }
})();
</script>
</body>
</html>
