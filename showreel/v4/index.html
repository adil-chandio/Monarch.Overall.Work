<script src="./vendor/gsap.min.js"></script>
<script>
(function () {
  "use strict";
  var d = document;
  var FPS = 30, TOTAL = 23.35;

  /* the reference's own cut list, in seconds — measured, see REF-01 §2 */
  var CUTS = [0.533, 0.833, 1.000, 1.300, 3.133, 9.133, 11.700,
              12.167, 12.467, 12.967, 13.333, 14.800];

  /* ------------------------------------------------------------------ scenes
     One table owns visibility. The first attempt used hand-written `set` calls and
     they fought each other: a `fromTo` created after a `set` on the same property
     wins for the whole overlap, so three scenes were never hidden. Now each scene
     is one row, and the only tweens ever touching a scene's own opacity are its
     fade-in and its hide.

     A dissolve starts BEFORE its cut (35 % of its length) and finishes after it
     (65 %), so the frame at the cut is already visibly different from the frame
     before it — that is what makes the cut measurable, and it is exactly what the
     reference does: the outgoing plate is still underneath while the next one
     arrives. */
  var SCENES = [
    // id,   in,     dissolve, out
    ["s1",   0.000,  0.00,   0.533],
    ["s2",   0.533,  0.00,   0.833],
    ["s3",   0.833,  0.17,   1.000],
    ["s4",   1.000,  0.43,   1.300],
    ["s5",   1.300,  0.00,   3.133],
    ["s6",   3.133,  0.00,   9.133],
    ["s7",   9.133,  0.00,  11.700],
    ["s8",  11.700,  0.00,  12.167],
    ["s9",  12.167,  0.00,  12.467],
    ["s10", 12.467,  0.00,  12.667],
    ["s15", 12.667,  0.00,  12.967],
    ["s12", 12.967,  0.00,  13.333],
    ["s13", 13.333,  0.37,  14.800],
    ["s14", 14.800,  0.00,  99.000]
  ];

  var tl = gsap.timeline({ paused: true });

  /* frame-snap: a cut that is not on a frame boundary can only be applied on the
     next frame, which is where the 1-2 frame drift in the loop came from */
  var fr = function (t) { return Math.round(t * FPS) / FPS; };

  SCENES.forEach(function (row, i) {
    var id = "#" + row[0], inT = fr(row[1]), dis = row[2], outT = fr(row[3]);
    tl.set(id, { opacity: 0 }, 0);
    if (dis > 0) {
      /* Jolt, then settle — this is what REF-01 actually does.
         Its alpha profile at 0.833 reads 0 -> 0.757 in ONE frame, then a slow climb
         to 1.0. A smooth crossfade (my first, second and third attempt) only gets
         the incoming plate to ~17 % by the cut, so the cut frame changes by almost
         nothing and the detector scores it 0.12 against the reference's 1.33.
         Here the plate lands at 0.66 on the cut frame and finishes over the rest of
         the span, while the outgoing plate fades out underneath it. The cut frame
         then carries a two-thirds change — a cut you can feel. */
      tl.set(id, { opacity: 0.66 }, Math.max(inT - 1 / FPS, 0));
      tl.to(id, { opacity: 1, duration: Math.max(dis * 0.75, 2 / FPS), ease: "power2.out" }, inT);
    } else {
      tl.set(id, { opacity: 1 }, inT);
    }
    /* the outgoing plate stays AT full opacity on the cut frame, then fades under
       the incoming one — otherwise the frame that matters most is a fade to black */
    var next = SCENES[i + 1];
    if (outT < 90) {
      if (next && next[2] > 0) {
        tl.to(id, { opacity: 0, duration: Math.max(next[2] * 0.75, 2 / FPS), ease: "none" }, outT);
      } else {
        tl.set(id, { opacity: 0 }, outT);
      }
    }
  });

  /* ---------------------------------------------------------------- helpers */
  /* a whip-in: the reference never eases a reveal, it arrives and stops */
  function slam(sel, t, fromX, dur) {
    /* the type arrives in ~3 frames; the motion blur sells the hit, and keeping the
       travel short means the cut stays the biggest change in its own window */
    tl.fromTo(sel, { x: fromX * 0.35, opacity: 0, filter: "blur(16px)" },
      { x: 0, opacity: 1, filter: "blur(0px)", duration: Math.min(dur, 0.11), ease: "power3.out" }, t);
  }

  /* ================= S1 · slow green reveal on white ================= */
  /* the hook has to move: 0.108 motion in the reference's first second, measured.
     A word fading up cannot reach that, so the plate pushes and the word rises into
     it — the same trick the reference uses before its first cut. */
  tl.fromTo("#s1plate", { scale: 1.10 }, { scale: 1.0, duration: 0.6, ease: "power2.out" }, 0);
  tl.fromTo("#s1sweep", { x: 0 }, { x: 1280, duration: 0.52, ease: "power1.inOut" }, 0.02);
  tl.set("#s1sweep", { opacity: 0 }, 0.56);
  tl.fromTo("#s1w", { opacity: 0, x: -46, scale: 0.96 },
    { opacity: 1, x: 0, scale: 1, duration: 0.30, ease: "power3.out" }, 0.05);

  /* ================= S2 · TWENTY slides in, BILLION snaps onto it ===== */
  tl.set("#s2a", { x: -260, opacity: 0, filter: "blur(14px)" }, 0);
  tl.to("#s2a", { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.10, ease: "power3.out" }, 0.533);
  tl.set("#s2b", { x: 200, opacity: 0, filter: "blur(14px)" }, 0);
  tl.to("#s2b", { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.10, ease: "power3.out" }, 0.567);

  /* ================= S3 / S4 · macro into the bag (measured dissolves) ====== */
  tl.set("#s4b", { rotation: -7, scale: 1.05 }, 0);
  tl.to("#s4b", { scale: 1, duration: 0.16, ease: "power2.out" }, 1.000);

  /* ================= S5 · the match-move ==================================
     One continuous move, no cut: the shot is born zoomed into the green plate and
     pulls back to reveal the stool in the cloudscape, then type arrives on top.
     Measured in the reference: 1.83 s hold, drift 8.3 %W, brightness ramp +39.9. */
  tl.fromTo("#s5 .plate", { scale: 1.26, transformOrigin: "50% 58%" },
    { scale: 1, duration: 0.85, ease: "power3.out" }, 1.30);
  tl.fromTo("#s5", { filter: "brightness(1.18)" }, { filter: "brightness(1)", duration: 0.9, ease: "power2.out" }, 1.30);
  slam("#s5he",   2.02, -70, 0.16);
  slam("#s5said", 2.16, -90, 0.16);
  slam("#s5no",   2.36, -150, 0.20);

  /* ================= S6 · the reveal plate ================================
     Reference: logo spins, two hands bring the note, "2008" fades up, then the
     subject rises from the bottom edge into frame. 6.00 s hold. */
  tl.fromTo("#logoMark", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2)" }, 3.15);
  tl.fromTo("#wire", { opacity: 0, scale: .92, transformOrigin: "50% 60%" }, { opacity: .55, scale: 1, duration: 0.7, ease: "power2.out" }, 3.31);
  /* arrives with the cut, in place: a full-frame plate that travels is a cut of its own */
  tl.set("#s6img", { opacity: 1 }, 3.133);
  tl.fromTo("#s6yr", { opacity: 0, filter: "blur(18px)" },
    { opacity: 1, filter: "blur(0px)", duration: 2 / FPS, ease: "none" }, 3.62);
  tl.fromTo("#s6man", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.68);
  tl.fromTo("#s6man", { scale: 1.06 }, { scale: 1.0, duration: 4.2, ease: "none" }, 4.68);

  /* ================= S7 · red-eye toggle + yellow pill ===================
     Measured: the cut does not change the shot. R/G goes 1.40 -> 1.75 in 3 frames.
     The pill arrives at 9.70 s and holds. 2.57 s, then the loop restarts. */
  /* the cut at 9.133 is not a new subject, it is a new grade: the plate goes, the
     frame tightens and cools, and only then do the eyes burn. Without the grade
     shift the frame is near-identical to shot 6 and the cut disappears. */
  tl.set("#s7img", { filter: "none" }, 0);
  tl.set("#s7img", { filter: "brightness(.70) contrast(1.28) saturate(.55)" }, 9.133);
  tl.set("#s7img", { filter: "brightness(.62) contrast(1.30) saturate(.50)" }, 20.700);
  tl.fromTo("#s7img", { scale: 1.0 }, { scale: 1.04, duration: 2.57, ease: "none" }, 9.133);
  /* the grade arrives with the cut: at 9.133 the frame is already red-eyed in the
     reference (R/G 1.75 on shot 7's first frame), and that colour jump is most of
     why this cut reads as a cut at all */
  tl.set("#redEye", { opacity: 0 }, 0);
  tl.to("#redEye", { opacity: 1, duration: 3 / FPS, ease: "none" }, 9.133 - 1 / FPS);
  tl.fromTo("#pillY", { opacity: 0, y: 26, scale: .92 },
    { opacity: 1, y: 0, scale: 1, duration: 0.26, ease: "back.out(1.8)" }, 9.82);

  /* ================= S8–S13 · the same five shots, tighter ===============
     The reference replays its own motif here at 0.47 / 0.30 / 0.20 / 0.30 / 0.37 /
     1.47 s, so the viewer feels "I have seen this" at 11.7 s. */
  tl.fromTo("#s8w", { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.24, ease: "power2.out" }, 11.73);

  tl.set("#s9a", { x: -260, opacity: 0, filter: "blur(14px)" }, 0);
  tl.to("#s9a", { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.09, ease: "power3.out" }, 12.167);
  tl.set("#s9b", { x: 200, opacity: 0, filter: "blur(14px)" }, 0);
  tl.to("#s9b", { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.09, ease: "power3.out" }, 12.167);

  tl.set("#s15b", { rotation: -7, scale: 1.05 }, 0);
  tl.to("#s15b", { scale: 1, duration: 0.14, ease: "power2.out" }, 12.667);

  slam("#s13he",   13.76, -70, 0.14);
  slam("#s13said", 13.88, -90, 0.14);
  slam("#s13no",   14.04, -150, 0.18);

  /* ================= S14 · the CTA ======================================
     Reference: plate holds 0.65 s, the subject arrives, the yellow pill lands, a
     2-frame flash at 20.633 re-grades him, and the glass card holds to the end.
     8.55 s — 36 % of the film is CTA. That is the format, not an accident. */
  tl.set("#s14plate", { opacity: 1 }, 0);
  tl.to("#s14warm", { opacity: 1, duration: 0.30, ease: "none" }, 15.45);
  tl.to("#s14warm", { opacity: 0, duration: 0.25, ease: "none" }, 20.70);
  tl.fromTo("#s14img", { opacity: 0, y: 300 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 15.45);
  tl.fromTo("#s14img", { scale: 1.07 }, { scale: 1.0, duration: 6.6, ease: "none" }, 16.07);
  tl.to("#s14plate", { opacity: 0, duration: 0.45, ease: "none" }, 15.45);
  tl.fromTo("#s14pillY", { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.8)" }, 18.72);

  /* the flash: 2 frames, exactly as measured at 20.633 s */
  tl.set("#flash", { opacity: 0 }, 0);
  tl.set("#flash", { opacity: 0.9 }, 20.633);
  tl.set("#flash", { opacity: 0 }, 20.633 + 2 / FPS);
  tl.to("#s14red", { opacity: 1, duration: 3 / FPS, ease: "none" }, 20.700);
  tl.to("#s14pillY", { opacity: 0, scale: .96, duration: 0.16, ease: "power2.in" }, 20.633);
  tl.fromTo("#glassCard", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.30, ease: "power2.out" }, 20.800);
  tl.to("#s14", { scale: 1.004, duration: 2.5, ease: "none" }, 20.85);

  /* ---------------------------------------------------------------- hand-off */
  tl.time(0);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  window.__duration = TOTAL;
  window.__fps = FPS;
  window.__scenes = SCENES;
  /* the same table as data, so a checker can verify the render against it */
  window.__sceneTable = {
    fps: FPS,
    duration: TOTAL,
    /* 23.35 s is 700.5 frames at 30 fps; the renderer takes Math.round, so 701 */
    frames: Math.round(TOTAL * FPS + 0.5),
    scenes: SCENES.map(function (r) {
      return { id: r[0], in: r[1], dissolve: r[2], out: r[3] };
    }),
    /* full-frame effects: for these frames no single plate owns the picture, so a
       per-scene colour check must skip them rather than call them wrong */
    flashes: [[20.633, 20.633 + 2 / FPS]]
  };
  if (d.fonts && d.fonts.ready) {
    d.fonts.ready.then(function () { d.documentElement.setAttribute("data-fonts", "ready"); });
  }
})();
</script>
